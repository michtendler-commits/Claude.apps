<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Jumper X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Bright cartoon sky world; white rounded HUD pills, chunky outlined display type, purple buttons */
  :root {
    color-scheme: light;
    --sky: #5ccff3;
    --sky-deep: #3fb8e6;
    --ink: #1d1f2b;
    --card: #ffffff;
    --soft: #f1f4fb;
    --line: #d7ddef;
    --text: #1d1f2b;
    --muted: #5d6580;
    --purple: #4b3fd1;
    --purple-dark: #2f2595;
    --green: #5fd93a;
    --gold: #ffc61a;
    --heart: #ff4d6d;
    --ember: #ff7a1a;
    --display: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --body: 'Nunito', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--sky); color: var(--text); font-family: var(--body);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: clamp(6px, 1.8vw, 10px);
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
    white-space: nowrap; pointer-events: none;
  }
  .hud[hidden] { display: none; }
  .pill {
    background: var(--card); border-radius: 12px; padding: 8px clamp(10px, 2.6vw, 18px);
    font: 900 clamp(13px, 3.4vw, 19px) var(--body); color: var(--text); font-variant-numeric: tabular-nums;
    box-shadow: 0 3px 0 rgba(29, 31, 43, .18);
  }
  .pill:empty { display: none; }
  .hud .hearts { color: var(--heart); letter-spacing: 1px; }
  .hud .fx { font-size: clamp(12px, 3vw, 16px); }
  .hud .grow { flex: 1; }
  .coin-dot { display: inline-block; width: .9em; height: .9em; border-radius: 50%; background: var(--gold);
              border: 2px solid var(--ink); vertical-align: -.1em; margin-right: 6px; }
  .hud button {
    pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: var(--card);
    font: 900 17px var(--body); color: var(--text); box-shadow: 0 3px 0 rgba(29, 31, 43, .18);
  }

  /* ---------- touch controls ---------- */
  .touch {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: none; align-items: flex-end; gap: 12px;
    padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .touch button {
    pointer-events: auto; touch-action: none;
    width: clamp(62px, 17vw, 84px); height: clamp(62px, 17vw, 84px); border-radius: 50%;
    background: rgba(255, 255, 255, .55); border: 3px solid var(--ink); font-size: 26px; color: var(--ink);
    box-shadow: 0 4px 0 rgba(29, 31, 43, .35);
  }
  .touch button.on { background: rgba(255, 255, 255, .9); transform: translateY(2px); box-shadow: 0 2px 0 rgba(29, 31, 43, .35); }
  .touch .jump { margin-left: auto; width: clamp(76px, 21vw, 100px); height: clamp(76px, 21vw, 100px);
                 background: var(--purple); color: #fff; }
  .touch .jump.on { background: var(--purple-dark); }
  body.coarse.playing .touch { display: flex; }

  /* ---------- panels ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(30, 90, 160, .28);
    overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .card {
    width: 100%; max-width: 470px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    margin: auto; background: var(--card); border-radius: 26px; padding: 26px clamp(16px, 5vw, 28px);
    box-shadow: 0 8px 0 rgba(29, 31, 43, .22);
  }
  .outlined {
    font-family: var(--display); color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--ink); letter-spacing: .5px;
  }
  .logo { font-size: clamp(46px, 13vw, 72px); line-height: 1; margin: 0 0 4px; transform: rotate(-3deg); }
  .logo span { color: var(--green); display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12) rotate(6deg); } }
  .card h2 { font-size: clamp(30px, 8vw, 42px); margin: 0; line-height: 1.05; }
  .card p { margin: 0; color: var(--muted); font-size: 16px; font-weight: 700; line-height: 1.45; max-width: 36ch; text-wrap: balance; }
  .card p b { color: var(--text); }
  .chip { padding: 8px 16px; border-radius: 12px; background: var(--soft); font-weight: 900; color: var(--muted); }
  .keys { font-size: 14px; color: var(--muted); line-height: 1.8; font-weight: 700; }
  .keys kbd { font: 900 12px var(--body); background: var(--soft); border: 2px solid var(--line); border-bottom-width: 3px;
              border-radius: 6px; padding: 1px 6px; color: var(--text); }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; width: 100%;
            font-size: 13px; color: var(--muted); text-align: left; }
  .legend b { color: var(--text); }
  .big {
    width: 100%; max-width: 320px; padding: 15px; border-radius: 14px;
    font: 400 22px var(--display); letter-spacing: .5px; color: #fff; background: var(--purple); box-shadow: 0 5px 0 var(--purple-dark);
  }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--purple-dark); }
  .big.go { background: var(--green); box-shadow: 0 5px 0 #3a9d1c; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
  .big.go:active { box-shadow: 0 2px 0 #3a9d1c; }
  .big.alt { background: var(--soft); color: var(--text); box-shadow: 0 5px 0 var(--line); font-size: 18px; padding: 12px; }
  .big:disabled { opacity: .45; cursor: not-allowed; }
  .best { font: 900 13px var(--body); color: var(--muted); }
  input, textarea { -webkit-user-select: text; user-select: text; touch-action: auto; }
  .you { display: flex; align-items: center; gap: 14px; width: 100%; background: var(--soft); border-radius: 18px; padding: 12px; text-align: left; }
  .you canvas { width: 76px; height: 76px; flex-shrink: 0; }
  .you-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .you label { font-size: 12px; color: var(--muted); font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
  .you input, .join input {
    width: 100%; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff;
    color: var(--text); font: 900 17px var(--body);
  }
  .you input:focus, .join input:focus { outline: none; border-color: var(--purple); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); }
  .sw.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--purple); }
  .net { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .join { display: flex; gap: 8px; width: 100%; max-width: 320px; }
  .join input { flex: 1; min-width: 0; text-align: center; font: 400 20px var(--display); letter-spacing: 3px; }
  .join .big { width: auto; padding: 10px 18px; }
  .note { font-size: 13px !important; color: var(--muted); min-height: 1em; }
  .how { width: 100%; color: var(--muted); }
  .how summary, .shop summary { cursor: pointer; font-weight: 900; padding: 6px; color: var(--text); }
  .how .keys { margin: 8px 0 12px; }
  .shop { width: 100%; color: var(--muted); background: var(--soft); border-radius: 18px; padding: 6px 10px; }
  .shop .bank { color: var(--text); margin-left: 6px; }
  .shop .note { margin: 4px 0 10px; }
  .hats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-bottom: 8px; }
  .hat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 14px;
         background: #fff; border: 2px solid var(--line); font-size: 12px; font-weight: 900; color: var(--text); }
  .hat canvas { width: 50px; height: 50px; }
  .hat b { font: 900 11px var(--body); color: var(--purple); }
  .hat.on { border-color: var(--purple); box-shadow: 0 0 0 2px var(--purple); }
  .hat.locked { opacity: .5; }
  .codebox { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 26px; border-radius: 18px; background: var(--soft); }
  .codebox span { font: 900 12px var(--body); color: var(--muted); letter-spacing: 1px; }
  .codebox b { font: 400 clamp(40px, 12vw, 58px) var(--display); color: var(--purple); letter-spacing: 6px;
               -webkit-user-select: text; user-select: text; }
  .plist-head { font: 900 13px var(--body); color: var(--muted); }
  .plist { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
  .plist li, .board li { display: flex; align-items: center; gap: 10px; }
  .plist li { background: var(--soft); border-radius: 12px; padding: 9px 12px; font-weight: 900; }
  .plist i, .board i { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--ink); }
  .plist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .plist .tag { font: 900 13px var(--body); color: var(--purple); font-variant-numeric: tabular-nums; }
  .wait { font-weight: 900; color: var(--text) !important; }
  .board {
    position: fixed; z-index: 2; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(66px + env(safe-area-inset-top, 0px));
    margin: 0; padding: 8px 12px; list-style: none; background: var(--card); border-radius: 14px; box-shadow: 0 3px 0 rgba(29, 31, 43, .18);
    display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 900; pointer-events: none; min-width: 140px;
  }
  .board[hidden] { display: none; }
  .board li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
  .board li b { color: var(--purple); font-variant-numeric: tabular-nums; }
  .board li.me span { color: var(--purple); }
  @media (max-width: 560px) {
    .hud { gap: 5px; }
    .pill { padding: 6px 9px; font-size: 13px; border-radius: 10px; }
    .hud button { width: 34px; height: 34px; border-radius: 10px; font-size: 15px; }
  }
  body.coarse #fsBtn { display: none; }
  @media (prefers-reduced-motion: reduce) { .logo span { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud" hidden>
  <span class="pill" id="hHeight">Height: 0m</span>
  <span class="pill hearts" id="hHearts">♥♥♥</span>
  <span class="pill fx" id="hFx"></span>
  <span class="grow"></span>
  <span class="pill"><i class="coin-dot"></i><span id="hCoins">0</span></span>
  <button id="musicBtn" title="Music on">♪</button>
  <button id="pauseBtn" title="Pause">❚❚</button>
  <button id="fsBtn" title="Full screen">⛶</button>
</div>

<ol class="board" id="board" hidden></ol>

<div class="touch" id="touch">
  <button data-k="L" aria-label="Left">◀</button>
  <button data-k="R" aria-label="Right">▶</button>
  <button data-k="J" class="jump" aria-label="Jump">⤒</button>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
// =====================================================
// JUMPER X — an endless climb up a dark tower
// =====================================================

const $ = id => document.getElementById(id);
const now = () => performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem('jx_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jx_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- sound ----------
let AC;
function beep(f, d, type = 'square', vol = .05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const sfx = {
  jump:   () => beep(300, .12, 'square', .03, 260),
  jump2:  () => beep(480, .14, 'triangle', .05, 480),
  boing:  () => beep(160, .35, 'triangle', .08, 700),
  coin:   n => { const k = 1 + Math.min(n, 12) * .06; beep(880 * k, .06, 'square', .03); setTimeout(() => beep(1320 * k, .09, 'square', .03), 55); },
  land:   () => beep(110, .07, 'triangle', .05, -40),
  cheer:  () => { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, .14, 'square', .045), i * 70)); },
  power:  () => { [440, 660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, .1, 'triangle', .06), i * 55)); },
  chest:  () => { [523, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .12, 'square', .04), i * 80)); },
  stomp:  () => beep(180, .12, 'square', .06, -80),
  crack:  () => beep(120, .18, 'sawtooth', .04, -40),
  hurt:   () => beep(330, .3, 'sawtooth', .06, -220),
  shield: () => beep(900, .25, 'sine', .07, -500),
  over:   () => beep(400, .7, 'sawtooth', .06, -340),
};

// ---------- chiptune music ----------
// A looping 8-bar tune in A minor (Am–F–C–G): square-wave lead, triangle
// bass, a soft arpeggio in the second half and noise drums. Notes are
// scheduled a little ahead on the audio clock so the beat never drifts.
const MUSIC = { on: store.get('music', true), playing: false, step: 0, next: 0, timer: 0, out: null, noise: null };
const BPM = 128, S16 = 60 / BPM / 4, SONG_STEPS = 128;
const CHORDS = [
  { root: 45, arp: [57, 60, 64] }, { root: 41, arp: [57, 60, 65] },
  { root: 48, arp: [60, 64, 67] }, { root: 43, arp: [55, 59, 62] },
];
// one entry per eighth note, 8 per bar; null = rest
const LEAD = [
  76, null, 74, 72, 74, 76, 76, null,   77, null, 76, 74, 72, 74, 72, null,
  72, 74, 76, 79, 76, 74, 72, 74,       71, null, 74, null, 79, 77, 76, 74,
  81, null, 79, 76, 79, null, 76, 74,   77, 76, 77, 79, 81, null, 77, null,
  79, null, 76, 72, 76, 79, 84, null,   83, null, 79, null, 74, 76, 77, 79,
];
const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);

function tone(type, freq, t, dur, vol, slideTo) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.setValueAtTime(vol, t + dur * .7);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(MUSIC.out); o.start(t); o.stop(t + dur + .02);
}
function hiss(t, dur, vol, hp) {
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = MUSIC.noise; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f).connect(g).connect(MUSIC.out); src.start(t); src.stop(t + dur + .02);
}
function playStep(s, t) {
  const bar = Math.floor(s / 16) % 8, inBar = s % 16, chord = CHORDS[bar % 4], partB = bar >= 4;
  // lead on eighth notes
  if (inBar % 2 === 0) {
    const n = LEAD[bar * 8 + inBar / 2];
    if (n != null) tone('square', midiHz(n), t, S16 * 1.8, .055);
  }
  // bouncing octave bass
  if (inBar % 2 === 0) tone('triangle', midiHz(chord.root + (inBar % 4 === 2 ? 12 : 0)), t, S16 * 1.9, .16);
  // sparkly arpeggio in the second half
  if (partB) tone('square', midiHz(chord.arp[inBar % 3] + 12), t, S16 * .9, .018);
  // drums
  if (inBar === 0 || inBar === 8 || (inBar === 10 && bar % 2)) tone('sine', 150, t, .14, .32, 40);
  if (inBar === 4 || inBar === 12) hiss(t, .12, .07, 1200);
  if (inBar % 2 === 1) hiss(t, .03, .025, 7000);
}
function musicTick() {
  while (MUSIC.next < AC.currentTime + .12) {
    playStep(MUSIC.step, MUSIC.next);
    MUSIC.next += S16; MUSIC.step = (MUSIC.step + 1) % SONG_STEPS;
  }
}
function musicStart() {
  if (MUSIC.playing || !MUSIC.on) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!MUSIC.out) {
      MUSIC.out = AC.createGain(); MUSIC.out.gain.value = .55; MUSIC.out.connect(AC.destination);
      MUSIC.noise = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
      const d = MUSIC.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    MUSIC.out.gain.setValueAtTime(.55, AC.currentTime);
    MUSIC.next = AC.currentTime + .08; MUSIC.playing = true;
    MUSIC.timer = setInterval(musicTick, 25);
  } catch (e) {}
}
function musicStop() {
  if (!MUSIC.playing) return;
  clearInterval(MUSIC.timer); MUSIC.playing = false;
  try { MUSIC.out.gain.setValueAtTime(0, AC.currentTime); } catch (e) {}
}
function setMusic(on) {
  MUSIC.on = on; store.set('music', on);
  on ? musicStart() : musicStop();
  renderMusicUI();
}
function renderMusicUI() {
  const on = MUSIC.on;
  $('musicBtn').textContent = on ? '♪' : '♪̸';
  $('musicBtn').title = on ? 'Music on' : 'Music off';
  const t = $('musicToggle'); if (t) t.textContent = on ? '♪ MUSIC: ON' : '♪ MUSIC: OFF';
}
// browsers only allow sound after a tap or key press
function unlockAudio() {
  musicStart();
  try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {}
}
addEventListener('pointerdown', unlockAudio, { capture: true });
addEventListener('keydown', unlockAudio, { capture: true });

// ---------- world constants ----------
// Movement is tuned to feel steady and floaty (not twitchy), and the physics
// always step at a fixed 120 Hz so it plays the same on every device.
const T = 32, COLS = 22, WW = COLS * T;
const GRAV = 800, JUMP = 390, RUN = 90, MAXFALL = 470, STEP = 1 / 120;
const EMPTY = 0, SOLID = 1, PLAT = 2, SPIKE = 3, CRATE = 4, BOOKS = 5, BARREL = 6,
      SPRING = 7, ICE = 8, CRUMBLE = 9, CHEST = 10, PILLAR = 11;
const isSolid = t => t !== EMPTY && t !== SPIKE;   // every block is solid from all sides
const ONEWAY = new Set([PLAT, CRATE, BOOKS, BARREL, SPRING, ICE, CRUMBLE, CHEST]);

// The tower changes every 45 m. Each zone favours different things to jump on.
const ZONES = [
  { name: 'THE CELLAR',       hue: 24,  kinds: { plank: 3, barrel: 3, crate: 2 } },
  { name: 'THE LIBRARY',      hue: 270, kinds: { books: 4, plank: 2, crate: 1, spring: .5 } },
  { name: 'THE ARMORY',       hue: 210, kinds: { crate: 3, barrel: 2, plank: 1, crumble: 1.5 } },
  { name: 'THE FROZEN SPIRE', hue: 192, kinds: { ice: 4, plank: 1, crumble: 1.5 } },
  { name: 'THE CLOCKWORKS',   hue: 42,  kinds: { plank: 3, crate: 1, barrel: 1, spring: 1.2 } },
  { name: 'THE SKY KEEP',     hue: 232, kinds: { spring: 1.5, crumble: 2, plank: 2.5 } },
];
const ZONE_ROWS = 45;
const zoneOf = r => Math.max(0, Math.floor(-r / ZONE_ROWS));
const zoneInfo = z => ZONES[z % ZONES.length];

const cv = $('game');
let cx = cv.getContext('2d');   // current drawing target (the pixel buffer while the world is drawn)
const lc = document.createElement('canvas'), lx = lc.getContext('2d');
let DPR = 1, SW = 0, SH = 0;

const keys = {};
const C = {
  state: 'title', seed: 7, texts: [], nextMile: 25, combo: 0, comboT: 0, banked: true, hearts: 3, coins: 0, height: 0, zone: -1,
  players: [], parts: [], banner: 0, bannerText: '', shake: 0, t: 0,
  touch: { L: false, R: false, J: false }, cam: { x: 0, y: 0, z: 2 }, last: 0, acc: 0, pruneT: 0,
};
const W = { rows: new Map(), ents: [], movers: [], coins: [], items: [], decor: [], crumble: new Map(), opened: new Set(), springT: new Map(), gen: null };

// ---------- screen fitting ----------
// Zoom comes from the screen's area, so every device sees about the same
// small patch of the tower around you.
function baseZoom() { return Math.max(1.5, Math.round(Math.sqrt(SW * SH) / (11 * T) * 2) / 2); }
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = innerWidth; SH = innerHeight;
  cv.width = lc.width = Math.round(SW * DPR);
  cv.height = lc.height = Math.round(SH * DPR);
  if (C.players.length) updateCamera(0, true);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.body.classList.toggle('coarse', matchMedia('(pointer: coarse)').matches);

// ---------- random ----------
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const hash = (x, y) => { let h = Math.imul(x, 73856093) ^ Math.imul(y, 19349663); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
function pick(weights) {
  let sum = 0; for (const k in weights) sum += weights[k];
  let x = R() * sum;
  for (const k in weights) { x -= weights[k]; if (x <= 0) return k; }
  return Object.keys(weights)[0];
}

// ---------- tiles ----------
// Rows are numbered upward as negative numbers; row 0 is the ground.
function tile(c, r) {
  if (c <= 0 || c >= COLS - 1 || r >= 0) return SOLID;
  const row = W.rows.get(r);
  return row ? row[c] : EMPTY;
}
function setTile(c, r, v) {
  let row = W.rows.get(r);
  if (!row) { row = new Uint8Array(COLS); W.rows.set(r, row); }
  row[c] = v;
}

// ---------- endless generation ----------
// One path of floating panels climbs forever, each step within reach of the last.
function genInit(seed) {
  W.rows = new Map(); W.ents = []; W.movers = []; W.coins = []; W.items = []; W.decor = [];
  W.crumble = new Map(); W.opened = new Set(); W.springT = new Map();
  W.gen = { rng: mulberry(seed), prev: { a: 1, b: COLS - 2, r: 0 }, dir: 1, count: 0 };
  genUpTo(-60);
}
function genUpTo(target) {
  R = W.gen.rng;
  while (W.gen.prev.r > target) genStep();
  R = Math.random;
}

const LEN = { plank: [3, 6], crate: [2, 4], books: [2, 3], barrel: [2, 3], ice: [3, 5], crumble: [2, 4], spring: [1, 1] };
const TILE_OF = { plank: PLAT, crate: CRATE, books: BOOKS, barrel: BARREL, ice: ICE, crumble: CRUMBLE, spring: SPRING };

function genStep() {
  const G = W.gen, prev = G.prev;
  const height = -prev.r, d = Math.min(1, height / 500);
  const z = zoneOf(prev.r), zi = zoneInfo(z);
  const step = prev.spring ? ri(4, 6) : (R() < .12 + d * .25 && height > 15 ? 3 : 2);
  const r = prev.r - step;

  let kind;
  if (G.count < 5) kind = G.count === 2 ? 'crate' : 'plank';
  else {
    const w = Object.assign({}, zi.kinds);
    if (z >= ZONES.length) for (const k in LEN) w[k] = (w[k] || 0) + .5;  // later laps mix everything
    if (height > 40) { w.crumble = (w.crumble || 0) + d; w.spring = (w.spring || 0) + .3; }
    if (prev.spring) w.spring = 0;
    kind = pick(w);
  }
  const [l0, l1] = LEN[kind], len = ri(l0, l1);

  // find a spot within reach of the previous step, drifting in one direction
  // (never directly over a spring, so its bounce stays clear)
  let a = -1;
  for (let pass = 0; pass < 2 && a < 0; pass++) {
    for (let t = 0; t < 120; t++) {
      const c = ri(1, COLS - 1 - len), b = c + len - 1;
      const gap = Math.max(c - prev.b - 1, prev.a - b - 1);
      const shift = (c + b) / 2 - (prev.a + prev.b) / 2;
      if (gap > 1 || (prev.spring && gap < 0)) continue;
      if (prev.r !== 0 && c <= prev.a && b >= prev.b) continue;
      if (prev.r === 0 || (Math.abs(shift) >= 2 && Math.sign(shift) === G.dir)) { a = c; break; }
    }
    if (a < 0) G.dir = -G.dir;
  }
  if (a < 0) a = clamp(prev.spring ? prev.b + 1 : prev.a, 1, COLS - 1 - len);
  const b = a + len - 1;

  for (let c = a; c <= b; c++) setTile(c, r, TILE_OF[kind]);
  // mixed piles: a crate row might hide a barrel, books or a treasure chest
  if ((kind === 'crate' || kind === 'barrel' || kind === 'books') && len >= 2) {
    const c = ri(a, b), roll = R();
    if (roll < .14) setTile(c, r, CHEST);
    else if (roll < .4) setTile(c, r, [CRATE, BARREL, BOOKS][ri(0, 2)]);
  }

  const right = (a + b) / 2 >= (prev.a + prev.b) / 2;

  G.prev = { a, b, r, spring: kind === 'spring' };
  G.path = G.path || []; if (G.path.length < 400) G.path.push(G.prev);
  G.count++;
  if (R() < .3) G.dir = -G.dir;
  if (a <= 3) G.dir = 1;
  if (b >= COLS - 4) G.dir = -1;

  // coins along the path, and now and then a power-up
  if (kind !== 'spring' && R() < .7) W.coins.push({ x: ((a + b + 1) / 2) * T, y: (r - 1) * T + 14 });
  if (R() < .3) W.coins.push({ x: ((a + b + 1) / 2) * T + (right ? 1 : -1) * 2 * T, y: (r - 2) * T + 10 });
  if (G.count > 4 && R() < .1) W.items.push(makeItem((a + b + 1) / 2 * T, (r - 2) * T + 16));

  // hazards on longer stretches: a spike in the middle, or a slime on patrol
  if (height > 15 && kind === 'plank' && len >= 5 && R() < .15 + d * .3) setTile(Math.floor((a + b) / 2), r - 1, SPIKE);
  else if (height > 25 && len >= 6 && kind !== 'spring' && R() < .25 + d * .3) W.ents.push(slime((a + 2) * T, (b - 1) * T, r * T, d));

  // bats sweep the open air higher up
  if (height > 35 && R() < .14 + d * .3) {
    const y0 = (r + 1) * T + 8;
    W.ents.push({ k: 'bat', x: ri(2, COLS - 3) * T, y: y0, y0, w: 20, h: 12, vx: (R() < .5 ? -1 : 1) * (45 + d * 45), t: R() * 6, amp: ri(10, 24) });
  }

  // wall decorations
  for (let rr = prev.r - 1; rr > r; rr--) {
    if (R() < .07 && !W.decor.some(d => Math.abs(d.r - rr) < 6)) W.decor.push({ k: 'lamp', side: R() < .5 ? 1 : -1, r: rr });
    else if (R() < .025 && !W.decor.some(d => Math.abs(d.r - rr) < 5)) { const a = ri(2, 8); W.decor.push({ k: 'flags', a, b: a + ri(6, 11), r: rr }); }
  }
}

function slime(minX, maxX, topY, d) {
  return { k: 'slime', x: (minX + maxX) / 2 - 11, y: topY - 16, w: 22, h: 16, vx: (R() < .5 ? -1 : 1) * (28 + d * 25), minX, maxX, t: R() * 6 };
}
function makeItem(x, y) {
  const k = pick({ feather: 3, shield: 3, magnet: 2.5, rocket: 2, heart: 1.2 });
  return { k, x, y, t: R() * 6 };
}

// ---------- you ----------
const GIM_COLORS = ['#ff5d6c', '#ff9f2e', '#ffd23b', '#3ed67a', '#2ec7e8', '#5b7cff', '#a96bff', '#ff73c6'];
const ME = { name: String(store.get('name', '') || '').slice(0, 12), col: clamp(store.get('col', 1) | 0, 0, GIM_COLORS.length - 1),
             hat: String(store.get('hat', 'none')), bank: Math.max(0, store.get('bank', 0) | 0),
             owned: new Set(['none', ...(Array.isArray(store.get('owned', [])) ? store.get('owned', []) : [])]) };

function makePlayer() {
  return { x: 0, y: 0, w: 20, h: 26, vx: 0, vy: 0, onGround: false, groundTile: 0, ride: null,
           coyote: 0, jumpBuf: 0, jPrev: false, jumpCut: false, dropT: 0, airJumps: 1, flip: 0, face: 1,
           inv: 0, walk: 0, feather: 0, magnet: 0, shield: false,
           sx: 1, sy: 1, svx: 0, svy: 0, lean: 0, look: 1, happy: 0, dustT: 0 };
}

function startGame(seed) {
  C.seed = seed || 1 + Math.floor(Math.random() * 1e9);
  genInit(C.seed);
  C.hearts = 3; C.coins = 0; C.height = 0; C.zone = -1; C.parts = [];
  C.acc = 0; C.texts = []; C.nextMile = 25; C.combo = 0; C.comboT = 0; C.banked = false;
  const p = makePlayer();
  p.x = (COLS / 2) * T - p.w / 2; p.y = -p.h; p.inv = 1;
  C.players = [p];
  updateCamera(0, true);
  setState('play');
  if (NET.r) NET.r.presence({ st: 'play', round: NET.myRound, x: Math.round(p.x), y: Math.round(p.y), f: 1, h: 0 }).catch(() => {});
}

// ---------- live games with a code ----------
// Everyone who joins the same code shares a room: the host's presence carries
// the round's seed (so everybody climbs the same tower) and each player's
// presence carries where they are. Nothing else is sent.
const NET = { room: null, r: null, code: '', host: false, myRound: 0, list: [], ghosts: new Map(), lastSend: 0, msg: '' };

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const room = await window.claude.use('room');
    if (room) { NET.room = room; if (C.state === 'title') setState('title'); }
  } catch (e) {}
})();

function cleanPeer(p) {
  const s = p.presence || {}, num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  return {
    peer: p.peer, me: p.sameTab,
    nm: (typeof s.nm === 'string' ? s.nm : '').slice(0, 12) || 'Player',
    col: clamp(num(s.col) | 0, 0, GIM_COLORS.length - 1),
    st: ['lobby', 'play', 'over'].includes(s.st) ? s.st : 'lobby',
    host: s.host === true, round: num(s.round) | 0, seed: num(s.seed) | 0,
    x: num(s.x), y: num(s.y), f: s.f === -1 ? -1 : 1, h: Math.max(0, num(s.h) | 0),
    hat: HAT_IDS.includes(s.hat) ? s.hat : 'none',
  };
}
const hostOf = () => NET.list.find(p => p.host && !p.me);

function onRoomPeers(peers) {
  NET.list = peers.map(cleanPeer);
  // keep smoothed positions for everyone else
  const seen = new Set();
  for (const p of NET.list) {
    if (p.me) continue;
    seen.add(p.peer);
    const g = NET.ghosts.get(p.peer);
    if (!g) NET.ghosts.set(p.peer, { rx: p.x, ry: p.y, walk: 0 });
  }
  for (const k of NET.ghosts.keys()) if (!seen.has(k)) NET.ghosts.delete(k);

  // players follow the host into each new round
  const h = hostOf();
  if (!NET.host && h && h.st === 'play' && h.round > NET.myRound && h.seed && C.state !== 'play' && C.state !== 'pause') {
    NET.myRound = h.round;
    countdownStart(h.seed);
  }
  renderPlayerList();
}

let countdownTimer = 0;
function countdownStart(seed) {
  clearTimeout(countdownTimer);
  setState('countdown');
  countdownTimer = setTimeout(() => { if (C.state === 'countdown') startGame(seed); }, 2000);
}

function newCode() { return String(100000 + Math.floor(Math.random() * 900000)); }

async function enterRoom(code, asHost) {
  NET.msg = asHost ? 'Opening a game…' : 'Joining game ' + code + '…';
  setState('lobby');
  try {
    const r = await NET.room.join('jx-' + code);
    NET.r = r; NET.code = code; NET.host = asHost; NET.myRound = 0; NET.msg = '';
    r.onPeers(ch => onRoomPeers(ch.peers), () => { NET.msg = 'Lost connection to the game.'; renderPlayerList(); });
    await r.presence({ nm: ME.name || 'Player', col: ME.col, hat: ME.hat, st: 'lobby', host: asHost || null, round: 0, seed: null });
    setState('lobby');
    if (!asHost) setTimeout(() => { if (NET.r === r && !hostOf() && C.state === 'lobby') { NET.msg = 'No host has opened code ' + code + ' yet. Check the code, or wait here.'; renderPlayerList(); } }, 5000);
  } catch (e) {
    NET.r = null; NET.msg = 'Could not open a game right now. Try again in a moment.';
    setState('title');
  }
}

function leaveRoom() {
  if (NET.r) NET.r.leave().catch(() => {});
  NET.r = null; NET.code = ''; NET.host = false; NET.list = []; NET.ghosts.clear(); NET.myRound = 0;
}

function hostStartRound() {
  if (!NET.r || !NET.host) return;
  NET.myRound++;
  const seed = 1 + Math.floor(Math.random() * 1e9);
  NET.r.presence({ st: 'play', round: NET.myRound, seed }).catch(() => {});
  countdownStart(seed);
}

function sendPresence() {
  if (!NET.r || C.state !== 'play' || !C.players.length) return;
  const t = now();
  if (t - NET.lastSend < 70) return;
  NET.lastSend = t;
  const p = C.players[0];
  NET.r.presence({ st: 'play', x: Math.round(p.x), y: Math.round(p.y), f: p.face, h: C.height }).catch(() => {});
}

function renderPlayerList() {
  const el = $('plist');
  if (el) {
    const rows = NET.list.slice().sort((a, b) => (C.state === 'lobby' ? 0 : b.h - a.h) || (b.host - a.host));
    el.replaceChildren(...rows.map(p => {
      const li = document.createElement('li');
      const dot = document.createElement('i'); dot.style.background = GIM_COLORS[p.col];
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.nm + (p.me ? ' (you)' : '');
      const tag = document.createElement('span'); tag.className = 'tag';
      tag.textContent = C.state === 'lobby' ? (p.host ? 'HOST' : '') : (p.round === NET.myRound ? p.h + ' m' + (p.st === 'play' ? ' ▲' : '') : '—');
      li.append(dot, nm, tag);
      return li;
    }));
  }
  const m = $('netMsg'); if (m) m.textContent = NET.msg;
  const n = $('pcount'); if (n) n.textContent = NET.list.length + (NET.list.length === 1 ? ' player' : ' players');
}

function renderBoard() {
  const el = $('board');
  if (!NET.r || C.state !== 'play') { el.hidden = true; return; }
  el.hidden = false;
  const rows = NET.list.filter(p => p.round === NET.myRound).sort((a, b) => b.h - a.h).slice(0, 5);
  el.replaceChildren(...rows.map((p, i) => {
    const li = document.createElement('li');
    if (p.me) li.className = 'me';
    const dot = document.createElement('i'); dot.style.background = GIM_COLORS[p.col];
    const nm = document.createElement('span'); nm.textContent = (i + 1) + '. ' + p.nm;
    const h = document.createElement('b'); h.textContent = (p.me ? C.height : p.h) + 'm';
    li.append(dot, nm, h);
    return li;
  }));
}

function renderShop() {
  const box = $('hats'); if (!box) return;
  $('bankShow').textContent = ME.bank + (ME.bank === 1 ? ' coin' : ' coins');
  box.replaceChildren(...HATS.map(h => {
    const b = document.createElement('button');
    const owned = ME.owned.has(h.id), on = ME.hat === h.id;
    b.className = 'hat' + (on ? ' on' : '');
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const g = c.getContext('2d'); g.setTransform(1.3, 0, 0, 1.3, 32 - 10 * 1.3, 62 - 26 * 1.3);
    drawGim(g, 0, 0, GIM_COLORS[ME.col], 1, { blink: false, hat: h.id });
    const nm = document.createElement('span'); nm.textContent = h.name;
    const tag = document.createElement('b');
    tag.textContent = on ? 'WEARING' : owned ? 'WEAR' : h.price + ' coins';
    if (!owned && ME.bank < h.price) b.classList.add('locked');
    b.append(c, nm, tag);
    b.onclick = () => {
      if (!ME.owned.has(h.id)) {
        if (ME.bank < h.price) { tag.textContent = 'NEED ' + h.price; return; }
        ME.bank -= h.price; ME.owned.add(h.id); store.set('bank', ME.bank);
        store.set('owned', [...ME.owned].filter(x => x !== 'none')); sfx.chest();
      }
      ME.hat = h.id; store.set('hat', h.id);
      renderShop(); drawPreview();
    };
    return b;
  }));
}

function drawPreview() {
  const c = $('gimPreview'); if (!c) return;
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
  g.setTransform(2, 0, 0, 2, 48 - 10 * 2, 92 - 26 * 2);
  drawGim(g, 0, 0, GIM_COLORS[ME.col], 1, { blink: false, hat: ME.hat });
}

// Title screen: the camera drifts up an empty tower
function showAttract() {
  C.players = []; C.parts = [];
  genInit(7);
  C.cam.z = baseZoom(); C.cam.x = Math.max(0, (WW - SW / C.cam.z) / 2); C.cam.y = T * 2 - SH / C.cam.z;
}

// ---------- full screen ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function goFullscreen() {
  if (fsEl()) return;
  const el = document.documentElement;
  try { const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
function exitFullscreen() {
  if (!fsEl()) return;
  try { const r = (document.exitFullscreen || document.webkitExitFullscreen)?.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
$('fsBtn').onclick = () => { fsEl() ? exitFullscreen() : goFullscreen(); };
$('pauseBtn').onclick = () => { if (C.state === 'play') setState('pause'); };
$('musicBtn').onclick = () => setMusic(!MUSIC.on);

// ---------- input ----------
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;  // typing a name or code
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (C.state === 'play') setState('pause'); else if (C.state === 'pause') { C.last = now(); setState('play'); }
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (C.state === 'play') setState('pause'); });

document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const set = v => e => { e.preventDefault(); C.touch[k] = v; b.classList.toggle('on', v); };
  b.addEventListener('pointerdown', set(true));
  b.addEventListener('pointerup', set(false));
  b.addEventListener('pointercancel', set(false));
  b.addEventListener('pointerleave', set(false));
});

function readInput() {
  const k = keys, t = C.touch;
  return { l: k.ArrowLeft || k.KeyA || t.L, r: k.ArrowRight || k.KeyD || t.R,
           j: k.ArrowUp || k.KeyW || k.Space || t.J, d: k.ArrowDown || k.KeyS };
}

// ---------- physics ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function moveX(p, dx) {
  p.x += dx;
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T);
  if (dx > 0) {
    const c = Math.floor((p.x + p.w - .01) / T);
    for (let r = r0; r <= r1; r++) if (isSolid(tile(c, r))) { p.x = c * T - p.w; p.vx = 0; return; }
  } else if (dx < 0) {
    const c = Math.floor(p.x / T);
    for (let r = r0; r <= r1; r++) if (isSolid(tile(c, r))) { p.x = (c + 1) * T; p.vx = 0; return; }
  }
}
function moveY(p, dy) {
  const prevBottom = p.y + p.h;
  p.y += dy; p.onGround = false; p.ride = null;
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T);
  if (dy > 0) {
    const r = Math.floor((p.y + p.h - .01) / T);
    for (let c = c0; c <= c1; c++) {
      const t = tile(c, r);
      if (isSolid(t)) {
        p.y = r * T - p.h; p.vy = 0; p.onGround = true; land(p, t, c, r); return;
      }
    }
    if (p.dropT <= 0) for (const m of W.movers) {
      if (prevBottom <= m.y + .5 && p.y + p.h >= m.y && p.x + p.w > m.x && p.x < m.x + m.w) {
        p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.ride = m; p.groundTile = PLAT; return;
      }
    }
  } else if (dy < 0) {
    const r = Math.floor(p.y / T);
    for (let c = c0; c <= c1; c++) if (isSolid(tile(c, r))) { p.y = (r + 1) * T; p.vy = 0; return; }
  }
}

function land(p, t, c, r) {
  p.groundTile = t;
  const key = c + ',' + r;
  if (t === SPRING) {
    p.vy = -JUMP * 1.65; p.onGround = false; p.jumpCut = true; p.airJumps = maxAir(p);
    W.springT.set(key, .25); sfx.boing(); kick(p, .65, 1.4); popText(c * T + 16, r * T - 18, 'BOING!', '#ff5d6c', true);
  } else if (t === CRUMBLE && !W.crumble.has(key)) {
    W.crumble.set(key, { c, r, t: .55, back: 0 }); sfx.crack();
  } else if (t === CHEST && !W.opened.has(key)) {
    W.opened.add(key); C.coins += 5; sfx.chest(); p.happy = 1.2; popText(c * T + 16, r * T - 20, '+5', '#ffd93b', true);
    for (let i = 0; i < 6; i++) burst(c * T + 16, r * T - 4, '#ffd93b', 3, 120);
  }
}

const maxAir = p => p.feather > 0 ? 2 : 1;

function burst(x, y, col, n = 14, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (.3 + Math.random());
    C.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: .5 + Math.random() * .4, col, size: 3 + Math.random() * 3 });
  }
}

function hurt(p) {
  if (p.inv > 0) return;
  if (p.shield) {
    p.shield = false; p.inv = 1.2; sfx.shield(); burst(p.x + p.w / 2, p.y + p.h / 2, '#7fd8ff', 16, 180);
    return;
  }
  C.hearts--; p.inv = 1.6; C.shake = .3; sfx.hurt();
  burst(p.x + p.w / 2, p.y + p.h / 2, GIM_COLORS[ME.col], 16, 180);
  p.vy = -JUMP * .6; p.jumpCut = true;
  if (C.hearts <= 0) { sfx.over(); setState('over'); }
}

function updatePlayer(p, dt) {
  const inp = readInput();
  const dirX = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  const ice = p.onGround && p.groundTile === ICE;
  const acc = p.onGround ? (ice ? 200 : (dirX ? 700 : 1000)) : (dirX ? 520 : 240);
  p.vx += clamp(dirX * RUN - p.vx, -acc * dt, acc * dt);
  if (dirX) p.face = dirX;

  const jNew = inp.j && !p.jPrev; p.jPrev = !!inp.j;
  p.jumpBuf = jNew ? .12 : p.jumpBuf - dt;
  p.coyote = p.onGround ? .1 : p.coyote - dt;
  p.dropT -= dt;
  if (inp.d && p.onGround) p.dropT = .2;
  if (p.onGround) p.airJumps = maxAir(p);
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.jumpBuf = 0; p.coyote = 0; p.jumpCut = false; sfx.jump(); kick(p, .72, 1.3);
    landDust(p, .3);
  } else if (jNew && p.airJumps > 0 && !p.onGround) {
    p.vy = -JUMP * .88; p.airJumps--; p.jumpBuf = 0; p.jumpCut = false; sfx.jump2(); kick(p, .8, 1.22);
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      C.parts.push({ x: p.x + p.w / 2, y: p.y + p.h, vx: Math.cos(a) * 80, vy: Math.sin(a) * 25 + 30, life: .35, col: p.feather > 0 ? '#7fd8ffcc' : '#ffffffcc', size: 3 });
    }
  }
  if (!inp.j && p.vy < 0 && !p.jumpCut) { p.vy *= .55; p.jumpCut = true; }
  p.vy = Math.min(p.vy + GRAV * dt, MAXFALL);

  if (p.onGround && p.ride) moveX(p, p.ride.dx);
  const wasGround = p.onGround, fallV = p.vy;
  moveX(p, p.vx * dt);
  moveY(p, p.vy * dt);
  if (!wasGround && p.onGround && fallV > 120) {
    const power = clamp(fallV / MAXFALL, 0, 1);
    kick(p, 1 + .35 * power, 1 - .32 * power); landDust(p, power); if (power > .5) sfx.land();
    if (power > .9) C.shake = Math.max(C.shake, .08);
  }
  animate(p, dt);
  p.walk = p.onGround && Math.abs(p.vx) > 15 ? p.walk + dt * 10 : 0;
  if (p.inv > 0) p.inv -= dt;
  if (p.feather > 0) p.feather -= dt;
  if (p.magnet > 0) p.magnet -= dt;

  // spikes
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T);
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (tile(c, r) === SPIKE && overlap(p, { x: c * T + 5, y: r * T + 18, w: 22, h: 14 })) hurt(p);
  }
  if (C.state !== 'play') return;

  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  for (const co of W.coins) {
    if (co.got) continue;
    if (p.magnet > 0) {
      const dx = pcx - co.x, dy = pcy - co.y, dist = Math.hypot(dx, dy);
      if (dist < 6 * T) { co.x += dx / dist * 260 * dt; co.y += dy / dist * 260 * dt; }
    }
    if (Math.abs(co.x - pcx) < 18 && Math.abs(co.y - pcy) < 20) {
      co.got = true; C.coins++; C.combo = C.comboT > 0 ? C.combo + 1 : 1; C.comboT = 1.3;
      sfx.coin(C.combo); burst(co.x, co.y, '#ffd93b', 8, 80);
      popText(co.x, co.y - 10, C.combo >= 3 ? 'x' + C.combo + '!' : '+1', C.combo >= 3 ? '#ff9f2e' : '#ffd93b', C.combo >= 5);
    }
  }
  for (const it of W.items) {
    if (it.got || Math.abs(it.x - pcx) > 22 || Math.abs(it.y - pcy) > 24) continue;
    it.got = true; sfx.power(); burst(it.x, it.y, '#ffffff', 16, 140); p.happy = 1; kick(p, 1.25, .8);
    popText(it.x, it.y - 16, { feather: 'TRIPLE JUMP', shield: 'SHIELD', magnet: 'MAGNET', heart: '+1 HEART', rocket: 'ROCKET!' }[it.k], '#7fd8ff', true);
    if (it.k === 'feather') { p.feather = 15; p.airJumps = 2; }
    else if (it.k === 'shield') p.shield = true;
    else if (it.k === 'magnet') p.magnet = 12;
    else if (it.k === 'heart') C.hearts = Math.min(5, C.hearts + 1);
    else if (it.k === 'rocket') { p.vy = -JUMP * 2; p.jumpCut = true; p.inv = Math.max(p.inv, 1); p.airJumps = maxAir(p); }
  }
  for (const e of W.ents) {
    if (e.dead || !overlap(p, e)) continue;
    if (p.vy > 40 && p.y + p.h - e.y < 14) {
      e.dead = true; p.vy = -JUMP * .8; p.jumpCut = true; p.airJumps = maxAir(p); C.coins++;
      kick(p, .75, 1.3); p.happy = .8; popText(e.x + e.w / 2, e.y - 6, 'STOMP!', '#6be04f', true);
      sfx.stomp(); burst(e.x + e.w / 2, e.y + e.h / 2, e.k === 'bat' ? '#a46bff' : '#6be04f', 14);
    } else hurt(p);
    if (C.state !== 'play') return;
  }
}

function update(dt) {
  C.t += dt;
  if (C.banner > 0) C.banner -= dt;
  if (C.shake > 0) C.shake -= dt;

  // climb tracking, zone banners and more tower above
  let top = Infinity, low = -Infinity;
  for (const p of C.players) { top = Math.min(top, p.y + p.h); low = Math.max(low, p.y + p.h); }
  C.height = Math.max(C.height, Math.floor(-top / T));
  if (C.height >= C.nextMile) {
    const p = C.players[0];
    C.bannerText = C.nextMile + 'm!'; C.banner = C.bannerMax = 1.8; C.bannerZone = false; sfx.cheer(); p.happy = 1.5;
    for (const col of GIM_COLORS) burst(p.x + p.w / 2, p.y - 10, col, 5, 220);
    C.nextMile += 25;
  }
  if (C.comboT > 0) C.comboT -= dt;
  for (const t of C.texts) { t.life -= dt; t.y -= 28 * dt; }
  if (C.texts.length) C.texts = C.texts.filter(t => t.life > 0);
  const z = zoneOf(Math.floor(top / T));
  if (z !== C.zone) { C.zone = z; C.bannerText = zoneInfo(z).name; C.banner = C.bannerMax = 2.6; C.bannerZone = true; }
  genUpTo(Math.floor(top / T) - 45);

  for (const m of W.movers) {
    m.dx = m.vx * dt; m.x += m.dx;
    if (m.x < m.minX) { m.x = m.minX; m.vx = Math.abs(m.vx); }
    if (m.x + m.w > m.maxX) { m.x = m.maxX - m.w; m.vx = -Math.abs(m.vx); }
  }
  for (const e of W.ents) {
    if (e.dead) continue;
    e.t += dt;
    if (e.k === 'slime') {
      e.x += e.vx * dt;
      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
    } else {
      e.x += e.vx * dt;
      if (e.x < T || e.x + e.w > WW - T) { e.vx *= -1; e.x = clamp(e.x, T, WW - T - e.w); }
      e.y = e.y0 + Math.sin(e.t * 2.5) * e.amp;
    }
  }
  for (const [key, cr] of W.crumble) {
    if (cr.t > 0) { cr.t -= dt; if (cr.t <= 0) { setTile(cr.c, cr.r, EMPTY); cr.back = 5; burst(cr.c * T + 16, cr.r * T + 8, '#8a8299', 10, 90); } }
    else if ((cr.back -= dt) <= 0) {
      const box = { x: cr.c * T, y: cr.r * T, w: T, h: T };
      if (C.players.some(p => overlap(p, box))) cr.back = .5;
      else { setTile(cr.c, cr.r, CRUMBLE); W.crumble.delete(key); }
    }
  }
  for (const [key, v] of W.springT) { if (v - dt <= 0) W.springT.delete(key); else W.springT.set(key, v - dt); }
  for (const it of W.items) it.t += dt;

  for (const p of C.players) { updatePlayer(p, dt); if (C.state !== 'play') return; }

  for (const q of C.parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g ?? 500) * dt; }
  if (C.parts.length) C.parts = C.parts.filter(q => q.life > 0);

  // tidy up things already collected or defeated
  if ((C.pruneT -= dt) <= 0) {
    C.pruneT = 2;
    W.ents = W.ents.filter(e => !e.dead);
    W.coins = W.coins.filter(c => !c.got);
    W.items = W.items.filter(i => !i.got);
  }
}

// ---------- camera ----------
function updateCamera(dt, snap) {
  const cam = C.cam, ps = C.players;
  if (!ps.length) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of ps) {
    x0 = Math.min(x0, p.x + p.w / 2); x1 = Math.max(x1, p.x + p.w / 2);
    y0 = Math.min(y0, p.y + p.h / 2); y1 = Math.max(y1, p.y + p.h / 2);
  }
  const base = baseZoom();
  const z = Math.max(base * .5, Math.min(base, SW / (x1 - x0 + 8 * T), SH / (y1 - y0 + 8 * T)));
  cam.z = snap ? z : cam.z + (z - cam.z) * Math.min(1, dt * 3);
  const vw = SW / cam.z, vh = SH / cam.z;
  let tx = (x0 + x1) / 2 - vw / 2, ty = (y0 + y1) / 2 - vh * .58;
  tx = vw >= WW ? (WW - vw) / 2 : clamp(tx, 0, WW - vw);
  // on touch screens let the camera sink below the floor so the buttons don't cover you
  const padB = document.body.classList.contains('coarse') ? 130 / cam.z : 0;
  ty = Math.min(ty, 2 * T - vh + padB);
  if (snap) { cam.x = tx; cam.y = ty; }
  else { const k = Math.min(1, dt * 6); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; }
}

// ---------- drawing (world space) ----------
// Cartoon style: flat colours, thick dark outlines, chunky blue-grey stone.
const INK = '#1d1f2b';
const STONE = { top: '#9aaacc', face: '#7384aa', dark: '#5a6a90', deep: '#4a587b', hi: '#b9c6e2' };
function outline(w = 2) { cx.lineWidth = w; cx.strokeStyle = INK; cx.lineJoin = 'round'; cx.lineCap = 'round'; cx.stroke(); }
function fillOut(col, w = 2) { cx.fillStyle = col; cx.fill(); outline(w); }

// sky, drawn behind the world in screen-fixed world units (bw × bh):
// soft stripes, sparkles and two layers of drifting clouds
function drawSky(bw, bh) {
  const cam = C.cam;
  const g = cx.createLinearGradient(0, 0, 0, bh);
  g.addColorStop(0, '#4cc5f0'); g.addColorStop(1, '#7ad9f7');
  cx.fillStyle = g; cx.fillRect(0, 0, bw, bh);
  const sy = (cam.y * .12) % 12;
  cx.fillStyle = 'rgba(255,255,255,.07)';
  for (let y = -12 - Math.round(sy); y < bh + 12; y += 12) {
    for (let x = 0; x < bw; x += 4) cx.fillRect(x, y + Math.round(Math.sin(x * .06 + y * .2) * 1.5), 4, 3);
  }
  const px = cam.x * .08, py = cam.y * .08;
  for (let gx = Math.floor(px / 45) - 1; gx <= Math.floor((px + bw) / 45) + 1; gx++)
    for (let gy = Math.floor(py / 45) - 1; gy <= Math.floor((py + bh) / 45) + 1; gy++) {
      const h = hash(gx, gy); if (h > .45) continue;
      cx.globalAlpha = .35 + (.5 + Math.sin(C.t * 2 + h * 40) * .5) * .5;
      cx.fillStyle = '#fff';
      cx.fillRect(Math.round(gx * 45 + hash(gy, gx) * 45 - px), Math.round(gy * 45 + hash(gx + 7, gy) * 45 - py), 1, 1);
    }
  cx.globalAlpha = 1;
  cloudLayer(bw, bh, .1, 120, 90, .3, .7);
  cloudLayer(bw, bh, .3, 170, 120, .5, .95);
}
function cloudLayer(bw, bh, par, cw, ch, scale, alpha) {
  const cam = C.cam, px = cam.x * par + C.t * 3 * par, py = cam.y * par;
  for (let gx = Math.floor(px / cw) - 1; gx <= Math.floor((px + bw) / cw) + 1; gx++)
    for (let gy = Math.floor(py / ch) - 1; gy <= Math.floor((py + bh) / ch) + 1; gy++) {
      const h = hash(gx * 3 + Math.round(par * 100), gy);
      if (h > .6) continue;
      const x = gx * cw + hash(gy, gx) * cw * .7 - px, y = gy * ch + hash(gx, gy + 11) * ch * .7 - py;
      drawCloud(Math.round(x), Math.round(y), (.7 + hash(gx + 5, gy + 5) * .6) * scale, alpha);
    }
}
function drawCloud(x, y, s, a) {
  cx.globalAlpha = a;
  cx.fillStyle = '#d4f2ff';
  cx.beginPath(); cx.ellipse(x, y + 10 * s, 62 * s, 16 * s, 0, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#ffffff';
  cx.beginPath();
  cx.arc(x - 34 * s, y + 2 * s, 22 * s, 0, Math.PI * 2);
  cx.arc(x - 6 * s, y - 14 * s, 30 * s, 0, Math.PI * 2);
  cx.arc(x + 28 * s, y - 2 * s, 24 * s, 0, Math.PI * 2);
  cx.arc(x + 48 * s, y + 6 * s, 14 * s, 0, Math.PI * 2);
  cx.fill();
  cx.fillStyle = 'rgba(255,255,255,.9)';
  cx.beginPath(); cx.ellipse(x, y + 6 * s, 58 * s, 14 * s, 0, 0, Math.PI * 2); cx.fill();
  cx.globalAlpha = 1;
}

// solid stone: the side walls and the ground
function drawWall(x, y, cap) {
  cx.fillStyle = cap ? STONE.face : STONE.dark; cx.fillRect(x, y, T, T);
  cx.strokeStyle = INK; cx.lineWidth = 1.5;
  for (let row = 0; row < 2; row++) {
    const off = ((Math.floor(y / 16) + row) & 1) * 16;
    for (let bx = -16; bx < T; bx += 32) {
      const rx = x + bx + off, ry = y + row * 16;
      const l = Math.max(x, rx), r = Math.min(x + T, rx + 32);
      if (r <= l) continue;
      cx.fillStyle = cap && row === 0 ? STONE.top : (hash(Math.floor(rx / 32), Math.floor(ry / 16)) > .5 ? STONE.face : STONE.dark);
      cx.fillRect(l + 1, ry + 1, r - l - 2, 14);
      cx.strokeRect(l + 1, ry + 1, r - l - 2, 14);
    }
  }
}

// a run of stone ledge, ice or cracked sandstone from column a to b
function drawLedge(kind, a, b, r) {
  const x = a * T, y = r * T, w = (b - a + 1) * T;
  if (kind === PLAT) {
    rrect(cx, x, y, w, T, 4); fillOut(STONE.dark, 2.4);
    cx.fillStyle = STONE.top; cx.fillRect(x + 1.5, y + 1.5, w - 3, 8);
    cx.fillStyle = STONE.hi; cx.fillRect(x + 3, y + 2.5, w - 6, 2);
    cx.strokeStyle = INK; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(x, y + 10); cx.lineTo(x + w, y + 10); cx.stroke();
    cx.lineWidth = 1.3;
    cx.beginPath(); cx.moveTo(x, y + 21); cx.lineTo(x + w, y + 21); cx.stroke();
    cx.lineWidth = 1.3;
    for (let i = 1; i < w / 16; i++) {
      const lx = x + i * 16;
      if (i % 2 === 0) { cx.beginPath(); cx.moveTo(lx, y + 1); cx.lineTo(lx, y + 10); cx.moveTo(lx, y + 21); cx.lineTo(lx, y + T - 1); cx.stroke(); }
      else { cx.beginPath(); cx.moveTo(lx, y + 10); cx.lineTo(lx, y + 21); cx.stroke(); }
    }
    cx.fillStyle = STONE.deep;
    for (let i = 0; i < w / 16; i++) if (hash(a + i, r) > .55) cx.fillRect(x + i * 16 + 4, y + 13, 7, 5);
  } else if (kind === ICE) {
    for (let i = 0; i < w / 11; i++) {
      const ix = x + 4 + i * 11, len = 5 + hash(a + i, r) * 8;
      cx.beginPath(); cx.moveTo(ix, y + T - 1); cx.lineTo(ix + 3, y + T - 1 + len); cx.lineTo(ix + 6, y + T - 1); cx.closePath();
      fillOut('#aee9fb', 1.4);
    }
    rrect(cx, x, y, w, T, 5); fillOut('#aee9fb', 2.4);
    cx.fillStyle = '#8fdcf7'; cx.fillRect(x + 2, y + 20, w - 4, 10);
    cx.fillStyle = '#e6fbff'; cx.fillRect(x + 3, y + 2.5, w - 6, 3);
    cx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < w / 32; i++) { cx.fillRect(x + i * 32 + 8, y + 8, 6, 2); cx.fillRect(x + i * 32 + 20, y + 14, 3, 2); }
  } else if (kind === CRUMBLE) {
    for (let c = a; c <= b; c++) {
      const cr = W.crumble.get(c + ',' + r), sh = cr && cr.t > 0 ? (Math.random() - .5) * 3 : 0;
      const tx = c * T + sh;
      rrect(cx, tx + .5, y, T - 1, T, 4); fillOut('#d9b98a', 2.2);
      cx.fillStyle = '#c29e6c'; cx.fillRect(tx + 2.5, y + 20, T - 5, 10);
      cx.fillStyle = '#efd3a6'; cx.fillRect(tx + 3, y + 2.5, T - 6, 3);
      cx.strokeStyle = INK; cx.lineWidth = 1.4; cx.beginPath();
      cx.moveTo(tx + 9, y + 1); cx.lineTo(tx + 13, y + 9); cx.lineTo(tx + 9, y + 17); cx.lineTo(tx + 12, y + 26);
      cx.moveTo(tx + 23, y + 1); cx.lineTo(tx + 19, y + 10); cx.lineTo(tx + 22, y + 15); cx.stroke();
    }
  }
}

const FRUIT = [['#ef3b4f', '#ff8a96'], ['#ffd23b', '#fff09a'], ['#ff9f2e', '#ffcf8a'], ['#69d147', '#b4f19a']];
function drawItemTile(t, c, r) {
  const x = c * T, y = r * T;
  if (t === CRATE) {
    // a wooden crate heaped with fruit
    const [fc, fh] = FRUIT[Math.floor(hash(c, r) * FRUIT.length)];
    for (let i = 0; i < 4; i++) {
      const fx = x + 6 + i * 6.7, fy = y + 6 - (i % 2) * 2;
      cx.beginPath(); cx.arc(fx, fy, 4.6, 0, Math.PI * 2); fillOut(fc, 1.3);
      cx.fillStyle = fh; cx.beginPath(); cx.arc(fx - 1.4, fy - 1.4, 1.4, 0, Math.PI * 2); cx.fill();
    }
    rrect(cx, x + 1.5, y + 7, T - 3, T - 7, 2); fillOut('#c4843f', 2.2);
    cx.fillStyle = '#a36429'; cx.fillRect(x + 3, y + 15, T - 6, 2.5); cx.fillRect(x + 3, y + 23, T - 6, 2.5);
    cx.strokeStyle = INK; cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(x + 1.5, y + 11); cx.lineTo(x + T - 1.5, y + 11); cx.stroke();
  } else if (t === BARREL) {
    rrect(cx, x + 3, y + 1, T - 6, T - 1, 9); fillOut('#b8763a', 2.2);
    cx.fillStyle = '#d99a5a'; cx.fillRect(x + 9, y + 3, 4, T - 5);
    cx.fillStyle = '#8b96ad';
    cx.fillRect(x + 3.5, y + 7, T - 7, 3.5); cx.fillRect(x + 3.5, y + T - 10, T - 7, 3.5);
    cx.strokeStyle = INK; cx.lineWidth = 1.2;
    cx.strokeRect(x + 3.5, y + 7, T - 7, 3.5); cx.strokeRect(x + 3.5, y + T - 10, T - 7, 3.5);
  } else if (t === BOOKS) {
    const cols = ['#ef3b4f', '#4b7cf0', '#4fc23a', '#a96bff', '#ff9f2e', '#2ec7c7'];
    for (let i = 0; i < 4; i++) {
      const inset = Math.floor(hash(c, r * 4 + i) * 6), bw = T - inset - Math.floor(hash(c + i, r) * 5);
      rrect(cx, x + inset, y + i * 8, bw, 7.5, 1.5); fillOut(cols[Math.floor(hash(r, c * 4 + i) * cols.length)], 1.5);
      cx.fillStyle = '#fff7e0'; cx.fillRect(x + inset + bw - 5, y + i * 8 + 1.5, 3, 4.5);
    }
  } else if (t === CHEST) {
    const open = W.opened.has(c + ',' + r);
    if (open) { cx.fillStyle = '#ffd23b'; cx.beginPath(); cx.ellipse(x + 16, y + 11, 11, 4, 0, 0, Math.PI * 2); cx.fill(); }
    rrect(cx, x + 2, y + 10, T - 4, T - 10, 3); fillOut('#c0702f', 2.2);
    if (open) { rrect(cx, x + 2, y - 2, T - 4, 7, 3); fillOut('#a35b22', 2); }
    else { rrect(cx, x + 2, y + 2, T - 4, 10, 5); fillOut('#a35b22', 2.2); }
    cx.fillStyle = '#ffc61a'; cx.fillRect(x + 13, y + 9, 6, 8); cx.strokeStyle = INK; cx.lineWidth = 1.3; cx.strokeRect(x + 13, y + 9, 6, 8);
  } else if (t === SPRING) {
    const sq = W.springT.get(c + ',' + r) || 0, top = y + 6 + sq * 20;
    rrect(cx, x + 3, y + T - 7, T - 6, 7, 2); fillOut('#4b5469', 2);
    cx.strokeStyle = INK; cx.lineWidth = 4; cx.beginPath();
    for (let i = 0; i <= 4; i++) cx.lineTo(x + (i % 2 ? 24 : 8), top + 7 + (y + T - 7 - top - 7) * i / 4);
    cx.stroke();
    cx.strokeStyle = '#c9d1de'; cx.lineWidth = 2; cx.stroke();
    rrect(cx, x + 1, top, T - 2, 8, 3); fillOut('#ef3b4f', 2.2);
    cx.fillStyle = '#ff9aa6'; cx.fillRect(x + 4, top + 1.5, T - 8, 2);
  } else if (t === SPIKE) {
    for (let i = 0; i < 3; i++) {
      const sx = x + 2 + i * 10;
      cx.beginPath(); cx.moveTo(sx, y + T); cx.lineTo(sx + 5, y + 15); cx.lineTo(sx + 10, y + T); cx.closePath();
      fillOut('#d7deea', 1.6);
      cx.fillStyle = '#fff'; cx.fillRect(sx + 4, y + 20, 1.5, 5);
    }
  }
}

function drawTiles(c0, c1, r0, r1) {
  for (let r = r0; r <= r1; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = tile(c, r);
      if (!t) continue;
      if (t === SOLID) { if (c >= c0 - 1 && c <= c1 + 1) drawWall(c * T, r * T, r === 0 && c > 0 && c < COLS - 1); continue; }
      if (t === PLAT || t === ICE || t === CRUMBLE) {
        let b = c; while (b + 1 < COLS - 1 && tile(b + 1, r) === t) b++;
        if (b >= c0 - 1 && c <= c1 + 1) drawLedge(t, c, b, r);
        c = b; continue;
      }
      if (c >= c0 - 1 && c <= c1 + 1) drawItemTile(t, c, r);
    }
  }
}

function drawMover(m) {
  const x = Math.round(m.x), y = m.y;
  // track
  cx.strokeStyle = 'rgba(29,31,43,.25)'; cx.lineWidth = 3; cx.setLineDash([6, 6]);
  cx.beginPath(); cx.moveTo(m.minX + 6, y + 6); cx.lineTo(m.maxX - 6, y + 6); cx.stroke(); cx.setLineDash([]);
  rrect(cx, x, y, m.w, 14, 4); fillOut('#c4843f', 2.2);
  cx.fillStyle = '#e0a866'; cx.fillRect(x + 3, y + 2.5, m.w - 6, 3);
  cx.strokeStyle = INK; cx.lineWidth = 1.2;
  for (let i = 1; i < m.w / 16; i++) { cx.beginPath(); cx.moveTo(x + i * 16, y + 1); cx.lineTo(x + i * 16, y + 13); cx.stroke(); }
  // gear
  cx.save(); cx.translate(x + m.w / 2, y + 19); cx.rotate(m.x / 10);
  cx.beginPath();
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, rr = i % 2 ? 6 : 8; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  cx.closePath(); fillOut('#8b96ad', 1.8);
  cx.beginPath(); cx.arc(0, 0, 2.5, 0, Math.PI * 2); fillOut('#4b5469', 1.2);
  cx.restore();
}

// hanging lanterns on wooden arms from the walls, and strings of flags
function drawDecor(d) {
  const y = d.r * T;
  if (d.k === 'lamp') {
    const s = d.side, wx = s > 0 ? T : WW - T, end = wx + s * 70;
    const beamY = y;
    // brace and beam
    cx.beginPath(); cx.moveTo(wx, beamY + 34); cx.lineTo(wx + s * 30, beamY + 6); cx.lineTo(wx + s * 36, beamY + 10); cx.lineTo(wx + s * 6, beamY + 40); cx.closePath();
    fillOut('#9a6233', 2);
    rrect(cx, Math.min(wx, end), beamY, Math.abs(end - wx), 10, 2); fillOut('#b8763a', 2.2);
    // rope and lantern
    const lx = end - s * 12, sw = Math.sin(C.t * 1.6 + d.r) * 2;
    cx.strokeStyle = '#c9a06a'; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(lx, beamY + 10); cx.lineTo(lx + sw, beamY + 18); cx.stroke();
    cx.save(); cx.translate(lx + sw, beamY + 18);
    cx.fillStyle = 'rgba(255,230,120,.25)'; cx.beginPath(); cx.arc(0, 14, 18, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.moveTo(-7, 4); cx.lineTo(7, 4); cx.lineTo(4, -1); cx.lineTo(-4, -1); cx.closePath(); fillOut('#5a6274', 1.8);
    rrect(cx, -6, 4, 12, 16, 2); fillOut('#ffe066', 2);
    cx.fillStyle = '#fff6c2'; cx.fillRect(-3, 7, 3, 10);
    cx.strokeStyle = INK; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(-6, 12); cx.lineTo(6, 12); cx.moveTo(0, 4); cx.lineTo(0, 20); cx.stroke();
    rrect(cx, -7, 20, 14, 3, 1); fillOut('#5a6274', 1.6);
    cx.restore();
  } else if (d.k === 'flags') {
    const x0 = d.a * T, x1 = d.b * T, sag = 16;
    cx.strokeStyle = INK; cx.lineWidth = 1.5; cx.beginPath();
    for (let i = 0; i <= 12; i++) { const t = i / 12; cx.lineTo(x0 + (x1 - x0) * t, y + Math.sin(t * Math.PI) * sag); }
    cx.stroke();
    const cols = ['#ef3b4f', '#ffd23b', '#4b7cf0', '#4fc23a', '#ffffff'];
    const n = Math.floor((x1 - x0) / 18);
    for (let i = 1; i < n; i++) {
      const t = i / n, fx = x0 + (x1 - x0) * t, fy = y + Math.sin(t * Math.PI) * sag, flap = Math.sin(C.t * 3 + i) * 1.5;
      cx.beginPath(); cx.moveTo(fx - 5, fy); cx.lineTo(fx + 5, fy); cx.lineTo(fx + flap, fy + 12); cx.closePath();
      fillOut(cols[(i + d.r) % cols.length], 1.4);
    }
  }
}
