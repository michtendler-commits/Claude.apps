<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Jumper X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap">
<style>
  /* Full-bleed canvas world; HUD and panels float over it in pixel type */
  :root {
    color-scheme: dark;
    --ink: #07030f;
    --panel: rgba(16, 8, 34, .9);
    --line: #3b2a66;
    --text: #f4eefc;
    --muted: #a99cc7;
    --gold: #ffcc29;
    --ember: #ff6a1a;
    --heart: #ff4d6d;
    --pixel: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    --body: 'Nunito', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text); font-family: var(--body);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: clamp(8px, 2.5vw, 14px);
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
    font-family: var(--pixel); font-size: clamp(9px, 2.5vw, 14px); text-shadow: 0 2px 0 #000; white-space: nowrap;
    pointer-events: none;
  }
  .hud[hidden] { display: none; }
  .hud .floor { color: var(--gold); }
  .hud .hearts { color: var(--heart); letter-spacing: 2px; }
  .hud .lava { color: var(--ember); }
  .hud .grow { flex: 1; }
  .hud .coins { color: var(--gold); font-variant-numeric: tabular-nums; }
  .hud button {
    pointer-events: auto; width: 38px; height: 38px; border-radius: 10px;
    background: rgba(0, 0, 0, .45); font-size: 16px; line-height: 38px; text-align: center; font-family: var(--body);
  }

  /* ---------- touch controls ---------- */
  .touch {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: none; align-items: flex-end; gap: 12px;
    padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .touch button {
    pointer-events: auto; touch-action: none;
    width: clamp(62px, 17vw, 84px); height: clamp(62px, 17vw, 84px); border-radius: 50%;
    background: rgba(255, 255, 255, .14); border: 2px solid rgba(255, 255, 255, .22); font-size: 26px;
  }
  .touch button.on { background: rgba(255, 255, 255, .3); }
  .touch .jump { margin-left: auto; width: clamp(76px, 21vw, 100px); height: clamp(76px, 21vw, 100px);
                 background: rgba(255, 204, 41, .55); border-color: rgba(255, 204, 41, .8); color: #2a1600; }
  .touch .jump.on { background: rgba(255, 204, 41, .85); }
  body.coarse.playing .touch { display: flex; }

  /* ---------- panels ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(ellipse at center, rgba(7, 3, 15, .55), rgba(7, 3, 15, .92));
  }
  .overlay[hidden] { display: none; }
  .card { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .logo {
    font-family: var(--pixel); font-size: clamp(34px, 11vw, 64px); line-height: 1.1; margin: 0;
    color: var(--text); text-shadow: 0 5px 0 #000, 0 0 30px rgba(255, 106, 26, .35);
  }
  .logo span { color: var(--ember); display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12) rotate(6deg); } }
  .card h2 { font-family: var(--pixel); font-size: clamp(20px, 6vw, 30px); color: var(--gold); margin: 0; text-shadow: 0 4px 0 #000; }
  .card p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; max-width: 36ch; text-wrap: balance; }
  .card p b { color: var(--text); }
  .chips { display: flex; gap: 10px; }
  .chip { padding: 10px 18px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); font-weight: 800; }
  .chip.on { border-color: var(--gold); color: var(--gold); }
  .keys { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .keys kbd { font-family: var(--pixel); font-size: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; color: var(--text); }
  .big {
    width: 100%; max-width: 300px; padding: 18px; border-radius: 14px;
    font-family: var(--pixel); font-size: 18px; color: #2a1600; background: var(--gold); box-shadow: 0 6px 0 #9c7000;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #9c7000; }
  .big.alt { background: var(--panel); color: var(--text); box-shadow: 0 6px 0 #000; border: 2px solid var(--line); font-size: 13px; padding: 14px; }
  .best { font-family: var(--pixel); font-size: 11px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .logo span { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud" hidden>
  <span class="floor" id="hFloor">FLOOR 1</span>
  <span class="hearts" id="hHearts">♥♥♥</span>
  <span class="lava" id="hLava"></span>
  <span class="grow"></span>
  <span class="coins" id="hCoins">● 0</span>
  <button id="pauseBtn" title="Pause">❚❚</button>
  <button id="fsBtn" title="Full screen">⛶</button>
</div>

<div class="touch" id="touch">
  <button data-k="L" aria-label="Left">◀</button>
  <button data-k="R" aria-label="Right">▶</button>
  <button data-k="J" class="jump" aria-label="Jump">⤒</button>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
// =====================================================
// JUMPER X — climb a dark tower with a close-up camera
// =====================================================

const $ = id => document.getElementById(id);
const now = () => performance.now();
const store = {
  get(k, d) { try { const v = localStorage.getItem('jx_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jx_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- sound ----------
let AC;
function beep(f, d, type = 'square', vol = .05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const sfx = {
  jump:  () => beep(300, .12, 'square', .035, 300),
  jump2: () => beep(500, .14, 'triangle', .05, 500),
  coin:  () => { beep(880, .06, 'square', .035); setTimeout(() => beep(1320, .09, 'square', .035), 55); },
  stomp: () => beep(180, .12, 'square', .06, -80),
  die:   () => beep(400, .45, 'sawtooth', .06, -330),
  door:  () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .12, 'triangle', .07), i * 70)); },
};

// ---------- world constants ----------
const T = 32, COLS = 24, ROWS = 40, WW = COLS * T, WH = ROWS * T;
const GRAV = 1900, JUMP = 690, RUN = 190;
const EMPTY = 0, SOLID = 1, PLAT = 2, SPIKE = 3;

const cv = $('game'), cx = cv.getContext('2d');
const lc = document.createElement('canvas'), lx = lc.getContext('2d');
let DPR = 1, SW = 0, SH = 0;

const keys = {};
const C = {
  state: 'title', mode: 1, seed: 7, floor: 1, hearts: 3, coins: 0, L: null, ents: [],
  players: [], parts: [], lavaY: WH, lavaT: 5, banner: 0, shake: 0, t: 0, bg: null,
  touch: { L: false, R: false, J: false }, cam: { x: 0, y: 0, z: 2 }, last: 0,
};

// ---------- screen fitting ----------
// The camera zoom comes from the screen's area, so every device sees roughly
// the same small patch of the tower (about 11 tiles across on average).
function baseZoom() { return Math.max(1, Math.sqrt(SW * SH) / (11 * T)); }
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = innerWidth; SH = innerHeight;
  cv.width = lc.width = Math.round(SW * DPR);
  cv.height = lc.height = Math.round(SH * DPR);
  if (C.L) updateCamera(0, true);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.body.classList.toggle('coarse', matchMedia('(pointer: coarse)').matches);

// ---------- seeded random ----------
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));

// ---------- level generation ----------
// One hidden route of platforms winds up the tower to the door; decoy ledges
// branch off it so you can't tell the real path from the dark.
function genFloor(f) {
  R = mulberry(C.seed * 977 + f * 7919);
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(EMPTY));
  for (let r = 0; r < ROWS; r++) g[r][0] = g[r][COLS - 1] = SOLID;
  for (let c = 0; c < COLS; c++) g[0][c] = g[ROWS - 1][c] = SOLID;

  const ents = [], coins = [];
  const startC = ri(2, COLS - 3);

  // rows of the true path: 3 apart, sometimes 4 (needs a double jump) from floor 3
  const rows = [];
  for (let r = ROWS - 1; ;) {
    const nr = r - (f >= 3 && R() < .35 ? 4 : 3);
    if (nr < 2) { if (r > 2) { if (r - 2 >= 2) rows.push(2); else rows[rows.length - 1] = 2; } break; }
    rows.push(nr); r = nr;
  }

  let prev = { a: 1, b: COLS - 2, r: ROWS - 1 }, dir = R() < .5 ? -1 : 1;
  const mains = [];
  for (const r of rows) {
    const len = ri(3, f < 5 ? 5 : 4);
    let a = -1;
    for (let pass = 0; pass < 2 && a < 0; pass++) {
      for (let t = 0; t < 120; t++) {
        const c = ri(1, COLS - 1 - len), b = c + len - 1;
        const gap = Math.max(c - prev.b - 1, prev.a - b - 1);
        const shift = (c + b) / 2 - (prev.a + prev.b) / 2;
        if (gap <= 2 && (prev.r === ROWS - 1 || (Math.abs(shift) >= 3 && Math.sign(shift) === dir))) { a = c; break; }
      }
      if (a < 0) dir = -dir;
    }
    if (a < 0) a = Math.max(1, Math.min(COLS - 1 - len, prev.a));
    const p = { a, b: a + len - 1, r };
    for (let c = p.a; c <= p.b; c++) g[r][c] = PLAT;
    mains.push(p); prev = p;
    if (R() < .3) dir = -dir;
    if (p.a <= 3) dir = 1;
    if (p.b >= COLS - 4) dir = -1;
  }

  // decoy ledges along every row
  const decoys = [];
  for (const r of rows.slice(0, -1)) {
    const n = ri(1, 3);
    for (let k = 0; k < n; k++) {
      const len = ri(2, 4);
      for (let t = 0; t < 30; t++) {
        const c = ri(1, COLS - 1 - len);
        let free = true;
        for (let x = c - 2; x <= c + len + 1; x++) if (x > 0 && x < COLS - 1 && g[r][x] !== EMPTY) free = false;
        if (!free) continue;
        for (let x = c; x < c + len; x++) g[r][x] = PLAT;
        decoys.push({ a: c, b: c + len - 1, r });
        break;
      }
    }
  }
  for (const d of decoys) {
    if (f >= 2 && R() < .35) g[d.r - 1][ri(d.a, d.b)] = SPIKE;
    else if (R() < .6) coins.push({ x: (d.a + d.b + 1) / 2 * T, y: (d.r - 1) * T + 16 });
  }

  // ground spikes, never more than two in a row, never next to the start
  const nSp = Math.min(2 + f, 10), floorRow = g[ROWS - 2];
  for (let t = 0, placed = 0; t < 120 && placed < nSp; t++) {
    const c = ri(1, COLS - 2);
    if (Math.abs(c - startC) <= 2 || floorRow[c]) continue;
    if ((floorRow[c - 1] === SPIKE && (floorRow[c - 2] === SPIKE || floorRow[c + 1] === SPIKE)) ||
        (floorRow[c + 1] === SPIKE && floorRow[c + 2] === SPIKE)) continue;
    floorRow[c] = SPIKE; placed++;
  }
  if (f >= 6) for (const m of mains.slice(0, -1)) {
    if (m.b - m.a >= 3 && R() < .4) g[m.r - 1][R() < .5 ? m.a : m.b] = SPIKE;
  }

  for (const m of mains.slice(0, -1)) {
    const c = Math.floor((m.a + m.b) / 2);
    if (g[m.r - 1][c] === EMPTY) coins.push({ x: c * T + 16, y: (m.r - 1) * T + 16 });
  }
  for (let t = 0, n = 0; t < 60 && n < 6; t++) {
    const c = ri(2, COLS - 3), r = ri(3, ROWS - 4);
    if (g[r][c] === EMPTY && g[r + 1][c] === EMPTY) { coins.push({ x: c * T + 16, y: r * T + 16 }); n++; }
  }

  const slime = (minX, maxX, topY, x) => ({ k: 'slime', x: x ?? (minX + maxX) / 2 - 11, y: topY - 16, w: 22, h: 16,
    vx: (R() < .5 ? -1 : 1) * (35 + f * 4), minX, maxX, t: R() * 6 });
  if (f >= 2) {
    for (const m of mains.slice(0, -1)) if (m.b - m.a >= 3 && R() < Math.min(.7, .25 + f * .06)) ents.push(slime(m.a * T, (m.b + 1) * T, m.r * T));
    for (const d of decoys) if (d.b - d.a >= 2 && R() < .3) ents.push(slime(d.a * T, (d.b + 1) * T, d.r * T));
  }
  if (f >= 3) {
    const farX = startC < COLS / 2 ? (COLS - 4) * T : 3 * T;
    ents.push(slime(T, (COLS - 1) * T, (ROWS - 1) * T, farX));
  }
  if (f >= 3) {
    const n = Math.min(6, 1 + Math.floor((f - 1) / 2));
    for (let i = 0; i < n; i++) {
      const y0 = ri(4, ROWS - 8) * T + 8;
      ents.push({ k: 'bat', x: ri(3, COLS - 4) * T, y: y0, y0, w: 20, h: 12, vx: (R() < .5 ? -1 : 1) * (55 + f * 4),
                  t: R() * 6, amp: ri(10, 26) });
    }
  }

  const top = mains[mains.length - 1], dc = ri(top.a, top.b);
  const door = { x: dc * T + 4, y: T, w: 24, h: 32 };
  const torches = [];
  for (let t = 0; t < 120 && torches.length < 12; t++) {
    const c = ri(2, COLS - 3), r = ri(2, ROWS - 4);
    if (g[r][c] === EMPTY && g[r + 1][c] === EMPTY && !torches.some(o => Math.abs(o.c - c) + Math.abs(o.r - r) < 7)) torches.push({ c, r });
  }
  const windows = [];
  for (let t = 0; t < 40 && windows.length < 6; t++) {
    const c = ri(2, COLS - 3), r = ri(3, ROWS - 6);
    if (!windows.some(o => Math.abs(o.c - c) < 4 && Math.abs(o.r - r) < 5)) windows.push({ c, r });
  }
  R = Math.random;
  return { g, ents, coins, door, startC, torches, windows, hue: (230 + f * 37) % 360 };
}

function renderBg(L) {
  const b = document.createElement('canvas'); b.width = WW; b.height = WH;
  const g = b.getContext('2d');
  const light = Math.max(14, 28 - C.floor);
  g.fillStyle = `hsl(${L.hue},18%,${light}%)`; g.fillRect(0, 0, WW, WH);
  const rr = mulberry(C.floor * 31 + C.seed);
  for (let y = 0; y < WH; y += 16) {
    const off = (y / 16) % 2 ? 0 : 16;
    for (let x = -off; x < WW; x += 32) {
      g.fillStyle = `hsl(${L.hue},18%,${light + (rr() * 6 - 3)}%)`;
      g.fillRect(x + 1, y + 1, 30, 14);
    }
  }
  for (const w of L.windows) {
    const x = w.c * T + 4, y = w.r * T;
    g.fillStyle = `hsl(${L.hue},30%,7%)`;
    g.beginPath(); g.moveTo(x, y + 80); g.lineTo(x, y + 14); g.arc(x + 12, y + 14, 12, Math.PI, 0); g.lineTo(x + 24, y + 80); g.fill();
    g.fillStyle = 'rgba(255,255,255,.6)';
    for (let i = 0; i < 4; i++) g.fillRect(x + 4 + rr() * 16, y + 8 + rr() * 60, 1.5, 1.5);
  }
  g.fillStyle = `hsl(${(L.hue + 160) % 360},55%,36%)`;
  for (let bx = 2; bx < COLS - 2; bx += 5) {
    const x = bx * T + 6; g.beginPath(); g.moveTo(x, 40); g.lineTo(x + 20, 40); g.lineTo(x + 20, 100); g.lineTo(x + 10, 90); g.lineTo(x, 100); g.fill();
  }
  return b;
}

// ---------- players & floors ----------
function makePlayer(i) {
  return { i, x: 0, y: 0, w: 20, h: 26, vx: 0, vy: 0, onGround: false, coyote: 0, jumpBuf: 0, jPrev: false,
           jumpCut: false, dropT: 0, airJumps: 1, flip: 0, face: 1, dead: false, respawnT: 0, inv: 0, walk: 0,
           col: i === 0 ? '#ffb02e' : '#3ee0c0', dark: i === 0 ? '#c97b0c' : '#1d9f86' };
}

function loadFloor() {
  const L = genFloor(C.floor);
  C.L = L; C.ents = L.ents; C.lavaY = WH + 12; C.lavaT = 5; C.banner = 1.8;
  C.bg = renderBg(L);
  const side = L.startC < COLS / 2 ? 1 : -1;
  C.players.forEach((p, i) => {
    p.x = (L.startC + (i ? side : 0)) * T + 6;
    p.y = (ROWS - 1) * T - p.h;
    p.vx = p.vy = 0; p.airJumps = 1; p.dead = false; p.respawnT = 0; p.inv = 1.2; p.dropT = 0; p.face = side;
  });
  updateCamera(0, true);
}

function startGame() {
  C.seed = 1 + Math.floor(Math.random() * 1e9); C.floor = 1; C.hearts = 3; C.coins = 0; C.parts = [];
  C.players = [makePlayer(0)];
  if (C.mode === 2) C.players.push(makePlayer(1));
  loadFloor();
  setState('play');
}

function setState(s) {
  C.state = s;
  document.body.classList.toggle('playing', s === 'play');
  $('hud').hidden = s === 'title';
  if (s === 'play') { $('overlay').hidden = true; return; }
  $('overlay').hidden = false;
  const card = $('card');
  if (s === 'title') {
    const best = store.get('best', 0);
    card.innerHTML = `
      <h1 class="logo">JUMPER <span>X</span></h1>
      <p>Climb a dark tower one floor at a time. Somewhere above you is the door. Find it before the lava does.</p>
      <div class="chips">
        <button class="chip ${C.mode === 1 ? 'on' : ''}" data-p="1">1 Player</button>
        <button class="chip ${C.mode === 2 ? 'on' : ''}" data-p="2">2 Players</button>
      </div>
      <div class="keys">${C.mode === 1
        ? '<kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> move · <kbd>↑</kbd> <kbd>W</kbd> <kbd>Space</kbd> jump<br>Jump again in the air to double jump · <kbd>↓</kbd> drop down'
        : 'Gold: <kbd>A</kbd> <kbd>D</kbd> move, <kbd>W</kbd> jump, <kbd>S</kbd> drop<br>Mint: <kbd>←</kbd> <kbd>→</kbd> move, <kbd>↑</kbd> jump, <kbd>↓</kbd> drop<br>Jump again in the air to double jump'}</div>
      <button class="big" id="playBtn">PLAY</button>
      <div class="best">${best ? 'BEST: FLOOR ' + best : '&nbsp;'}</div>`;
    card.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { C.mode = +b.dataset.p; setState('title'); });
    $('playBtn').onclick = () => { goFullscreen(); startGame(); };
  } else if (s === 'pause') {
    card.innerHTML = `<h2>PAUSED</h2><p>Floor <b>${C.floor}</b> · ${C.coins} coins</p>
      <button class="big" id="resumeBtn">RESUME</button>
      <button class="big alt" id="quitBtn">QUIT TO TITLE</button>`;
    $('resumeBtn').onclick = () => setState('play');
    $('quitBtn').onclick = () => { showAttract(); setState('title'); };
  } else if (s === 'over') {
    const best = store.get('best', 0), isBest = C.floor > best;
    if (isBest) store.set('best', C.floor);
    card.innerHTML = `<h2>GAME OVER</h2>
      <p>You reached floor <b>${C.floor}</b>${isBest ? ', a new best!' : '.'}<br>${C.coins} coins collected.</p>
      <button class="big" id="againBtn">PLAY AGAIN</button>
      <button class="big alt" id="titleBtn">TITLE SCREEN</button>`;
    $('againBtn').onclick = () => { goFullscreen(); startGame(); };
    $('titleBtn').onclick = () => { showAttract(); setState('title'); };
  }
  const first = card.querySelector('.big'); if (first && !document.body.classList.contains('coarse')) first.focus();
}

// The title screen shows a dark tower with the camera drifting up it
function showAttract() {
  C.players = []; C.floor = 1; C.seed = 7; C.parts = [];
  const L = genFloor(1); C.L = L; C.ents = L.ents; C.bg = renderBg(L); C.lavaY = WH + 12;
  C.cam.z = baseZoom(); C.cam.x = (WW - SW / C.cam.z) / 2; C.cam.y = WH - SH / C.cam.z;
}

// ---------- full screen ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function goFullscreen() {
  if (fsEl()) return;
  const el = document.documentElement;
  try { const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
function exitFullscreen() {
  if (!fsEl()) return;
  try { const r = (document.exitFullscreen || document.webkitExitFullscreen)?.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
$('fsBtn').onclick = () => { fsEl() ? exitFullscreen() : goFullscreen(); };
$('pauseBtn').onclick = () => { if (C.state === 'play') setState('pause'); };

// ---------- input ----------
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (C.state === 'play') setState('pause'); else if (C.state === 'pause') setState('play');
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (C.state === 'play') setState('pause'); });

document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const set = v => e => { e.preventDefault(); C.touch[k] = v; b.classList.toggle('on', v); };
  b.addEventListener('pointerdown', set(true));
  b.addEventListener('pointerup', set(false));
  b.addEventListener('pointercancel', set(false));
  b.addEventListener('pointerleave', set(false));
});

function inputFor(i) {
  const k = keys, t = C.touch;
  if (C.mode === 1) return { l: k.ArrowLeft || k.KeyA || t.L, r: k.ArrowRight || k.KeyD || t.R,
                             j: k.ArrowUp || k.KeyW || k.Space || t.J, d: k.ArrowDown || k.KeyS };
  if (i === 0) return { l: k.KeyA || t.L, r: k.KeyD || t.R, j: k.KeyW || t.J, d: k.KeyS };
  return { l: k.ArrowLeft, r: k.ArrowRight, j: k.ArrowUp, d: k.ArrowDown };
}

// ---------- physics ----------
function tile(c, r) {
  if (c < 0 || c >= COLS || r < 0) return SOLID;
  if (r >= ROWS) return EMPTY;
  return C.L.g[r][c];
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function moveX(p, dx) {
  p.x += dx;
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T);
  if (dx > 0) {
    const c = Math.floor((p.x + p.w - .01) / T);
    for (let r = r0; r <= r1; r++) if (tile(c, r) === SOLID) { p.x = c * T - p.w; p.vx = 0; return; }
  } else if (dx < 0) {
    const c = Math.floor(p.x / T);
    for (let r = r0; r <= r1; r++) if (tile(c, r) === SOLID) { p.x = (c + 1) * T; p.vx = 0; return; }
  }
}
function moveY(p, dy) {
  const prevBottom = p.y + p.h;
  p.y += dy; p.onGround = false;
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T);
  if (dy > 0) {
    const r = Math.floor((p.y + p.h - .01) / T);
    for (let c = c0; c <= c1; c++) {
      const t = tile(c, r);
      if (t === SOLID || (t === PLAT && p.dropT <= 0 && prevBottom <= r * T + .5)) {
        p.y = r * T - p.h; p.vy = 0; p.onGround = true; return;
      }
    }
  } else if (dy < 0) {
    const r = Math.floor(p.y / T);
    for (let c = c0; c <= c1; c++) if (tile(c, r) === SOLID) { p.y = (r + 1) * T; p.vy = 0; return; }
  }
}

function burst(x, y, col, n = 14, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (.3 + Math.random());
    C.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: .5 + Math.random() * .4, col, size: 3 + Math.random() * 3 });
  }
}

function killPlayer(p) {
  if (p.dead) return;
  p.dead = true;
  burst(p.x + p.w / 2, p.y + p.h / 2, p.col, 22, 220);
  sfx.die(); C.shake = .35;
  if (C.hearts > 0) { C.hearts--; p.respawnT = 1.4; } else p.respawnT = -1;
}

function updatePlayer(p, dt) {
  const inp = inputFor(p.i);
  const target = ((inp.r ? 1 : 0) - (inp.l ? 1 : 0)) * RUN;
  const acc = (p.onGround ? 2400 : 1500) * dt;
  p.vx += Math.max(-acc, Math.min(acc, target - p.vx));
  if (target) p.face = Math.sign(target);

  const jNew = inp.j && !p.jPrev; p.jPrev = !!inp.j;
  p.jumpBuf = jNew ? .12 : p.jumpBuf - dt;
  p.coyote = p.onGround ? .1 : p.coyote - dt;
  p.dropT -= dt;
  if (inp.d && p.onGround) p.dropT = .2;
  if (p.onGround) p.airJumps = 1;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.jumpBuf = 0; p.coyote = 0; p.jumpCut = false; sfx.jump();
    burst(p.x + p.w / 2, p.y + p.h, '#ffffff88', 5, 60);
  } else if (jNew && p.airJumps > 0) {
    // double jump: one extra hop in mid-air
    p.vy = -JUMP * .88; p.airJumps--; p.jumpBuf = 0; p.jumpCut = false; p.flip = .35; sfx.jump2();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      C.parts.push({ x: p.x + p.w / 2, y: p.y + p.h, vx: Math.cos(a) * 90, vy: Math.sin(a) * 30 + 40, life: .35, col: '#ffffffcc', size: 3 });
    }
  }
  if (p.flip > 0) p.flip -= dt;
  if (!inp.j && p.vy < 0 && !p.jumpCut) { p.vy *= .5; p.jumpCut = true; }
  p.vy = Math.min(p.vy + GRAV * dt, 900);

  moveX(p, p.vx * dt);
  moveY(p, p.vy * dt);
  p.walk = p.onGround && Math.abs(p.vx) > 20 ? p.walk + dt * 12 : 0;
  if (p.inv > 0) p.inv -= dt;

  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T);
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (tile(c, r) === SPIKE && overlap(p, { x: c * T + 5, y: r * T + 18, w: 22, h: 14 })) killPlayer(p);
  }
  if (p.dead) return;
  if (p.y + p.h > C.lavaY + 4) { killPlayer(p); return; }

  for (const co of C.L.coins) {
    if (!co.got && Math.abs(co.x - (p.x + p.w / 2)) < 18 && Math.abs(co.y - (p.y + p.h / 2)) < 20) {
      co.got = true; C.coins++; sfx.coin(); burst(co.x, co.y, '#ffd93b', 8, 90);
    }
  }
  for (const e of C.ents) {
    if (e.dead || !overlap(p, e)) continue;
    if (p.vy > 50 && p.y + p.h - e.y < 14) {
      e.dead = true; p.vy = -JUMP * .65; p.jumpCut = true; p.airJumps = 1; C.coins++;
      sfx.stomp(); burst(e.x + e.w / 2, e.y + e.h / 2, e.k === 'bat' ? '#a46bff' : '#6be04f', 14);
    } else if (p.inv <= 0) { killPlayer(p); return; }
  }
  if (overlap(p, C.L.door)) nextFloor();
}

function nextFloor() {
  sfx.door();
  C.floor++; C.coins += 3;
  if (C.floor % 3 === 1 && C.hearts < 5) C.hearts++;
  loadFloor();
}

function update(dt) {
  C.t += dt;
  if (C.banner > 0) C.banner -= dt;
  if (C.shake > 0) C.shake -= dt;
  if (C.lavaT > 0) C.lavaT -= dt;
  else C.lavaY = Math.max(-40, C.lavaY - Math.min(12 + C.floor * 2.2, 40) * dt);

  for (const e of C.ents) {
    if (e.dead) continue;
    e.t += dt;
    if (e.k === 'slime') {
      e.x += e.vx * dt;
      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
    } else {
      e.x += e.vx * dt;
      if (e.x < T || e.x + e.w > WW - T) { e.vx *= -1; e.x = Math.max(T, Math.min(WW - T - e.w, e.x)); }
      e.y = e.y0 + Math.sin(e.t * 3) * e.amp;
    }
    if (e.y > C.lavaY) e.dead = true;
  }

  const floorBefore = C.floor;
  for (const p of C.players) {
    if (!p.dead) { updatePlayer(p, dt); if (C.floor !== floorBefore) break; continue; }
    if (p.respawnT > 0) {
      p.respawnT -= dt;
      if (p.respawnT <= 0) {
        const mate = C.players.find(q => q !== p && !q.dead);
        if (mate) {
          Object.assign(p, { x: mate.x, y: mate.y - 4, vx: 0, vy: -200, dead: false, inv: 1.5, respawnT: 0, airJumps: 1 });
          burst(p.x + p.w / 2, p.y + p.h / 2, p.col, 12);
        } else { loadFloor(); C.banner = 1.2; break; }
      }
    }
  }
  if (C.players.every(p => p.dead && p.respawnT < 0)) { setState('over'); return; }

  for (const q of C.parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; }
  C.parts = C.parts.filter(q => q.life > 0);
}

// ---------- camera ----------
function updateCamera(dt, snap) {
  const cam = C.cam;
  let focus = C.players.filter(p => !p.dead);
  if (!focus.length) focus = C.players;
  if (!focus.length) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of focus) {
    x0 = Math.min(x0, p.x + p.w / 2); x1 = Math.max(x1, p.x + p.w / 2);
    y0 = Math.min(y0, p.y + p.h / 2); y1 = Math.max(y1, p.y + p.h / 2);
  }
  const base = baseZoom();
  // two players: pull back just enough to keep both on screen
  const z = Math.max(base * .5, Math.min(base, SW / (x1 - x0 + 8 * T), SH / (y1 - y0 + 8 * T)));
  cam.z = snap ? z : cam.z + (z - cam.z) * Math.min(1, dt * 3);
  const vw = SW / cam.z, vh = SH / cam.z;
  let tx = (x0 + x1) / 2 - vw / 2, ty = (y0 + y1) / 2 - vh * .58;
  tx = vw >= WW ? (WW - vw) / 2 : Math.max(0, Math.min(WW - vw, tx));
  // on touch screens let the camera sink below the floor so the buttons don't cover you
  const padB = document.body.classList.contains('coarse') ? 130 / cam.z : 0;
  ty = vh >= WH ? (WH - vh) / 2 : Math.max(0, Math.min(WH - vh + padB, ty));
  if (snap) { cam.x = tx; cam.y = ty; }
  else { const k = Math.min(1, dt * 7); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; }
}

// ---------- drawing (world space) ----------
function drawTiles(c0, c1, r0, r1) {
  const g = C.L.g, hue = C.L.hue;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const t = g[r][c], x = c * T, y = r * T;
    if (t === SOLID) {
      cx.fillStyle = `hsl(${hue},14%,20%)`; cx.fillRect(x, y, T, T);
      cx.fillStyle = `hsl(${hue},14%,30%)`; cx.fillRect(x + 2, y + 2, T - 4, T - 4);
      cx.fillStyle = `hsl(${hue},14%,38%)`; cx.fillRect(x + 2, y + 2, T - 4, 4);
      cx.fillStyle = `hsl(${hue},14%,22%)`; cx.fillRect(x + 2, y + T - 6, T - 4, 4);
    } else if (t === PLAT) {
      cx.fillStyle = '#5a3415'; cx.fillRect(x, y, T, 12);
      cx.fillStyle = '#9b5d2a'; cx.fillRect(x, y, T, 9);
      cx.fillStyle = '#c47e3e'; cx.fillRect(x, y, T, 3);
      cx.fillStyle = '#5a3415'; cx.fillRect(x + 15, y + 1, 2, 8);
      if (tile(c - 1, r) !== PLAT || tile(c + 1, r) !== PLAT) {
        const bx = tile(c - 1, r) !== PLAT ? x + 4 : x + T - 8;
        cx.fillStyle = '#3d2410'; cx.fillRect(bx, y + 12, 4, 10);
      }
    } else if (t === SPIKE) {
      cx.fillStyle = '#c9d1de';
      for (let i = 0; i < 3; i++) {
        const sx = x + 2 + i * 10;
        cx.beginPath(); cx.moveTo(sx, y + T); cx.lineTo(sx + 5, y + 16); cx.lineTo(sx + 10, y + T); cx.fill();
      }
      cx.fillStyle = '#ffffff'; for (let i = 0; i < 3; i++) cx.fillRect(x + 6 + i * 10, y + 18, 1, 4);
    }
  }
}

function drawDoor() {
  const d = C.L.door, glow = .5 + Math.sin(C.t * 4) * .2;
  cx.fillStyle = `rgba(255,220,120,${glow * .4})`; cx.fillRect(d.x - 6, d.y - 4, d.w + 12, d.h + 4);
  cx.fillStyle = '#2b1a0c'; cx.fillRect(d.x - 2, d.y, d.w + 4, d.h);
  cx.fillStyle = '#7a4a22'; cx.fillRect(d.x, d.y + 2, d.w, d.h - 2);
  cx.fillStyle = '#5c3618'; cx.fillRect(d.x + 7, d.y + 2, 2, d.h - 2); cx.fillRect(d.x + 15, d.y + 2, 2, d.h - 2);
  cx.fillStyle = '#ffd93b'; cx.fillRect(d.x + d.w - 6, d.y + 16, 3, 3);
}

function drawTorch(t) {
  const x = t.c * T + 14, y = t.r * T + 10, fl = Math.sin(C.t * 15 + t.c) * 2;
  cx.fillStyle = '#4a2c12'; cx.fillRect(x, y + 8, 4, 12);
  cx.fillStyle = 'rgba(255,170,60,.14)'; cx.beginPath(); cx.arc(x + 2, y + 4, 30 + fl, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#ff7a1a'; cx.fillRect(x - 2, y - 2 + fl / 2, 8, 10);
  cx.fillStyle = '#ffd93b'; cx.fillRect(x, y + 2, 4, 6);
}

function drawCoin(co) {
  const s = Math.abs(Math.cos(C.t * 4 + co.x)), bob = Math.sin(C.t * 3 + co.y) * 2;
  cx.fillStyle = '#b8860b'; cx.fillRect(co.x - 7 * s - 1, co.y - 8 + bob, 14 * s + 2, 16);
  cx.fillStyle = '#ffd93b'; cx.fillRect(co.x - 7 * s, co.y - 7 + bob, 14 * s, 14);
  cx.fillStyle = '#fff6b0'; cx.fillRect(co.x - 3 * s, co.y - 5 + bob, 2 * s, 8);
}

function drawEnemy(e) {
  if (e.k === 'slime') {
    const sq = Math.sin(e.t * 8) * 2;
    cx.fillStyle = '#2f8a22'; cx.fillRect(e.x - sq / 2, e.y + 2 + sq, e.w + sq, e.h - 2 - sq);
    cx.fillStyle = '#6be04f'; cx.fillRect(e.x + 2 - sq / 2, e.y + 4 + sq, e.w - 4 + sq, e.h - 8 - sq);
    cx.fillStyle = '#fff'; const ex = e.vx > 0 ? 10 : 4;
    cx.fillRect(e.x + ex, e.y + 6 + sq, 4, 4); cx.fillRect(e.x + ex + 6, e.y + 6 + sq, 4, 4);
    cx.fillStyle = '#000'; const px = e.vx > 0 ? 2 : 0;
    cx.fillRect(e.x + ex + px, e.y + 8 + sq, 2, 2); cx.fillRect(e.x + ex + 6 + px, e.y + 8 + sq, 2, 2);
  } else {
    const f = Math.sin(e.t * 20) > 0 ? -6 : 2;
    cx.fillStyle = '#5b2e9e';
    cx.beginPath(); cx.moveTo(e.x + 6, e.y + 4); cx.lineTo(e.x - 8, e.y + f); cx.lineTo(e.x + 2, e.y + 10); cx.fill();
    cx.beginPath(); cx.moveTo(e.x + 14, e.y + 4); cx.lineTo(e.x + 28, e.y + f); cx.lineTo(e.x + 18, e.y + 10); cx.fill();
    cx.fillStyle = '#a46bff'; cx.fillRect(e.x + 4, e.y, 12, 12);
    cx.fillStyle = '#ff3b5c'; cx.fillRect(e.x + 6, e.y + 4, 2, 2); cx.fillRect(e.x + 12, e.y + 4, 2, 2);
  }
}

function drawPlayer(p) {
  if (p.dead) return;
  if (p.inv > 0 && Math.floor(p.inv * 12) % 2) return;
  const x = Math.round(p.x), y = Math.round(p.y), f = p.face;
  if (p.flip > 0) {
    cx.save(); cx.translate(x + p.w / 2, 0);
    cx.scale(Math.max(.15, Math.abs(Math.cos(p.flip / .35 * Math.PI))), 1);
    cx.translate(-(x + p.w / 2), 0);
  }
  const stretch = p.onGround ? 0 : (p.vy < 0 ? 2 : -1), step = Math.sin(p.walk) * 3;
  cx.fillStyle = '#2a1a10';
  cx.fillRect(x + 3, y + 22 + Math.max(0, step), 6, 4);
  cx.fillRect(x + 11, y + 22 + Math.max(0, -step), 6, 4);
  cx.fillStyle = p.dark; cx.fillRect(x, y + 4 - stretch, 20, 19 + stretch);
  cx.fillStyle = p.col;  cx.fillRect(x, y + 4 - stretch, 17, 17 + stretch);
  cx.fillStyle = 'rgba(255,255,255,.35)'; cx.fillRect(x + 2, y + 6 - stretch, 13, 3);
  if (p.i === 0) {
    cx.fillStyle = '#e8475f'; cx.fillRect(x + 7, y - 3 - stretch, 5, 8);
    cx.fillStyle = '#ff8fa0'; cx.fillRect(x + 8, y - 3 - stretch, 2, 4);
  } else {
    cx.fillStyle = p.dark; cx.fillRect(x + 2, y - 4 - stretch, 4, 9); cx.fillRect(x + 13, y - 4 - stretch, 4, 9);
    cx.fillStyle = '#ffb3d1'; cx.fillRect(x + 3, y - 2 - stretch, 2, 5); cx.fillRect(x + 14, y - 2 - stretch, 2, 5);
  }
  const ex = f > 0 ? x + 9 : x + 2;
  cx.fillStyle = '#fff'; cx.fillRect(ex, y + 9 - stretch, 4, 5); cx.fillRect(ex + 6, y + 9 - stretch, 4, 5);
  cx.fillStyle = '#111'; cx.fillRect(ex + (f > 0 ? 2 : 0), y + 10 - stretch, 2, 3); cx.fillRect(ex + 6 + (f > 0 ? 2 : 0), y + 10 - stretch, 2, 3);
  if (p.flip > 0) cx.restore();
}

function drawLava() {
  const y = C.lavaY;
  if (y > WH) return;
  cx.fillStyle = 'rgba(255,90,20,.18)'; cx.fillRect(0, y - 30, WW, 30);
  cx.fillStyle = '#d9361a';
  cx.beginPath(); cx.moveTo(0, WH);
  for (let x = 0; x <= WW; x += 16) cx.lineTo(x, y + Math.sin(x * .05 + C.t * 3) * 4);
  cx.lineTo(WW, WH); cx.fill();
  cx.fillStyle = '#ff8a1f'; cx.fillRect(0, y + 8, WW, Math.max(0, WH - y));
  cx.fillStyle = '#ffd23b';
  for (let i = 0; i < 24; i++) {
    const bx = (i * 71 + C.t * 20) % WW, by = y + 14 + ((i * 37 + C.t * 30) % 60);
    if (by < WH) cx.fillRect(bx, by, 4, 4);
  }
}

// ---------- darkness ----------
// Paint the screen dark, then cut soft holes for the players, torches, the
// door and the lava. Beyond your own light the tower stays unknown.
function drawDarkness() {
  const cam = C.cam, k = cam.z * DPR;
  const sx = wx => (wx - cam.x) * k, sy = wy => (wy - cam.y) * k;
  lx.setTransform(1, 0, 0, 1, 0, 0);
  lx.globalCompositeOperation = 'source-over';
  lx.clearRect(0, 0, lc.width, lc.height);
  lx.fillStyle = `rgba(4,1,10,${Math.min(.97, .9 + C.floor * .006)})`;
  lx.fillRect(0, 0, lc.width, lc.height);
  lx.globalCompositeOperation = 'destination-out';
  const hole = (wx, wy, r, a = 1) => {
    const X = sx(wx), Y = sy(wy), Rr = r * k;
    if (X < -Rr || Y < -Rr || X > lc.width + Rr || Y > lc.height + Rr) return;
    const g = lx.createRadialGradient(X, Y, 0, X, Y, Rr);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.55, `rgba(0,0,0,${a * .75})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = g; lx.beginPath(); lx.arc(X, Y, Rr, 0, Math.PI * 2); lx.fill();
  };
  for (const p of C.players) if (!p.dead) hole(p.x + p.w / 2, p.y + p.h / 2, 5.2 * T);
  for (const t of C.L.torches) hole(t.c * T + 16, t.r * T + 14, (2.6 + Math.sin(C.t * 9 + t.c) * .12) * T, .85);
  hole(C.L.door.x + 12, C.L.door.y + 16, 1.8 * T, .9);
  for (const co of C.L.coins) if (!co.got) hole(co.x, co.y, .7 * T, .5);
  if (C.lavaY < WH) {
    const top = sy(C.lavaY - 5 * T), bot = sy(C.lavaY);
    const g = lx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
    lx.fillStyle = g; lx.fillRect(0, top, lc.width, lc.height - top);
  }
  if (C.state === 'title') hole(cam.x + SW / cam.z / 2, cam.y + SH / cam.z * .55, 7 * T, .6);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.drawImage(lc, 0, 0);
}

function draw() {
  const cam = C.cam, k = cam.z * DPR;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = '#07030f'; cx.fillRect(0, 0, cv.width, cv.height);
  if (!C.L) return;
  let ox = cam.x, oy = cam.y;
  if (C.shake > 0) { ox += (Math.random() - .5) * 6; oy += (Math.random() - .5) * 6; }
  ox = Math.round(ox * k) / k; oy = Math.round(oy * k) / k;
  cx.setTransform(k, 0, 0, k, -ox * k, -oy * k);
  cx.imageSmoothingEnabled = false;

  const vw = SW / cam.z, vh = SH / cam.z;
  const c0 = Math.max(0, Math.floor(ox / T)), c1 = Math.min(COLS - 1, Math.floor((ox + vw) / T));
  const r0 = Math.max(0, Math.floor(oy / T)), r1 = Math.min(ROWS - 1, Math.floor((oy + vh) / T));
  cx.drawImage(C.bg, 0, 0);
  C.L.torches.forEach(drawTorch);
  drawTiles(c0, c1, r0, r1);
  drawDoor();
  C.L.coins.forEach(co => { if (!co.got) drawCoin(co); });
  C.ents.forEach(e => { if (!e.dead) drawEnemy(e); });
  C.players.forEach(drawPlayer);
  for (const q of C.parts) { cx.globalAlpha = Math.min(1, q.life * 2); cx.fillStyle = q.col; cx.fillRect(q.x, q.y, q.size, q.size); }
  cx.globalAlpha = 1;
  drawLava();

  drawDarkness();

  // screen-space effects
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // lava below the view: a red glow creeps up from the bottom edge
  const below = C.lavaY - (cam.y + vh);
  if (C.state === 'play' && C.lavaT <= 0 && below > 0 && below < 8 * T) {
    const a = (1 - below / (8 * T)) * .55 * (.8 + Math.sin(C.t * 6) * .2);
    const g = cx.createLinearGradient(0, SH, 0, SH * .7);
    g.addColorStop(0, `rgba(255,70,20,${a})`); g.addColorStop(1, 'rgba(255,70,20,0)');
    cx.fillStyle = g; cx.fillRect(0, SH * .7, SW, SH * .3);
  }
  if (C.banner > 0 && C.state === 'play') {
    const fs = Math.min(48, SW / 9);
    cx.globalAlpha = Math.min(1, C.banner);
    cx.font = `${fs}px 'Press Start 2P', monospace`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = '#000'; cx.fillText('FLOOR ' + C.floor, SW / 2 + 4, SH * .38 + 4);
    cx.fillStyle = '#ffcc29'; cx.fillText('FLOOR ' + C.floor, SW / 2, SH * .38);
    cx.globalAlpha = 1;
  }
}

// ---------- HUD ----------
const hudCache = {};
function setHud(id, text) { if (hudCache[id] !== text) { hudCache[id] = text; $(id).textContent = text; } }
function updateHud() {
  setHud('hFloor', 'FLOOR ' + C.floor);
  setHud('hHearts', '♥'.repeat(C.hearts) || '—');
  setHud('hCoins', '● ' + C.coins);
  setHud('hLava', C.lavaT > 0 ? 'LAVA IN ' + Math.ceil(C.lavaT) : '');
}

// ---------- main loop ----------
function loop() {
  const t = now(), dt = Math.min(.033, (t - C.last) / 1000);
  C.last = t;
  if (C.state === 'play') { update(dt); if (C.state === 'play') updateCamera(dt); updateHud(); }
  else {
    C.t += dt;
    if (C.state === 'title' && C.L) {
      // drift slowly up the tower, then start again at the bottom
      const vh = SH / C.cam.z;
      C.cam.z = baseZoom();
      C.cam.x = Math.max(0, (WW - SW / C.cam.z) / 2);
      C.cam.y -= dt * 22;
      if (C.cam.y < 0) C.cam.y = Math.max(0, WH - vh);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

resize();
showAttract();
setState('title');
C.last = now();
requestAnimationFrame(loop);
</script>
</body>
