<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Jumper X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap">
<style>
  /* Full-bleed canvas world; HUD and panels float over it in pixel type */
  :root {
    color-scheme: dark;
    --ink: #07030f;
    --panel: rgba(16, 8, 34, .9);
    --line: #3b2a66;
    --text: #f4eefc;
    --muted: #a99cc7;
    --gold: #ffcc29;
    --ember: #ff6a1a;
    --heart: #ff4d6d;
    --sky: #7fd8ff;
    --pixel: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    --body: 'Nunito', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text); font-family: var(--body);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: clamp(8px, 2.5vw, 14px);
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
    font-family: var(--pixel); font-size: clamp(9px, 2.5vw, 14px); text-shadow: 0 2px 0 #000; white-space: nowrap;
    pointer-events: none;
  }
  .hud[hidden] { display: none; }
  .hud .height { color: var(--gold); font-variant-numeric: tabular-nums; }
  .hud .hearts { color: var(--heart); letter-spacing: 2px; }
  .hud .fx { color: var(--sky); font-family: var(--body); font-weight: 800; font-size: clamp(12px, 3vw, 16px); }
  .hud .lava { color: var(--ember); }
  .hud .grow { flex: 1; }
  .hud .coins { color: var(--gold); font-variant-numeric: tabular-nums; }
  .hud button {
    pointer-events: auto; width: 38px; height: 38px; border-radius: 10px;
    background: rgba(0, 0, 0, .45); font-size: 16px; line-height: 38px; text-align: center; font-family: var(--body);
  }

  /* ---------- touch controls ---------- */
  .touch {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: none; align-items: flex-end; gap: 12px;
    padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .touch button {
    pointer-events: auto; touch-action: none;
    width: clamp(62px, 17vw, 84px); height: clamp(62px, 17vw, 84px); border-radius: 50%;
    background: rgba(255, 255, 255, .14); border: 2px solid rgba(255, 255, 255, .22); font-size: 26px;
  }
  .touch button.on { background: rgba(255, 255, 255, .3); }
  .touch .jump { margin-left: auto; width: clamp(76px, 21vw, 100px); height: clamp(76px, 21vw, 100px);
                 background: rgba(255, 204, 41, .55); border-color: rgba(255, 204, 41, .8); color: #2a1600; }
  .touch .jump.on { background: rgba(255, 204, 41, .85); }
  body.coarse.playing .touch { display: flex; }

  /* ---------- panels ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(ellipse at center, rgba(7, 3, 15, .5), rgba(7, 3, 15, .9));
    overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .card { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; margin: auto; }
  .logo {
    font-family: var(--pixel); font-size: clamp(34px, 11vw, 64px); line-height: 1.1; margin: 0;
    color: var(--text); text-shadow: 0 5px 0 #000, 0 0 30px rgba(255, 106, 26, .35);
  }
  .logo span { color: var(--ember); display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12) rotate(6deg); } }
  .card h2 { font-family: var(--pixel); font-size: clamp(20px, 6vw, 30px); color: var(--gold); margin: 0; text-shadow: 0 4px 0 #000; }
  .card p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; max-width: 36ch; text-wrap: balance; }
  .card p b { color: var(--text); }
  .chips { display: flex; gap: 10px; }
  .chip { padding: 10px 18px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); font-weight: 800; }
  .chip.on { border-color: var(--gold); color: var(--gold); }
  .keys { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .keys kbd { font-family: var(--pixel); font-size: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; color: var(--text); }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px 14px; width: 100%;
            font-size: 13px; color: var(--muted); text-align: left; }
  .legend b { color: var(--text); }
  .big {
    width: 100%; max-width: 300px; padding: 18px; border-radius: 14px;
    font-family: var(--pixel); font-size: 18px; color: #2a1600; background: var(--gold); box-shadow: 0 6px 0 #9c7000;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #9c7000; }
  .big.alt { background: var(--panel); color: var(--text); box-shadow: 0 6px 0 #000; border: 2px solid var(--line); font-size: 13px; padding: 14px; }
  .best { font-family: var(--pixel); font-size: 11px; color: var(--muted); }
  input, textarea { -webkit-user-select: text; user-select: text; touch-action: auto; }
  .you { display: flex; align-items: center; gap: 14px; width: 100%; background: var(--panel); border: 2px solid var(--line);
         border-radius: 16px; padding: 12px; text-align: left; }
  .you canvas { width: 72px; height: 72px; flex-shrink: 0; }
  .you-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .you label { font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
  .you input, .join input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: #0d0620;
    color: var(--text); font: 800 17px var(--body);
  }
  .you input:focus, .join input:focus { outline: none; border-color: var(--gold); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 3px solid transparent; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--ink); }
  .net { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .join { display: flex; gap: 8px; width: 100%; max-width: 300px; }
  .join input { flex: 1; min-width: 0; text-align: center; font-family: var(--pixel); font-size: 14px; letter-spacing: 2px; }
  .join .big { width: auto; padding: 12px 16px; }
  .big:disabled { opacity: .45; cursor: not-allowed; }
  .note { font-size: 14px !important; color: var(--muted); min-height: 1em; }
  .how { width: 100%; color: var(--muted); }
  .how summary { cursor: pointer; font-weight: 800; padding: 6px; }
  .how .keys { margin: 8px 0 12px; }
  .codebox { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 26px; border-radius: 18px;
             background: var(--panel); border: 2px solid var(--gold); }
  .codebox span { font-family: var(--pixel); font-size: 11px; color: var(--muted); }
  .codebox b { font-family: var(--pixel); font-size: clamp(28px, 9vw, 44px); color: var(--gold); letter-spacing: 4px;
               -webkit-user-select: text; user-select: text; }
  .plist-head { font-family: var(--pixel); font-size: 10px; color: var(--muted); }
  .plist { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
  .plist li, .board li { display: flex; align-items: center; gap: 10px; }
  .plist li { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 800; }
  .plist i, .board i { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .plist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .plist .tag { font-family: var(--pixel); font-size: 10px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .wait { font-weight: 800; color: var(--text) !important; }
  .board {
    position: fixed; z-index: 2; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(58px + env(safe-area-inset-top, 0px));
    margin: 0; padding: 8px 10px; list-style: none; background: rgba(0, 0, 0, .45); border-radius: 12px;
    display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 800; pointer-events: none; min-width: 130px;
  }
  .board[hidden] { display: none; }
  .board li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
  .board li b { font-family: var(--pixel); font-size: 9px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .board li.me span { color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { .logo span { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud" hidden>
  <span class="height" id="hHeight">▲ 0m</span>
  <span class="hearts" id="hHearts">♥♥♥</span>
  <span class="fx" id="hFx"></span>
  <span class="lava" id="hLava"></span>
  <span class="grow"></span>
  <span class="coins" id="hCoins">● 0</span>
  <button id="musicBtn" title="Music on">♪</button>
  <button id="pauseBtn" title="Pause">❚❚</button>
  <button id="fsBtn" title="Full screen">⛶</button>
</div>

<ol class="board" id="board" hidden></ol>

<div class="touch" id="touch">
  <button data-k="L" aria-label="Left">◀</button>
  <button data-k="R" aria-label="Right">▶</button>
  <button data-k="J" class="jump" aria-label="Jump">⤒</button>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
// =====================================================
// JUMPER X — an endless climb up a dark tower
// =====================================================

const $ = id => document.getElementById(id);
const now = () => performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem('jx_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jx_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- sound ----------
let AC;
function beep(f, d, type = 'square', vol = .05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const sfx = {
  jump:   () => beep(300, .12, 'square', .03, 260),
  jump2:  () => beep(480, .14, 'triangle', .05, 480),
  boing:  () => beep(160, .35, 'triangle', .08, 700),
  coin:   () => { beep(880, .06, 'square', .03); setTimeout(() => beep(1320, .09, 'square', .03), 55); },
  power:  () => { [440, 660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, .1, 'triangle', .06), i * 55)); },
  chest:  () => { [523, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .12, 'square', .04), i * 80)); },
  stomp:  () => beep(180, .12, 'square', .06, -80),
  crack:  () => beep(120, .18, 'sawtooth', .04, -40),
  hurt:   () => beep(330, .3, 'sawtooth', .06, -220),
  shield: () => beep(900, .25, 'sine', .07, -500),
  over:   () => beep(400, .7, 'sawtooth', .06, -340),
};

// ---------- chiptune music ----------
// A looping 8-bar tune in A minor (Am–F–C–G): square-wave lead, triangle
// bass, a soft arpeggio in the second half and noise drums. Notes are
// scheduled a little ahead on the audio clock so the beat never drifts.
const MUSIC = { on: store.get('music', true), playing: false, step: 0, next: 0, timer: 0, out: null, noise: null };
const BPM = 128, S16 = 60 / BPM / 4, SONG_STEPS = 128;
const CHORDS = [
  { root: 45, arp: [57, 60, 64] }, { root: 41, arp: [57, 60, 65] },
  { root: 48, arp: [60, 64, 67] }, { root: 43, arp: [55, 59, 62] },
];
// one entry per eighth note, 8 per bar; null = rest
const LEAD = [
  76, null, 74, 72, 74, 76, 76, null,   77, null, 76, 74, 72, 74, 72, null,
  72, 74, 76, 79, 76, 74, 72, 74,       71, null, 74, null, 79, 77, 76, 74,
  81, null, 79, 76, 79, null, 76, 74,   77, 76, 77, 79, 81, null, 77, null,
  79, null, 76, 72, 76, 79, 84, null,   83, null, 79, null, 74, 76, 77, 79,
];
const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);

function tone(type, freq, t, dur, vol, slideTo) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.setValueAtTime(vol, t + dur * .7);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(MUSIC.out); o.start(t); o.stop(t + dur + .02);
}
function hiss(t, dur, vol, hp) {
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = MUSIC.noise; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f).connect(g).connect(MUSIC.out); src.start(t); src.stop(t + dur + .02);
}
function playStep(s, t) {
  const bar = Math.floor(s / 16) % 8, inBar = s % 16, chord = CHORDS[bar % 4], partB = bar >= 4;
  // lead on eighth notes
  if (inBar % 2 === 0) {
    const n = LEAD[bar * 8 + inBar / 2];
    if (n != null) tone('square', midiHz(n), t, S16 * 1.8, .055);
  }
  // bouncing octave bass
  if (inBar % 2 === 0) tone('triangle', midiHz(chord.root + (inBar % 4 === 2 ? 12 : 0)), t, S16 * 1.9, .16);
  // sparkly arpeggio in the second half
  if (partB) tone('square', midiHz(chord.arp[inBar % 3] + 12), t, S16 * .9, .018);
  // drums
  if (inBar === 0 || inBar === 8 || (inBar === 10 && bar % 2)) tone('sine', 150, t, .14, .32, 40);
  if (inBar === 4 || inBar === 12) hiss(t, .12, .07, 1200);
  if (inBar % 2 === 1) hiss(t, .03, .025, 7000);
}
function musicTick() {
  while (MUSIC.next < AC.currentTime + .12) {
    playStep(MUSIC.step, MUSIC.next);
    MUSIC.next += S16; MUSIC.step = (MUSIC.step + 1) % SONG_STEPS;
  }
}
function musicStart() {
  if (MUSIC.playing || !MUSIC.on) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!MUSIC.out) {
      MUSIC.out = AC.createGain(); MUSIC.out.gain.value = .55; MUSIC.out.connect(AC.destination);
      MUSIC.noise = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
      const d = MUSIC.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    MUSIC.out.gain.setValueAtTime(.55, AC.currentTime);
    MUSIC.next = AC.currentTime + .08; MUSIC.playing = true;
    MUSIC.timer = setInterval(musicTick, 25);
  } catch (e) {}
}
function musicStop() {
  if (!MUSIC.playing) return;
  clearInterval(MUSIC.timer); MUSIC.playing = false;
  try { MUSIC.out.gain.setValueAtTime(0, AC.currentTime); } catch (e) {}
}
function setMusic(on) {
  MUSIC.on = on; store.set('music', on);
  on ? musicStart() : musicStop();
  renderMusicUI();
}
function renderMusicUI() {
  const on = MUSIC.on;
  $('musicBtn').textContent = on ? '♪' : '♪̸';
  $('musicBtn').title = on ? 'Music on' : 'Music off';
  const t = $('musicToggle'); if (t) t.textContent = on ? '♪ MUSIC: ON' : '♪ MUSIC: OFF';
}
// browsers only allow sound after a tap or key press
function unlockAudio() {
  musicStart();
  try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {}
}
addEventListener('pointerdown', unlockAudio, { capture: true });
addEventListener('keydown', unlockAudio, { capture: true });

// ---------- world constants ----------
// Movement is tuned to feel steady and floaty (not twitchy), and the physics
// always step at a fixed 120 Hz so it plays the same on every device.
const T = 32, COLS = 22, WW = COLS * T;
const GRAV = 1350, JUMP = 570, RUN = 90, MAXFALL = 620, STEP = 1 / 120;
const EMPTY = 0, SOLID = 1, PLAT = 2, SPIKE = 3, CRATE = 4, BOOKS = 5, BARREL = 6,
      SPRING = 7, ICE = 8, CRUMBLE = 9, CHEST = 10;
const ONEWAY = new Set([PLAT, CRATE, BOOKS, BARREL, SPRING, ICE, CRUMBLE, CHEST]);

// The tower changes every 45 m. Each zone favours different things to jump on.
const ZONES = [
  { name: 'THE CELLAR',       hue: 24,  kinds: { plank: 3, barrel: 3, crate: 2 } },
  { name: 'THE LIBRARY',      hue: 270, kinds: { books: 4, plank: 2, crate: 1, spring: .5 } },
  { name: 'THE ARMORY',       hue: 210, kinds: { crate: 3, barrel: 2, plank: 1, crumble: 1.5 } },
  { name: 'THE FROZEN SPIRE', hue: 192, kinds: { ice: 4, plank: 1, crumble: 1.5 } },
  { name: 'THE CLOCKWORKS',   hue: 42,  kinds: { mover: 3, plank: 2, crate: 1, spring: 1 } },
  { name: 'THE SKY KEEP',     hue: 232, kinds: { spring: 2, crumble: 2, mover: 1.5, plank: 1 } },
];
const ZONE_ROWS = 45;
const zoneOf = r => Math.max(0, Math.floor(-r / ZONE_ROWS));
const zoneInfo = z => ZONES[z % ZONES.length];

const cv = $('game'), cx = cv.getContext('2d');
const lc = document.createElement('canvas'), lx = lc.getContext('2d');
let DPR = 1, SW = 0, SH = 0;

const keys = {};
const C = {
  state: 'title', mode: 1, seed: 7, hearts: 3, coins: 0, height: 0, zone: -1,
  players: [], parts: [], lavaY: 6 * T, lavaT: 4, banner: 0, bannerText: '', shake: 0, t: 0,
  touch: { L: false, R: false, J: false }, cam: { x: 0, y: 0, z: 2 }, last: 0, acc: 0, pruneT: 0,
};
const W = { rows: new Map(), ents: [], movers: [], coins: [], items: [], decor: [], crumble: new Map(), opened: new Set(), springT: new Map(), gen: null };

// ---------- screen fitting ----------
// Zoom comes from the screen's area, so every device sees about the same
// small patch of the tower around you.
function baseZoom() { return Math.max(1, Math.sqrt(SW * SH) / (11 * T)); }
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = innerWidth; SH = innerHeight;
  cv.width = lc.width = Math.round(SW * DPR);
  cv.height = lc.height = Math.round(SH * DPR);
  if (C.players.length) updateCamera(0, true);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.body.classList.toggle('coarse', matchMedia('(pointer: coarse)').matches);

// ---------- random ----------
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const hash = (x, y) => { let h = Math.imul(x, 73856093) ^ Math.imul(y, 19349663); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
function pick(weights) {
  let sum = 0; for (const k in weights) sum += weights[k];
  let x = R() * sum;
  for (const k in weights) { x -= weights[k]; if (x <= 0) return k; }
  return Object.keys(weights)[0];
}

// ---------- tiles ----------
// Rows are numbered upward as negative numbers; row 0 is the ground.
function tile(c, r) {
  if (c <= 0 || c >= COLS - 1 || r >= 0) return SOLID;
  const row = W.rows.get(r);
  return row ? row[c] : EMPTY;
}
function setTile(c, r, v) {
  let row = W.rows.get(r);
  if (!row) { row = new Uint8Array(COLS); W.rows.set(r, row); }
  row[c] = v;
}

// ---------- endless generation ----------
// One guaranteed route winds upward forever. Every step is placed within
// reach of the last one; decoy ledges and items branch off it in the dark.
function genInit(seed) {
  W.rows = new Map(); W.ents = []; W.movers = []; W.coins = []; W.items = []; W.decor = [];
  W.crumble = new Map(); W.opened = new Set(); W.springT = new Map();
  W.gen = { rng: mulberry(seed), prev: { a: 1, b: COLS - 2, r: 0 }, dir: 1, count: 0 };
  genUpTo(-60);
}
function genUpTo(target) {
  R = W.gen.rng;
  while (W.gen.prev.r > target) genStep();
  R = Math.random;
}

const LEN = { plank: [3, 5], crate: [2, 4], books: [2, 3], barrel: [2, 3], ice: [3, 5], crumble: [2, 4], spring: [1, 1], mover: [5, 8] };
const TILE_OF = { plank: PLAT, crate: CRATE, books: BOOKS, barrel: BARREL, ice: ICE, crumble: CRUMBLE, spring: SPRING };

function freeSpan(r, a, b, pad) {
  for (let x = a - pad; x <= b + pad; x++) if (x > 0 && x < COLS - 1 && tile(x, r) !== EMPTY) return false;
  return !W.movers.some(m => m.r === r && a - pad <= m.maxX / T && b + pad >= m.minX / T);
}

function genStep() {
  const G = W.gen, prev = G.prev;
  const height = -prev.r, d = Math.min(1, height / 500);
  const z = zoneOf(prev.r), zi = zoneInfo(z);
  const step = prev.spring ? ri(5, 7) : (R() < .15 + d * .3 && height > 20 ? 4 : 3);
  const r = prev.r - step;

  let kind;
  if (G.count < 6) kind = R() < .5 ? 'plank' : 'crate';
  else {
    const w = Object.assign({}, zi.kinds);
    if (z >= ZONES.length) for (const k in LEN) w[k] = (w[k] || 0) + .6;  // later laps mix everything
    if (height > 40) { w.crumble = (w.crumble || 0) + d; w.spring = (w.spring || 0) + .3; }
    kind = pick(w);
  }
  const [l0, l1] = LEN[kind], len = ri(l0, l1);

  // find a spot within reach of the previous step, drifting in one direction
  let a = -1;
  for (let pass = 0; pass < 2 && a < 0; pass++) {
    for (let t = 0; t < 120; t++) {
      const c = ri(1, COLS - 1 - len), b = c + len - 1;
      const gap = Math.max(c - prev.b - 1, prev.a - b - 1);
      const shift = (c + b) / 2 - (prev.a + prev.b) / 2;
      if (gap <= 1 && (prev.r === 0 || (Math.abs(shift) >= 2 && Math.sign(shift) === G.dir))) { a = c; break; }
    }
    if (a < 0) G.dir = -G.dir;
  }
  if (a < 0) a = clamp(prev.a, 1, COLS - 1 - len);
  const b = a + len - 1;

  if (kind === 'mover') {
    const w = ri(2, 3) * T;
    W.movers.push({ k: 'mover', r, x: a * T, y: r * T, w, minX: a * T, maxX: (b + 1) * T,
                    vx: (R() < .5 ? -1 : 1) * (30 + d * 30), dx: 0 });
  } else {
    for (let c = a; c <= b; c++) setTile(c, r, TILE_OF[kind]);
    // mixed piles: a crate row might hide a barrel, books or a treasure chest
    if ((kind === 'crate' || kind === 'barrel' || kind === 'books') && len >= 2) {
      const c = ri(a, b), roll = R();
      if (roll < .12) setTile(c, r, CHEST);
      else if (roll < .4) setTile(c, r, [CRATE, BARREL, BOOKS][ri(0, 2)]);
    }
  }
  G.prev = { a, b, r, spring: kind === 'spring' };
  G.count++;
  if (R() < .3) G.dir = -G.dir;
  if (a <= 3) G.dir = 1;
  if (b >= COLS - 4) G.dir = -1;

  // coin or power-up over the main route
  if (kind !== 'spring' && kind !== 'mover' && R() < .6) W.coins.push({ x: ((a + b + 1) / 2) * T, y: (r - 1) * T + 14 });
  if (G.count > 4 && R() < .09) W.items.push(makeItem((a + b + 1) / 2 * T, (r - 2) * T + 16));

  // slimes patrol wider platforms once you're past the start
  if (height > 25 && kind !== 'spring' && kind !== 'mover' && len >= 3 && R() < .15 + d * .3) W.ents.push(slime(a * T, (b + 1) * T, r * T, d));

  // decoy ledges and loose items in the same row
  const n = ri(1, 2);
  for (let k = 0; k < n; k++) {
    const dk = pick({ plank: 2, crate: 2, books: 1, barrel: 1.5, ice: zi.kinds.ice ? 2 : .3, spring: .25, crumble: .5 });
    const dl = dk === 'spring' ? 1 : ri(1, 3);
    for (let t = 0; t < 30; t++) {
      const c = ri(1, COLS - 1 - dl), e = c + dl - 1;
      if (!freeSpan(r, c, e, 2)) continue;
      for (let x = c; x <= e; x++) setTile(x, r, TILE_OF[dk]);
      if (dk !== 'spring' && dl >= 2 && R() < .12) setTile(ri(c, e), r, CHEST);
      if (dk !== 'spring' && height > 15 && R() < .18 + d * .3) setTile(ri(c, e), r - 1, SPIKE);
      else if (R() < .45) W.coins.push({ x: (c + e + 1) / 2 * T, y: (r - 1) * T + 14 });
      else if (G.count > 4 && R() < .12) W.items.push(makeItem((c + e + 1) / 2 * T, (r - 1) * T + 12));
      break;
    }
  }

  // bats sweep the open air higher up
  if (height > 35 && R() < .1 + d * .3) {
    const y0 = (r + 1) * T + 8;
    W.ents.push({ k: 'bat', x: ri(2, COLS - 3) * T, y: y0, y0, w: 20, h: 12, vx: (R() < .5 ? -1 : 1) * (45 + d * 45), t: R() * 6, amp: ri(10, 24) });
  }
  if (R() < .35) W.coins.push({ x: ri(2, COLS - 3) * T + 16, y: (r + 1) * T + 16 });

  // wall decorations (torches light up the dark)
  for (let rr = prev.r - 1; rr > r; rr--) {
    if (R() < .16) W.decor.push({ k: 'torch', c: ri(2, COLS - 3), r: rr });
    else if (R() < .05) W.decor.push({ k: 'window', c: ri(2, COLS - 3), r: rr });
  }
}

function slime(minX, maxX, topY, d) {
  return { k: 'slime', x: (minX + maxX) / 2 - 11, y: topY - 16, w: 22, h: 16, vx: (R() < .5 ? -1 : 1) * (28 + d * 25), minX, maxX, t: R() * 6 };
}
function makeItem(x, y) {
  const k = pick({ feather: 3, shield: 3, magnet: 2.5, rocket: 2, heart: 1.2 });
  return { k, x, y, t: R() * 6 };
}

// ---------- you ----------
const GIM_COLORS = ['#ff5d6c', '#ff9f2e', '#ffd23b', '#3ed67a', '#2ec7e8', '#5b7cff', '#a96bff', '#ff73c6'];
const ME = { name: String(store.get('name', '') || '').slice(0, 12), col: clamp(store.get('col', 1) | 0, 0, GIM_COLORS.length - 1) };

function makePlayer() {
  return { x: 0, y: 0, w: 20, h: 26, vx: 0, vy: 0, onGround: false, groundTile: 0, ride: null,
           coyote: 0, jumpBuf: 0, jPrev: false, jumpCut: false, dropT: 0, airJumps: 1, flip: 0, face: 1,
           inv: 0, walk: 0, feather: 0, magnet: 0, shield: false };
}

function startGame(seed) {
  C.seed = seed || 1 + Math.floor(Math.random() * 1e9);
  genInit(C.seed);
  C.hearts = 3; C.coins = 0; C.height = 0; C.zone = -1; C.parts = [];
  C.lavaY = 6 * T; C.lavaT = 4; C.acc = 0;
  const p = makePlayer();
  p.x = (COLS / 2) * T - p.w / 2; p.y = -p.h; p.inv = 1;
  C.players = [p];
  updateCamera(0, true);
  setState('play');
  if (NET.r) NET.r.presence({ st: 'play', round: NET.myRound, x: Math.round(p.x), y: Math.round(p.y), f: 1, h: 0 }).catch(() => {});
}

// ---------- live games with a code ----------
// Everyone who joins the same code shares a room: the host's presence carries
// the round's seed (so everybody climbs the same tower) and each player's
// presence carries where they are. Nothing else is sent.
const NET = { room: null, r: null, code: '', host: false, myRound: 0, list: [], ghosts: new Map(), lastSend: 0, msg: '' };

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const room = await window.claude.use('room');
    if (room) { NET.room = room; if (C.state === 'title') setState('title'); }
  } catch (e) {}
})();

function cleanPeer(p) {
  const s = p.presence || {}, num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  return {
    peer: p.peer, me: p.sameTab,
    nm: (typeof s.nm === 'string' ? s.nm : '').slice(0, 12) || 'Player',
    col: clamp(num(s.col) | 0, 0, GIM_COLORS.length - 1),
    st: ['lobby', 'play', 'over'].includes(s.st) ? s.st : 'lobby',
    host: s.host === true, round: num(s.round) | 0, seed: num(s.seed) | 0,
    x: num(s.x), y: num(s.y), f: s.f === -1 ? -1 : 1, h: Math.max(0, num(s.h) | 0),
  };
}
const hostOf = () => NET.list.find(p => p.host && !p.me);

function onRoomPeers(peers) {
  NET.list = peers.map(cleanPeer);
  // keep smoothed positions for everyone else
  const seen = new Set();
  for (const p of NET.list) {
    if (p.me) continue;
    seen.add(p.peer);
    const g = NET.ghosts.get(p.peer);
    if (!g) NET.ghosts.set(p.peer, { rx: p.x, ry: p.y, walk: 0 });
  }
  for (const k of NET.ghosts.keys()) if (!seen.has(k)) NET.ghosts.delete(k);

  // players follow the host into each new round
  const h = hostOf();
  if (!NET.host && h && h.st === 'play' && h.round > NET.myRound && h.seed && C.state !== 'play' && C.state !== 'pause') {
    NET.myRound = h.round;
    countdownStart(h.seed);
  }
  renderPlayerList();
}

let countdownTimer = 0;
function countdownStart(seed) {
  clearTimeout(countdownTimer);
  setState('countdown');
  countdownTimer = setTimeout(() => { if (C.state === 'countdown') startGame(seed); }, 2000);
}

function newCode() { return String(100000 + Math.floor(Math.random() * 900000)); }

async function enterRoom(code, asHost) {
  NET.msg = asHost ? 'Opening a game…' : 'Joining game ' + code + '…';
  setState('lobby');
  try {
    const r = await NET.room.join('jx-' + code);
    NET.r = r; NET.code = code; NET.host = asHost; NET.myRound = 0; NET.msg = '';
    r.onPeers(ch => onRoomPeers(ch.peers), () => { NET.msg = 'Lost connection to the game.'; renderPlayerList(); });
    await r.presence({ nm: ME.name || 'Player', col: ME.col, st: 'lobby', host: asHost || null, round: 0, seed: null });
    setState('lobby');
    if (!asHost) setTimeout(() => { if (NET.r === r && !hostOf() && C.state === 'lobby') { NET.msg = 'No host has opened code ' + code + ' yet. Check the code, or wait here.'; renderPlayerList(); } }, 5000);
  } catch (e) {
    NET.r = null; NET.msg = 'Could not open a game right now. Try again in a moment.';
    setState('title');
  }
}

function leaveRoom() {
  if (NET.r) NET.r.leave().catch(() => {});
  NET.r = null; NET.code = ''; NET.host = false; NET.list = []; NET.ghosts.clear(); NET.myRound = 0;
}

function hostStartRound() {
  if (!NET.r || !NET.host) return;
  NET.myRound++;
  const seed = 1 + Math.floor(Math.random() * 1e9);
  NET.r.presence({ st: 'play', round: NET.myRound, seed }).catch(() => {});
  countdownStart(seed);
}

function sendPresence() {
  if (!NET.r || C.state !== 'play' || !C.players.length) return;
  const t = now();
  if (t - NET.lastSend < 70) return;
  NET.lastSend = t;
  const p = C.players[0];
  NET.r.presence({ st: 'play', x: Math.round(p.x), y: Math.round(p.y), f: p.face, h: C.height }).catch(() => {});
}

function renderPlayerList() {
  const el = $('plist');
  if (el) {
    const rows = NET.list.slice().sort((a, b) => (C.state === 'lobby' ? 0 : b.h - a.h) || (b.host - a.host));
    el.replaceChildren(...rows.map(p => {
      const li = document.createElement('li');
      const dot = document.createElement('i'); dot.style.background = GIM_COLORS[p.col];
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.nm + (p.me ? ' (you)' : '');
      const tag = document.createElement('span'); tag.className = 'tag';
      tag.textContent = C.state === 'lobby' ? (p.host ? 'HOST' : '') : (p.round === NET.myRound ? p.h + ' m' + (p.st === 'play' ? ' ▲' : '') : '—');
      li.append(dot, nm, tag);
      return li;
    }));
  }
  const m = $('netMsg'); if (m) m.textContent = NET.msg;
  const n = $('pcount'); if (n) n.textContent = NET.list.length + (NET.list.length === 1 ? ' player' : ' players');
}

function renderBoard() {
  const el = $('board');
  if (!NET.r || C.state !== 'play') { el.hidden = true; return; }
  el.hidden = false;
  const rows = NET.list.filter(p => p.round === NET.myRound).sort((a, b) => b.h - a.h).slice(0, 5);
  el.replaceChildren(...rows.map((p, i) => {
    const li = document.createElement('li');
    if (p.me) li.className = 'me';
    const dot = document.createElement('i'); dot.style.background = GIM_COLORS[p.col];
    const nm = document.createElement('span'); nm.textContent = (i + 1) + '. ' + p.nm;
    const h = document.createElement('b'); h.textContent = (p.me ? C.height : p.h) + 'm';
    li.append(dot, nm, h);
    return li;
  }));
}

// ---------- screens ----------

  document.body.classList.toggle('playing', s === 'play');
  $('hud').hidden = s === 'title' || s === 'lobby';
  renderBoard();
  if (s === 'play') { $('overlay').hidden = true; return; }
  $('overlay').hidden = false;
  const card = $('card');
  if (s === 'title') {
    const best = store.get('bestH', 0);
    card.innerHTML = `
      <h1 class="logo">JUMPER <span>X</span></h1>
      <p>A dark tower that never ends. Hop across crates, barrels and books, and stay ahead of the lava.</p>
      <div class="you">
        <canvas id="gimPreview" width="96" height="96" aria-hidden="true"></canvas>
        <div class="you-fields">
          <label for="nameIn">Your name</label>

          <div class="swatches" id="swatches"></div>

      </div>

        <button class="big alt" id="hostBtn">HOST A GAME</button>

        </form>
        <p class="note" id="netNote"></p>
      </div>
      <details class="how"><summary>How to play</summary>
        <div class="keys"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> move · <kbd>↑</kbd> <kbd>W</kbd> <kbd>Space</kbd> jump · jump again in the air to double jump · <kbd>↓</kbd> drop down</div>
        <div class="legend">
          <span>🔴 <b>Spring</b> bounces you high</span>
          <span>🧊 <b>Ice</b> is slippery</span>
          <span>🪨 <b>Cracked slabs</b> fall</span>
          <span>🧰 <b>Chests</b> pay coins</span>
          <span>🪶 <b>Feather</b> triple jump</span>
          <span>🛡️ <b>Shield</b> blocks a hit</span>

        </div>
      </details>
      <button class="chip" id="musicToggle"></button>
      <div class="best">${best ? 'BEST: ' + best + ' m' : '&nbsp;'}</div>`;
    $('musicToggle').onclick = () => setMusic(!MUSIC.on);
    renderMusicUI();
    const nameIn = $('nameIn');
    nameIn.value = ME.name;
    nameIn.oninput = () => { ME.name = nameIn.value.slice(0, 12); store.set('name', ME.name); };
    const sw = $('swatches');
    GIM_COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'sw' + (i === ME.col ? ' on' : ''); b.style.background = c; b.setAttribute('aria-label', 'Colour ' + (i + 1));
      b.onclick = () => { ME.col = i; store.set('col', i); sw.querySelectorAll('.sw').forEach((x, j) => x.classList.toggle('on', j === i)); drawPreview(); };
      sw.appendChild(b);
    });
    drawPreview();
    $('playBtn').onclick = () => { leaveRoom(); goFullscreen(); startGame(); };
    const note = $('netNote');
    if (!NET.room) {
      $('hostBtn').disabled = true; $('joinBtn').disabled = true; $('codeIn').disabled = true;
      note.textContent = 'Live games with a code work in the published game. Share it with friends from the Share menu so they can join.';
    } else note.textContent = NET.msg;
    $('hostBtn').onclick = () => { if (NET.room) { leaveRoom(); enterRoom(newCode(), true); } };
    $('joinForm').onsubmit = e => {
      e.preventDefault();
      const code = $('codeIn').value.replace(/\D/g, '');
      if (code.length !== 6) { note.textContent = 'Game codes are 6 digits.'; return; }
      if (NET.room) { leaveRoom(); enterRoom(code, false); }
    };
  } else if (s === 'lobby') {
    const h = hostOf();
    card.innerHTML = `
      <div class="codebox"><span>GAME CODE</span><b id="codeShow"></b></div>
      <p>${NET.host ? 'Send this code to your friends. They open Jumper X, tap JOIN and type it in.' : 'You’re in! Everyone climbs the same tower. Highest climber wins.'}</p>

    if (isBest) store.set('bestH', C.height);
    if (NET.r) {
      NET.r.presence({ st: 'over', h: C.height }).catch(() => {});
      card.innerHTML = `<h2>GAME OVER</h2>
        <p>You climbed <b>${C.height} m</b>${isBest ? ', your best yet!' : '.'}</p>
        <div class="plist-head"><span>Round ${NET.myRound} · code ${NET.code}</span></div>

        <p class="note" id="netMsg"></p>
        ${NET.host ? '<button class="big" id="againBtn">NEXT ROUND</button>' : '<p class="wait">The host starts the next round.</p>'}
        <button class="big alt" id="leaveBtn">LEAVE GAME</button>`;
      if (NET.host) $('againBtn').onclick = () => hostStartRound();
      $('leaveBtn').onclick = () => { leaveRoom(); showAttract(); setState('title'); };
      renderPlayerList();
    } else {
      card.innerHTML = `<h2>GAME OVER</h2>
        <p>You climbed <b>${C.height} m</b>${isBest ? ', a new best!' : '.'}<br>${C.coins} coins collected.</p>
        <button class="big" id="againBtn">PLAY AGAIN</button>
        <button class="big alt" id="titleBtn">TITLE SCREEN</button>`;
      $('againBtn').onclick = () => { goFullscreen(); startGame(); };
      $('titleBtn').onclick = () => { showAttract(); setState('title'); };
    }
  }
  const first = card.querySelector('.big:not([disabled])');
  if (first && s !== 'title' && !document.body.classList.contains('coarse')) first.focus();
}

function drawPreview() {
  const c = $('gimPreview'); if (!c) return;
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
  g.setTransform(2.6, 0, 0, 2.6, 48 - 10 * 2.6, 84 - 26 * 2.6);
  drawGim(g, 0, 0, GIM_COLORS[ME.col], 1, { blink: false });
}

// Title screen: the camera drifts up an empty tower
function showAttract() {
  C.players = []; C.parts = []; C.lavaY = 6 * T;
  genInit(7);
  C.cam.z = baseZoom(); C.cam.x = Math.max(0, (WW - SW / C.cam.z) / 2); C.cam.y = T * 2 - SH / C.cam.z;
}

// ---------- full screen ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function goFullscreen() {
  if (fsEl()) return;
  const el = document.documentElement;
  try { const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
function exitFullscreen() {
  if (!fsEl()) return;
  try { const r = (document.exitFullscreen || document.webkitExitFullscreen)?.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
$('fsBtn').onclick = () => { fsEl() ? exitFullscreen() : goFullscreen(); };
$('pauseBtn').onclick = () => { if (C.state === 'play') setState('pause'); };
$('musicBtn').onclick = () => setMusic(!MUSIC.on);

// ---------- input ----------
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;  // typing a name or code
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (C.state === 'play') setState('pause'); else if (C.state === 'pause') { C.last = now(); setState('play'); }
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (C.state === 'play') setState('pause'); });

document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const set = v => e => { e.preventDefault(); C.touch[k] = v; b.classList.toggle('on', v); };
  b.addEventListener('pointerdown', set(true));
  b.addEventListener('pointerup', set(false));
  b.addEventListener('pointercancel', set(false));
  b.addEventListener('pointerleave', set(false));
});

function readInput() {
  const k = keys, t = C.touch;
  return { l: k.ArrowLeft || k.KeyA || t.L, r: k.ArrowRight || k.KeyD || t.R,
           j: k.ArrowUp || k.KeyW || k.Space || t.J, d: k.ArrowDown || k.KeyS };
}

// ---------- physics ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function moveX(p, dx) {
  p.x += dx;
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T);
  if (dx > 0) {
    const c = Math.floor((p.x + p.w - .01) / T);
    for (let r = r0; r <= r1; r++) if (tile(c, r) === SOLID) { p.x = c * T - p.w; p.vx = 0; return; }
  } else if (dx < 0) {
    const c = Math.floor(p.x / T);
    for (let r = r0; r <= r1; r++) if (tile(c, r) === SOLID) { p.x = (c + 1) * T; p.vx = 0; return; }
  }
}
function moveY(p, dy) {
  const prevBottom = p.y + p.h;
  p.y += dy; p.onGround = false; p.ride = null;
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T);
  if (dy > 0) {
    const r = Math.floor((p.y + p.h - .01) / T);
    for (let c = c0; c <= c1; c++) {
      const t = tile(c, r);
      if (t === SOLID || (ONEWAY.has(t) && p.dropT <= 0 && prevBottom <= r * T + .5)) {
        p.y = r * T - p.h; p.vy = 0; p.onGround = true; land(p, t, c, r); return;
      }
    }
    if (p.dropT <= 0) for (const m of W.movers) {
      if (prevBottom <= m.y + .5 && p.y + p.h >= m.y && p.x + p.w > m.x && p.x < m.x + m.w) {
        p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.ride = m; p.groundTile = PLAT; return;
      }
    }
  } else if (dy < 0) {
    const r = Math.floor(p.y / T);
    for (let c = c0; c <= c1; c++) if (tile(c, r) === SOLID) { p.y = (r + 1) * T; p.vy = 0; return; }
  }
}

function land(p, t, c, r) {
  p.groundTile = t;
  const key = c + ',' + r;
  if (t === SPRING) {
    p.vy = -JUMP * 1.65; p.onGround = false; p.jumpCut = true; p.airJumps = maxAir(p);
    W.springT.set(key, .25); sfx.boing();
  } else if (t === CRUMBLE && !W.crumble.has(key)) {
    W.crumble.set(key, { c, r, t: .55, back: 0 }); sfx.crack();
  } else if (t === CHEST && !W.opened.has(key)) {
    W.opened.add(key); C.coins += 5; sfx.chest();
    for (let i = 0; i < 6; i++) burst(c * T + 16, r * T - 4, '#ffd93b', 3, 120);
  }
}

const maxAir = p => p.feather > 0 ? 2 : 1;

function burst(x, y, col, n = 14, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (.3 + Math.random());
    C.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: .5 + Math.random() * .4, col, size: 3 + Math.random() * 3 });
  }
}

function hurt(p, lava) {
  if (p.inv > 0) { if (lava) { p.vy = -JUMP * 1.3; p.jumpCut = true; } return; }
  if (p.shield) {
    p.shield = false; p.inv = 1.2; sfx.shield(); burst(p.x + p.w / 2, p.y + p.h / 2, '#7fd8ff', 16, 180);
    if (lava) { p.vy = -JUMP * 1.4; p.jumpCut = true; C.lavaY += 3 * T; }
    return;
  }
  C.hearts--; p.inv = 1.6; C.shake = .3; sfx.hurt();
  burst(p.x + p.w / 2, p.y + p.h / 2, GIM_COLORS[ME.col], 16, 180);
  p.vy = lava ? -JUMP * 1.4 : -JUMP * .6; p.jumpCut = true;
  if (lava) C.lavaY += 4 * T;
  if (C.hearts <= 0) { sfx.over(); setState('over'); }
}

function updatePlayer(p, dt) {
  const inp = readInput();
  const dirX = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  const ice = p.onGround && p.groundTile === ICE;
  const acc = p.onGround ? (ice ? 200 : (dirX ? 700 : 1000)) : (dirX ? 520 : 240);
  p.vx += clamp(dirX * RUN - p.vx, -acc * dt, acc * dt);
  if (dirX) p.face = dirX;

  const jNew = inp.j && !p.jPrev; p.jPrev = !!inp.j;
  p.jumpBuf = jNew ? .12 : p.jumpBuf - dt;
  p.coyote = p.onGround ? .1 : p.coyote - dt;
  p.dropT -= dt;
  if (inp.d && p.onGround) p.dropT = .2;
  if (p.onGround) p.airJumps = maxAir(p);
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.jumpBuf = 0; p.coyote = 0; p.jumpCut = false; sfx.jump();
    burst(p.x + p.w / 2, p.y + p.h, '#ffffff88', 5, 50);
  } else if (jNew && p.airJumps > 0 && !p.onGround) {
    p.vy = -JUMP * .88; p.airJumps--; p.jumpBuf = 0; p.jumpCut = false; p.flip = .35; sfx.jump2();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      C.parts.push({ x: p.x + p.w / 2, y: p.y + p.h, vx: Math.cos(a) * 80, vy: Math.sin(a) * 25 + 30, life: .35, col: p.feather > 0 ? '#7fd8ffcc' : '#ffffffcc', size: 3 });
    }
  }
  if (p.flip > 0) p.flip -= dt;
  if (!inp.j && p.vy < 0 && !p.jumpCut) { p.vy *= .55; p.jumpCut = true; }
  p.vy = Math.min(p.vy + GRAV * dt, MAXFALL);

  if (p.onGround && p.ride) moveX(p, p.ride.dx);
  moveX(p, p.vx * dt);
  moveY(p, p.vy * dt);
  p.walk = p.onGround && Math.abs(p.vx) > 15 ? p.walk + dt * 10 : 0;
  if (p.inv > 0) p.inv -= dt;
  if (p.feather > 0) p.feather -= dt;
  if (p.magnet > 0) p.magnet -= dt;

  // spikes
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T);
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (tile(c, r) === SPIKE && overlap(p, { x: c * T + 5, y: r * T + 18, w: 22, h: 14 })) hurt(p);
  }
  if (C.state !== 'play') return;
  if (p.y + p.h > C.lavaY + 4) { hurt(p, true); if (C.state !== 'play') return; }

  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  for (const co of W.coins) {
    if (co.got) continue;
    if (p.magnet > 0) {
      const dx = pcx - co.x, dy = pcy - co.y, dist = Math.hypot(dx, dy);
      if (dist < 6 * T) { co.x += dx / dist * 260 * dt; co.y += dy / dist * 260 * dt; }
    }
    if (Math.abs(co.x - pcx) < 18 && Math.abs(co.y - pcy) < 20) {
      co.got = true; C.coins++; sfx.coin(); burst(co.x, co.y, '#ffd93b', 8, 80);
    }
  }
  for (const it of W.items) {
    if (it.got || Math.abs(it.x - pcx) > 22 || Math.abs(it.y - pcy) > 24) continue;
    it.got = true; sfx.power(); burst(it.x, it.y, '#ffffff', 16, 140);
    if (it.k === 'feather') { p.feather = 15; p.airJumps = 2; }
    else if (it.k === 'shield') p.shield = true;
    else if (it.k === 'magnet') p.magnet = 12;
    else if (it.k === 'heart') C.hearts = Math.min(5, C.hearts + 1);
    else if (it.k === 'rocket') { p.vy = -JUMP * 2; p.jumpCut = true; p.inv = Math.max(p.inv, 1); p.airJumps = maxAir(p); }
  }
  for (const e of W.ents) {
    if (e.dead || !overlap(p, e)) continue;
    if (p.vy > 40 && p.y + p.h - e.y < 14) {
      e.dead = true; p.vy = -JUMP * .7; p.jumpCut = true; p.airJumps = maxAir(p); C.coins++;
      sfx.stomp(); burst(e.x + e.w / 2, e.y + e.h / 2, e.k === 'bat' ? '#a46bff' : '#6be04f', 14);
    } else hurt(p);
    if (C.state !== 'play') return;
  }
}

function update(dt) {
  C.t += dt;
  if (C.banner > 0) C.banner -= dt;
  if (C.shake > 0) C.shake -= dt;

  // climb tracking, zone banners and more tower above
  let top = Infinity, low = -Infinity;
  for (const p of C.players) { top = Math.min(top, p.y + p.h); low = Math.max(low, p.y + p.h); }
  C.height = Math.max(C.height, Math.floor(-top / T));
  const z = zoneOf(Math.floor(top / T));
  if (z !== C.zone) { C.zone = z; C.bannerText = zoneInfo(z).name; C.banner = 2.4; }
  genUpTo(Math.floor(top / T) - 45);

  // lava: speeds up with height, and catches up if you get far ahead of it
  if (C.lavaT > 0) C.lavaT -= dt;
  else {
    const d = Math.min(1, C.height / 500);
    let speed = 16 + d * 30;
    const gap = C.lavaY - low;
    if (gap > 14 * T) speed += (gap - 14 * T) * .8;
    C.lavaY -= speed * dt;
  }

  for (const m of W.movers) {
    m.dx = m.vx * dt; m.x += m.dx;
    if (m.x < m.minX) { m.x = m.minX; m.vx = Math.abs(m.vx); }
    if (m.x + m.w > m.maxX) { m.x = m.maxX - m.w; m.vx = -Math.abs(m.vx); }
  }
  for (const e of W.ents) {
    if (e.dead) continue;
    e.t += dt;
    if (e.k === 'slime') {
      e.x += e.vx * dt;
      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
    } else {
      e.x += e.vx * dt;
      if (e.x < T || e.x + e.w > WW - T) { e.vx *= -1; e.x = clamp(e.x, T, WW - T - e.w); }
      e.y = e.y0 + Math.sin(e.t * 2.5) * e.amp;
    }
    if (e.y > C.lavaY) e.dead = true;
  }
  for (const [key, cr] of W.crumble) {
    if (cr.t > 0) { cr.t -= dt; if (cr.t <= 0) { setTile(cr.c, cr.r, EMPTY); cr.back = 5; burst(cr.c * T + 16, cr.r * T + 8, '#8a8299', 10, 90); } }
    else if ((cr.back -= dt) <= 0) { setTile(cr.c, cr.r, CRUMBLE); W.crumble.delete(key); }
  }
  for (const [key, v] of W.springT) { if (v - dt <= 0) W.springT.delete(key); else W.springT.set(key, v - dt); }
  for (const it of W.items) it.t += dt;

  for (const p of C.players) { updatePlayer(p, dt); if (C.state !== 'play') return; }

  for (const q of C.parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; }
  if (C.parts.length) C.parts = C.parts.filter(q => q.life > 0);

  // forget everything the lava has swallowed
  if ((C.pruneT -= dt) <= 0) {
    C.pruneT = 1;
    const cut = C.lavaY + 8 * T;
    for (const r of W.rows.keys()) if (r * T > cut) W.rows.delete(r);
    W.ents = W.ents.filter(e => !e.dead && e.y < cut);
    W.movers = W.movers.filter(m => m.y < cut);
    W.coins = W.coins.filter(c => !c.got && c.y < cut);
    W.items = W.items.filter(i => !i.got && i.y < cut);
    W.decor = W.decor.filter(d => d.r * T < cut);
  }
}

// ---------- camera ----------
function updateCamera(dt, snap) {
  const cam = C.cam, ps = C.players;
  if (!ps.length) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of ps) {
    x0 = Math.min(x0, p.x + p.w / 2); x1 = Math.max(x1, p.x + p.w / 2);
    y0 = Math.min(y0, p.y + p.h / 2); y1 = Math.max(y1, p.y + p.h / 2);
  }
  const base = baseZoom();
  const z = Math.max(base * .5, Math.min(base, SW / (x1 - x0 + 8 * T), SH / (y1 - y0 + 8 * T)));
  cam.z = snap ? z : cam.z + (z - cam.z) * Math.min(1, dt * 3);
  const vw = SW / cam.z, vh = SH / cam.z;
  let tx = (x0 + x1) / 2 - vw / 2, ty = (y0 + y1) / 2 - vh * .58;
  tx = vw >= WW ? (WW - vw) / 2 : clamp(tx, 0, WW - vw);
  // on touch screens let the camera sink below the floor so the buttons don't cover you
  const padB = document.body.classList.contains('coarse') ? 130 / cam.z : 0;
  ty = Math.min(ty, 2 * T - vh + padB);
  if (snap) { cam.x = tx; cam.y = ty; }
  else { const k = Math.min(1, dt * 6); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; }
}

// ---------- drawing (world space) ----------
const shadeCache = new Map();
function shades(hue) {
  let s = shadeCache.get(hue);
  if (!s) { s = [0, 1, 2, 3, 4].map(i => `hsl(${hue},20%,${16 + i * 1.6}%)`); shadeCache.set(hue, s); }
  return s;
}
function drawBricks(ox, oy, vw, vh) {
  const by0 = Math.floor(oy / 16), by1 = Math.ceil((oy + vh) / 16);
  for (let by = by0; by <= by1; by++) {
    const off = (by & 1) * 16, hue = zoneInfo(zoneOf(Math.floor(by / 2))).hue, sh = shades(hue);
    cx.fillStyle = `hsl(${hue},20%,11%)`; cx.fillRect(Math.max(0, ox), by * 16, Math.min(WW, vw + 32), 16);
    const bx0 = Math.floor((ox - off) / 32), bx1 = Math.ceil((ox + vw - off) / 32);
    for (let bx = bx0; bx <= bx1; bx++) {
      cx.fillStyle = sh[Math.floor(hash(bx, by) * 5)];
      cx.fillRect(bx * 32 + off + 1, by * 16 + 1, 30, 14);
    }
  }
}

function drawDecor(d) {
  const x = d.c * T, y = d.r * T;
  if (d.k === 'window') {
    cx.fillStyle = '#05020c';
    cx.beginPath(); cx.moveTo(x + 4, y + 70); cx.lineTo(x + 4, y + 14); cx.arc(x + 16, y + 14, 12, Math.PI, 0); cx.lineTo(x + 28, y + 70); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i < 4; i++) cx.fillRect(x + 8 + hash(d.c, d.r + i) * 16, y + 10 + hash(d.r, d.c + i) * 50, 1.5, 1.5);
  } else {
    const tx = x + 14, ty = y + 10, fl = Math.sin(C.t * 15 + d.c + d.r) * 2;
    cx.fillStyle = '#4a2c12'; cx.fillRect(tx, ty + 8, 4, 12);
    cx.fillStyle = 'rgba(255,170,60,.14)'; cx.beginPath(); cx.arc(tx + 2, ty + 4, 30 + fl, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#ff7a1a'; cx.fillRect(tx - 2, ty - 2 + fl / 2, 8, 10);
    cx.fillStyle = '#ffd93b'; cx.fillRect(tx, ty + 2, 4, 6);
  }
}

function drawTile(t, c, r) {
  const x = c * T, y = r * T;
  switch (t) {
    case SOLID: {
      const hue = r >= 0 ? 260 : zoneInfo(zoneOf(r)).hue;
      cx.fillStyle = `hsl(${hue},14%,20%)`; cx.fillRect(x, y, T, T);
      cx.fillStyle = `hsl(${hue},14%,30%)`; cx.fillRect(x + 2, y + 2, T - 4, T - 4);
      cx.fillStyle = `hsl(${hue},14%,38%)`; cx.fillRect(x + 2, y + 2, T - 4, 4);
      cx.fillStyle = `hsl(${hue},14%,22%)`; cx.fillRect(x + 2, y + T - 6, T - 4, 4);
      break;
    }
    case PLAT: {
      cx.fillStyle = '#5a3415'; cx.fillRect(x, y, T, 12);
      cx.fillStyle = '#9b5d2a'; cx.fillRect(x, y, T, 9);
      cx.fillStyle = '#c47e3e'; cx.fillRect(x, y, T, 3);
      cx.fillStyle = '#5a3415'; cx.fillRect(x + 15, y + 1, 2, 8);
      if (tile(c - 1, r) !== PLAT || tile(c + 1, r) !== PLAT) {
        cx.fillStyle = '#3d2410'; cx.fillRect(tile(c - 1, r) !== PLAT ? x + 4 : x + T - 8, y + 12, 4, 10);
      }
      break;
    }
    case CRATE: {
      cx.fillStyle = '#5e3a17'; cx.fillRect(x + 1, y, T - 2, T);
      cx.fillStyle = '#b07a3c'; cx.fillRect(x + 3, y + 2, T - 6, T - 4);
      cx.fillStyle = '#7d5226';
      cx.fillRect(x + 3, y + 2, T - 6, 4); cx.fillRect(x + 3, y + T - 6, T - 6, 4);
      cx.save(); cx.beginPath(); cx.rect(x + 3, y + 6, T - 6, T - 12); cx.clip();
      cx.strokeStyle = '#7d5226'; cx.lineWidth = 4;
      cx.beginPath(); cx.moveTo(x + 3, y + 6); cx.lineTo(x + T - 3, y + T - 6); cx.stroke();
      cx.restore();
      cx.fillStyle = '#d9a35f'; cx.fillRect(x + 3, y + 2, T - 6, 1);
      break;
    }
    case BOOKS: {
      const cols = ['#c0392b', '#2e86de', '#27ae60', '#8e44ad', '#e67e22', '#16a085'];
      for (let i = 0; i < 4; i++) {
        const hgt = 8, inset = Math.floor(hash(c, r * 4 + i) * 6);
        cx.fillStyle = cols[Math.floor(hash(r, c * 4 + i) * cols.length)];
        cx.fillRect(x + inset, y + i * hgt, T - inset - Math.floor(hash(c + i, r) * 5), hgt - 1);
        cx.fillStyle = 'rgba(255,240,200,.75)'; cx.fillRect(x + inset + 2, y + i * hgt + 3, T - inset - 10, 1);
      }
      break;
    }
    case BARREL: {
      cx.fillStyle = '#4a2a10'; cx.fillRect(x + 4, y, T - 8, T);
      cx.fillStyle = '#8b5a2b'; cx.fillRect(x + 2, y + 4, T - 4, T - 8);
      cx.fillStyle = '#a86f38'; cx.fillRect(x + 6, y + 2, T - 12, T - 4);
      cx.fillStyle = '#5f6670'; cx.fillRect(x + 2, y + 7, T - 4, 3); cx.fillRect(x + 2, y + T - 10, T - 4, 3);
      cx.fillStyle = '#c48a4f'; cx.fillRect(x + 8, y + 2, 3, T - 4);
      break;
    }
    case CHEST: {
      const open = W.opened.has(c + ',' + r);
      cx.fillStyle = '#4a2a10'; cx.fillRect(x + 2, y + 10, T - 4, T - 10);
      cx.fillStyle = '#9a5b22'; cx.fillRect(x + 4, y + 12, T - 8, T - 14);
      if (open) {
        cx.fillStyle = '#ffd93b'; cx.fillRect(x + 6, y + 10, T - 12, 4);
        cx.fillStyle = '#6b3d16'; cx.fillRect(x + 2, y + 2, T - 4, 6);
      } else {
        cx.fillStyle = '#6b3d16'; cx.fillRect(x + 2, y + 4, T - 4, 8);
        cx.fillStyle = '#9a5b22'; cx.fillRect(x + 4, y + 5, T - 8, 5);
      }
      cx.fillStyle = '#e8b830'; cx.fillRect(x + 2, y + 10, T - 4, 2); cx.fillRect(x + 14, y + 12, 4, 6);
      break;
    }
    case SPRING: {
      const sq = W.springT.get(c + ',' + r) || 0, top = y + 8 + sq * 24;
      cx.fillStyle = '#2b2b33'; cx.fillRect(x + 3, y + T - 6, T - 6, 6);
      cx.strokeStyle = '#c9d1de'; cx.lineWidth = 2; cx.beginPath();
      for (let i = 0; i <= 4; i++) { const yy = top + 6 + (y + T - 6 - top - 6) * i / 4; cx.lineTo(x + (i % 2 ? 24 : 8), yy); }
      cx.stroke();
      cx.fillStyle = '#e8475f'; cx.fillRect(x + 2, top, T - 4, 7);
      cx.fillStyle = '#ff8fa0'; cx.fillRect(x + 4, top + 1, T - 8, 2);
      break;
    }
    case ICE: {
      cx.fillStyle = 'rgba(150,220,255,.9)'; cx.fillRect(x, y, T, 14);
      cx.fillStyle = '#e8fbff'; cx.fillRect(x, y, T, 3);
      cx.fillStyle = 'rgba(255,255,255,.7)'; cx.fillRect(x + 6, y + 5, 8, 2); cx.fillRect(x + 20, y + 8, 5, 2);
      cx.fillStyle = 'rgba(150,220,255,.8)';
      for (let i = 0; i < 3; i++) { const ix = x + 4 + i * 10; cx.beginPath(); cx.moveTo(ix, y + 14); cx.lineTo(ix + 3, y + 22 + hash(c, r + i) * 6); cx.lineTo(ix + 6, y + 14); cx.fill(); }
      break;
    }
    case CRUMBLE: {
      const cr = W.crumble.get(c + ',' + r), shake = cr && cr.t > 0 ? (Math.random() - .5) * 3 : 0;
      cx.fillStyle = '#5c5468'; cx.fillRect(x + shake, y, T, 14);
      cx.fillStyle = '#8a8299'; cx.fillRect(x + 1 + shake, y + 1, T - 2, 10);
      cx.strokeStyle = '#3e384a'; cx.lineWidth = 1.5; cx.beginPath();
      cx.moveTo(x + 8 + shake, y + 1); cx.lineTo(x + 12 + shake, y + 6); cx.lineTo(x + 9 + shake, y + 11);
      cx.moveTo(x + 22 + shake, y + 1); cx.lineTo(x + 19 + shake, y + 7); cx.stroke();
      break;
    }
    case SPIKE: {
      cx.fillStyle = '#c9d1de';
      for (let i = 0; i < 3; i++) { const sx = x + 2 + i * 10; cx.beginPath(); cx.moveTo(sx, y + T); cx.lineTo(sx + 5, y + 16); cx.lineTo(sx + 10, y + T); cx.fill(); }
      cx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) cx.fillRect(x + 6 + i * 10, y + 18, 1, 4);
      break;
    }
  }
}

function drawMover(m) {
  const x = Math.round(m.x), y = m.y;
  cx.fillStyle = '#3a3f4a'; cx.fillRect(x, y, m.w, 12);
  cx.fillStyle = '#8c96a8'; cx.fillRect(x, y, m.w, 9);
  cx.fillStyle = '#c3cbd8'; cx.fillRect(x, y, m.w, 2);
  cx.fillStyle = '#e8b830';
  for (let i = 8; i < m.w - 4; i += 16) { cx.beginPath(); cx.arc(x + i, y + 5, 2.5, 0, Math.PI * 2); cx.fill(); }
  // gear underneath
  cx.save(); cx.translate(x + m.w / 2, y + 16); cx.rotate(m.x / 10);
  cx.fillStyle = '#5f6670'; for (let i = 0; i < 6; i++) { cx.rotate(Math.PI / 3); cx.fillRect(-2, -8, 4, 16); }
  cx.beginPath(); cx.arc(0, 0, 5, 0, Math.PI * 2); cx.fill();
  cx.restore();
  // rail showing where it travels
  cx.fillStyle = 'rgba(200,210,230,.15)'; cx.fillRect(m.minX, y + 15, m.maxX - m.minX, 2);
}

function drawCoin(co) {
  const s = Math.abs(Math.cos(C.t * 4 + co.x)), bob = Math.sin(C.t * 3 + co.y) * 2;
  cx.fillStyle = '#b8860b'; cx.fillRect(co.x - 7 * s - 1, co.y - 8 + bob, 14 * s + 2, 16);
  cx.fillStyle = '#ffd93b'; cx.fillRect(co.x - 7 * s, co.y - 7 + bob, 14 * s, 14);
  cx.fillStyle = '#fff6b0'; cx.fillRect(co.x - 3 * s, co.y - 5 + bob, 2 * s, 8);
}

function drawItem(it) {
  const x = it.x, y = it.y + Math.sin(it.t * 3) * 3;
  cx.fillStyle = 'rgba(255,255,255,.12)'; cx.beginPath(); cx.arc(x, y, 15 + Math.sin(it.t * 5) * 2, 0, Math.PI * 2); cx.fill();
  if (it.k === 'feather') {
    cx.save(); cx.translate(x, y); cx.rotate(-.6);
    cx.fillStyle = '#e8fbff'; cx.beginPath(); cx.ellipse(0, 0, 5, 12, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#7fd8ff'; cx.fillRect(-1, -12, 2, 24);
    cx.restore();
  } else if (it.k === 'shield') {
    cx.fillStyle = '#2e86de'; cx.beginPath(); cx.moveTo(x - 10, y - 10); cx.lineTo(x + 10, y - 10); cx.lineTo(x + 10, y); cx.lineTo(x, y + 12); cx.lineTo(x - 10, y); cx.fill();
    cx.fillStyle = '#7fd8ff'; cx.beginPath(); cx.moveTo(x - 6, y - 7); cx.lineTo(x, y - 7); cx.lineTo(x, y + 7); cx.lineTo(x - 6, y - 1); cx.fill();
  } else if (it.k === 'magnet') {
    cx.strokeStyle = '#e8475f'; cx.lineWidth = 6; cx.beginPath(); cx.arc(x, y - 2, 8, Math.PI, 0, true); cx.stroke();
    cx.fillStyle = '#e8475f'; cx.fillRect(x - 11, y - 2, 6, 8); cx.fillRect(x + 5, y - 2, 6, 8);
    cx.fillStyle = '#e8eef5'; cx.fillRect(x - 11, y + 6, 6, 4); cx.fillRect(x + 5, y + 6, 6, 4);
  } else if (it.k === 'heart') {
    cx.fillStyle = '#ff4d6d'; cx.beginPath(); cx.arc(x - 5, y - 3, 6, 0, Math.PI * 2); cx.arc(x + 5, y - 3, 6, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.moveTo(x - 11, y - 1); cx.lineTo(x, y + 11); cx.lineTo(x + 11, y - 1); cx.fill();
    cx.fillStyle = '#ffb3c1'; cx.fillRect(x - 7, y - 6, 3, 3);
  } else if (it.k === 'rocket') {
    cx.fillStyle = '#ff7a1a'; cx.fillRect(x - 3, y + 8, 6, 4 + Math.random() * 4);
    cx.fillStyle = '#d6dbe3'; cx.fillRect(x - 5, y - 6, 10, 14);
    cx.fillStyle = '#e8475f'; cx.beginPath(); cx.moveTo(x - 5, y - 6); cx.lineTo(x, y - 14); cx.lineTo(x + 5, y - 6); cx.fill();
    cx.fillRect(x - 9, y + 2, 4, 6); cx.fillRect(x + 5, y + 2, 4, 6);
    cx.fillStyle = '#2e86de'; cx.fillRect(x - 2, y - 3, 4, 4);
  }
}

function drawEnemy(e) {
  if (e.k === 'slime') {
    const sq = Math.sin(e.t * 7) * 2;
    cx.fillStyle = '#2f8a22'; cx.fillRect(e.x - sq / 2, e.y + 2 + sq, e.w + sq, e.h - 2 - sq);
    cx.fillStyle = '#6be04f'; cx.fillRect(e.x + 2 - sq / 2, e.y + 4 + sq, e.w - 4 + sq, e.h - 8 - sq);
    cx.fillStyle = '#fff'; const ex = e.vx > 0 ? 10 : 4;
    cx.fillRect(e.x + ex, e.y + 6 + sq, 4, 4); cx.fillRect(e.x + ex + 6, e.y + 6 + sq, 4, 4);
    cx.fillStyle = '#000'; const px = e.vx > 0 ? 2 : 0;
    cx.fillRect(e.x + ex + px, e.y + 8 + sq, 2, 2); cx.fillRect(e.x + ex + 6 + px, e.y + 8 + sq, 2, 2);
  } else {
    const f = Math.sin(e.t * 18) > 0 ? -6 : 2;
    cx.fillStyle = '#5b2e9e';
    cx.beginPath(); cx.moveTo(e.x + 6, e.y + 4); cx.lineTo(e.x - 8, e.y + f); cx.lineTo(e.x + 2, e.y + 10); cx.fill();
    cx.beginPath(); cx.moveTo(e.x + 14, e.y + 4); cx.lineTo(e.x + 28, e.y + f); cx.lineTo(e.x + 18, e.y + 10); cx.fill();
    cx.fillStyle = '#a46bff'; cx.fillRect(e.x + 4, e.y, 12, 12);
    cx.fillStyle = '#ff3b5c'; cx.fillRect(e.x + 6, e.y + 4, 2, 2); cx.fillRect(e.x + 12, e.y + 4, 2, 2);
  }
}

// ---------- characters ----------
// A round, big-eyed blob: one rounded body, two big eyes that look where
// you're heading, rosy cheeks and little feet. (x, y) is the 20×26 hitbox.
function tint(hex, amt) {
  const n = parseInt(hex.slice(1), 16), to = amt < 0 ? 0 : 255, k = Math.abs(amt);
  const ch = v => Math.round(v + (to - v) * k);
  return `rgb(${ch(n >> 16)},${ch(n >> 8 & 255)},${ch(n & 255)})`;
}
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawGim(g, x, y, col, face, o = {}) {
  const midX = x + 10, bottom = y + 26;
  const st = o.stretch || 0;                 // + taller (rising), - squashed (falling/landing)
  const bw = 24 - st * 1.5, bh = 25 + st * 2;
  const bx = midX - bw / 2, by = bottom - 3 - bh;
  const step = o.walk ? Math.sin(o.walk) * 2.5 : 0;

  // feet
  g.fillStyle = tint(col, -.45);
  g.beginPath(); g.ellipse(midX - 5 + step, bottom - 2, 4.5, 3, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(midX + 5 - step, bottom - 2, 4.5, 3, 0, 0, Math.PI * 2); g.fill();
  // little arms, raised while in the air
  g.fillStyle = tint(col, -.15);
  const armY = o.air ? by + bh * .38 : by + bh * .62;
  g.beginPath(); g.ellipse(bx - 1, armY, 3, 4.5, o.air ? -.6 : .3, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(bx + bw + 1, armY, 3, 4.5, o.air ? .6 : -.3, 0, Math.PI * 2); g.fill();
  // body with a darker outline
  g.fillStyle = tint(col, -.38); rrect(g, bx - 1.5, by - 1.5, bw + 3, bh + 3, 12); g.fill();
  g.fillStyle = col; rrect(g, bx, by, bw, bh, 11); g.fill();
  g.fillStyle = tint(col, .28);
  g.beginPath(); g.ellipse(midX + face, by + bh * .74, bw * .3, bh * .17, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.4)';
  g.beginPath(); g.ellipse(bx + 6, by + 4.5, 3.5, 2, -.4, 0, Math.PI * 2); g.fill();
  // eyes
  const ex = midX + face * 2.5, ey = by + bh * .38;
  const blink = o.blink !== false && (Math.floor((C.t + (o.seed || 0)) * 10) % 37 === 0);
  for (const s of [-1, 1]) {
    const cxe = ex + s * 4.6;
    if (blink) { g.fillStyle = '#1a1030'; g.fillRect(cxe - 3, ey, 6, 1.5); continue; }
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(cxe, ey, 3.8, 4.8, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1a1030'; g.beginPath(); g.ellipse(cxe + face * 1.3, ey + .6, 2.2, 3.1, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cxe + face * 1.3 - .8, ey - .8, .9, 0, Math.PI * 2); g.fill();
  }
  // cheeks and smile
  g.fillStyle = 'rgba(255,120,150,.55)';
  g.beginPath(); g.ellipse(ex - 8.2, ey + 5, 2.2, 1.4, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(ex + 8.2, ey + 5, 2.2, 1.4, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#1a1030'; g.lineWidth = 1.2; g.lineCap = 'round';
  g.beginPath();
  if (o.air && o.vy < 0) g.arc(ex, ey + 6.5, 1.8, 0, Math.PI * 2);   // "oh!" mid-jump
  else g.arc(ex, ey + 5, 2.6, .25 * Math.PI, .75 * Math.PI);
  g.stroke();
}

function drawPlayer(p) {
  if (p.inv > 0 && Math.floor(p.inv * 10) % 2) return;
  const x = Math.round(p.x), y = Math.round(p.y);
  if (p.shield) {
    cx.strokeStyle = `rgba(127,216,255,${.5 + Math.sin(C.t * 6) * .2})`; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(x + p.w / 2, y + p.h / 2, 21, 0, Math.PI * 2); cx.stroke();
  }
  if (p.feather > 0) {
    cx.fillStyle = '#e8fbff';
    cx.beginPath(); cx.ellipse(x - 5, y + 10, 4, 7, -.5, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.ellipse(x + 25, y + 10, 4, 7, .5, 0, Math.PI * 2); cx.fill();
  }
  drawGim(cx, x, y, GIM_COLORS[ME.col], p.face, {
    stretch: p.onGround ? 0 : (p.vy < 0 ? 1.5 : -1), walk: p.walk, air: !p.onGround, vy: p.vy,
  });
}

// other players in a live game, smoothed between updates
function drawGhosts(dt) {
  if (!NET.r) return;
  for (const p of NET.list) {
    if (p.me || p.st !== 'play' || p.round !== NET.myRound) continue;
    const g = NET.ghosts.get(p.peer); if (!g) continue;
    const k = Math.min(1, dt * 12), mx = p.x - g.rx;
    g.rx += mx * k; g.ry += (p.y - g.ry) * k;
    g.walk = Math.abs(mx) > .5 ? g.walk + dt * 10 : 0;
    cx.globalAlpha = .92;
    drawGim(cx, Math.round(g.rx), Math.round(g.ry), GIM_COLORS[p.col], p.f, { walk: g.walk, seed: p.col * 1.7 });
    cx.globalAlpha = 1;
  }
}
function nameTag(text, x, y, col) {
  cx.font = "bold 9px 'Nunito', system-ui, sans-serif"; cx.textAlign = 'center'; cx.textBaseline = 'bottom';
  const w = cx.measureText(text).width + 8;
  cx.fillStyle = 'rgba(0,0,0,.55)'; rrect(cx, x - w / 2, y - 13, w, 12, 5); cx.fill();
  cx.fillStyle = col; cx.fillText(text, x, y - 2);
}
function drawNameTags() {
  if (!NET.r) return;
  for (const p of NET.list) {
    if (p.me || p.st !== 'play' || p.round !== NET.myRound) continue;
    const g = NET.ghosts.get(p.peer); if (g) nameTag(p.nm, g.rx + 10, g.ry - 4, '#fff');
  }
  for (const p of C.players) nameTag(ME.name || 'You', p.x + 10, p.y - 4, GIM_COLORS[ME.col]);
}

function drawLava(ox, vw, oy, vh) {
  const y = C.lavaY;
  if (y > oy + vh + 20) return;
  const x0 = Math.max(0, ox - 16), x1 = Math.min(WW, ox + vw + 16), bottom = oy + vh + 20;
  cx.fillStyle = 'rgba(255,90,20,.18)'; cx.fillRect(x0, y - 30, x1 - x0, 30);
  cx.fillStyle = '#d9361a';
  cx.beginPath(); cx.moveTo(x0, bottom);
  for (let x = Math.floor(x0 / 16) * 16; x <= x1 + 16; x += 16) cx.lineTo(x, y + Math.sin(x * .05 + C.t * 3) * 4);
  cx.lineTo(x1, bottom); cx.fill();
  cx.fillStyle = '#ff8a1f'; cx.fillRect(x0, y + 8, x1 - x0, Math.max(0, bottom - y));
  cx.fillStyle = '#ffd23b';
  for (let i = 0; i < 24; i++) {
    const bx = (i * 71 + C.t * 20) % WW, by = y + 14 + ((i * 37 + C.t * 30) % 60);
    cx.fillRect(bx, by, 4, 4);
  }
}

// ---------- darkness ----------
// Paint the screen dark, then cut soft holes for you, torches, treasure and lava.
function drawDarkness(ox, oy) {
  const cam = C.cam, k = cam.z * DPR;
  const sx = wx => (wx - ox) * k, sy = wy => (wy - oy) * k;
  lx.setTransform(1, 0, 0, 1, 0, 0);
  lx.globalCompositeOperation = 'source-over';
  lx.clearRect(0, 0, lc.width, lc.height);
  lx.fillStyle = `rgba(4,1,10,${Math.min(.96, .88 + C.height * .0002)})`;
  lx.fillRect(0, 0, lc.width, lc.height);
  lx.globalCompositeOperation = 'destination-out';
  const hole = (wx, wy, r, a = 1) => {
    const X = sx(wx), Y = sy(wy), Rr = r * k;
    if (X < -Rr || Y < -Rr || X > lc.width + Rr || Y > lc.height + Rr) return;
    const g = lx.createRadialGradient(X, Y, 0, X, Y, Rr);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.55, `rgba(0,0,0,${a * .75})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = g; lx.beginPath(); lx.arc(X, Y, Rr, 0, Math.PI * 2); lx.fill();
  };
  for (const p of C.players) hole(p.x + p.w / 2, p.y + p.h / 2, 5.4 * T);
  for (const g of NET.ghosts.values()) hole(g.rx + 10, g.ry + 13, 2.6 * T, .8);
  for (const d of W.decor) if (d.k === 'torch') hole(d.c * T + 16, d.r * T + 14, (2.6 + Math.sin(C.t * 9 + d.c) * .12) * T, .85);
  for (const co of W.coins) if (!co.got) hole(co.x, co.y, .7 * T, .45);
  for (const it of W.items) if (!it.got) hole(it.x, it.y, 1.3 * T, .7);
  if (C.lavaY < oy + lc.height / k + 5 * T) {
    const top = sy(C.lavaY - 5 * T), bot = sy(C.lavaY);
    const g = lx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
    lx.fillStyle = g; lx.fillRect(0, top, lc.width, lc.height - top);
  }
  if (C.state === 'title') hole(ox + SW / cam.z / 2, oy + SH / cam.z * .55, 7 * T, .6);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.drawImage(lc, 0, 0);
}

function draw() {
  const cam = C.cam, k = cam.z * DPR;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = '#07030f'; cx.fillRect(0, 0, cv.width, cv.height);
  if (!W.gen) return;
  let ox = cam.x, oy = cam.y;
  if (C.shake > 0) { ox += (Math.random() - .5) * 6; oy += (Math.random() - .5) * 6; }
  ox = Math.round(ox * k) / k; oy = Math.round(oy * k) / k;
  cx.setTransform(k, 0, 0, k, -ox * k, -oy * k);
  cx.imageSmoothingEnabled = false;

  const vw = SW / cam.z, vh = SH / cam.z;
  const c0 = Math.max(0, Math.floor(ox / T)), c1 = Math.min(COLS - 1, Math.floor((ox + vw) / T));
  const r0 = Math.floor(oy / T), r1 = Math.floor((oy + vh) / T);
  const inView = (x, y, m = 40) => x > ox - m && x < ox + vw + m && y > oy - m && y < oy + vh + m;

  drawBricks(ox, oy, vw, vh);
  for (const d of W.decor) if (inView(d.c * T, d.r * T, 90)) drawDecor(d);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) { const t = tile(c, r); if (t) drawTile(t, c, r); }
  for (const m of W.movers) if (inView(m.x, m.y, 120)) drawMover(m);
  for (const co of W.coins) if (!co.got && inView(co.x, co.y)) drawCoin(co);
  for (const it of W.items) if (!it.got && inView(it.x, it.y)) drawItem(it);
  for (const e of W.ents) if (!e.dead && inView(e.x, e.y)) drawEnemy(e);
  drawGhosts(C.frameDt || 0);
  C.players.forEach(drawPlayer);
  drawNameTags();
  for (const q of C.parts) { cx.globalAlpha = Math.min(1, q.life * 2); cx.fillStyle = q.col; cx.fillRect(q.x, q.y, q.size, q.size); }
  cx.globalAlpha = 1;
  drawLava(ox, vw, oy, vh);

  drawDarkness(ox, oy);

  // screen-space effects
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const below = C.lavaY - (cam.y + vh);
  if (C.state === 'play' && C.lavaT <= 0 && below > 0 && below < 8 * T) {
    const a = (1 - below / (8 * T)) * .55 * (.8 + Math.sin(C.t * 6) * .2);
    const g = cx.createLinearGradient(0, SH, 0, SH * .7);
    g.addColorStop(0, `rgba(255,70,20,${a})`); g.addColorStop(1, 'rgba(255,70,20,0)');
    cx.fillStyle = g; cx.fillRect(0, SH * .7, SW, SH * .3);
  }
  if (C.banner > 0 && C.state === 'play') {
    const fs = Math.min(30, SW / (C.bannerText.length + 2));
    cx.globalAlpha = Math.min(1, C.banner);
    cx.font = `${fs}px 'Press Start 2P', monospace`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = '#000'; cx.fillText(C.bannerText, SW / 2 + 3, SH * .3 + 3);
    cx.fillStyle = '#ffcc29'; cx.fillText(C.bannerText, SW / 2, SH * .3);
    cx.globalAlpha = 1;
  }
}

// ---------- HUD ----------
const hudCache = {};
function setHud(id, text) { if (hudCache[id] !== text) { hudCache[id] = text; $(id).textContent = text; } }
function updateHud() {
  setHud('hHeight', '▲ ' + C.height + 'm');
  setHud('hHearts', '♥'.repeat(Math.max(0, C.hearts)));
  setHud('hCoins', '● ' + C.coins);
  setHud('hLava', C.lavaT > 0 ? 'LAVA IN ' + Math.ceil(C.lavaT) : '');
  const fx = [];
  for (const p of C.players) {
    if (p.shield) fx.push('🛡️');
    if (p.feather > 0) fx.push('🪶' + Math.ceil(p.feather));
    if (p.magnet > 0) fx.push('🧲' + Math.ceil(p.magnet));
  }
  setHud('hFx', fx.join(' '));
}

// ---------- main loop ----------
// Physics run in fixed 1/120 s steps no matter the screen's refresh rate.
function loop() {
  const t = now(), fdt = Math.min(.1, (t - C.last) / 1000);
  C.last = t; C.frameDt = fdt;
  if (C.state === 'play') {
    C.acc += fdt;
    let n = 0;
    while (C.acc >= STEP && n < 15) { update(STEP); C.acc -= STEP; n++; if (C.state !== 'play') break; }
    if (n >= 15) C.acc = 0;
    updateCamera(fdt);
    updateHud();
    sendPresence();
    if ((C.boardT = (C.boardT || 0) - fdt) <= 0) { C.boardT = .3; renderBoard(); }
  } else {
    C.t += fdt;
    if (C.state === 'title' && W.gen) {
      C.cam.z = baseZoom();
      C.cam.x = Math.max(0, (WW - SW / C.cam.z) / 2);
      C.cam.y -= fdt * 22;
      genUpTo(Math.floor(C.cam.y / T) - 30);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

resize();
showAttract();
setState('title');
C.last = now();
requestAnimationFrame(loop);
</script>
</body>
