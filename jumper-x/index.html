function drawCoin(co) {
  const s = Math.max(.15, Math.abs(Math.cos(C.t * 3.5 + co.x))), bob = Math.sin(C.t * 3 + co.y) * 2;
  cx.save(); cx.translate(co.x, co.y + bob); cx.scale(s, 1);
  cx.beginPath(); cx.arc(0, 0, 7.5, 0, Math.PI * 2); fillOut('#ffc61a', 2);
  cx.beginPath(); cx.arc(0, 0, 4.5, 0, Math.PI * 2); fillOut('#ffe27a', 1.2);
  cx.restore();
}

function drawItem(it) {
  const x = it.x, y = it.y + Math.sin(it.t * 3) * 3;
  cx.beginPath(); cx.arc(x, y, 15 + Math.sin(it.t * 5), 0, Math.PI * 2);
  cx.fillStyle = 'rgba(255,255,255,.55)'; cx.fill(); outline(2);
  if (it.k === 'feather') {
    cx.save(); cx.translate(x, y); cx.rotate(-.6);
    cx.beginPath(); cx.ellipse(0, 0, 5, 11, 0, 0, Math.PI * 2); fillOut('#ffffff', 1.6);
    cx.strokeStyle = '#4cc5f0'; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(0, -11); cx.lineTo(0, 13); cx.stroke();
    cx.restore();
  } else if (it.k === 'shield') {
    cx.beginPath(); cx.moveTo(x - 9, y - 9); cx.lineTo(x + 9, y - 9); cx.lineTo(x + 9, y); cx.lineTo(x, y + 11); cx.lineTo(x - 9, y); cx.closePath(); fillOut('#4b7cf0', 2);
    cx.fillStyle = '#9bc1ff'; cx.beginPath(); cx.moveTo(x - 5, y - 6); cx.lineTo(x, y - 6); cx.lineTo(x, y + 6); cx.lineTo(x - 5, y - 1); cx.fill();
  } else if (it.k === 'magnet') {
    cx.lineCap = 'butt';
    cx.beginPath(); cx.arc(x, y - 1, 7, Math.PI, 0, false); cx.lineWidth = 9; cx.strokeStyle = INK; cx.stroke();
    cx.lineWidth = 5.5; cx.strokeStyle = '#ef3b4f'; cx.stroke();
    for (const s of [-1, 1]) { cx.beginPath(); cx.rect(x + s * 7 - 3, y - 1, 6, 9); fillOut(s < 0 ? '#ef3b4f' : '#ef3b4f', 1.6); cx.beginPath(); cx.rect(x + s * 7 - 3, y + 5, 6, 3); fillOut('#e8eef5', 1.4); }
  } else if (it.k === 'heart') {
    cx.beginPath(); cx.moveTo(x, y + 9); cx.bezierCurveTo(x - 14, y - 1, x - 7, y - 12, x, y - 4); cx.bezierCurveTo(x + 7, y - 12, x + 14, y - 1, x, y + 9); fillOut('#ff4d6d', 2);
    cx.fillStyle = '#ffb3c1'; cx.beginPath(); cx.arc(x - 5, y - 4, 1.8, 0, Math.PI * 2); cx.fill();
  } else if (it.k === 'rocket') {
    cx.beginPath(); cx.moveTo(x - 3, y + 8); cx.lineTo(x, y + 13 + Math.random() * 3); cx.lineTo(x + 3, y + 8); cx.closePath(); fillOut('#ff9f2e', 1.4);
    cx.beginPath(); cx.moveTo(x - 8, y + 8); cx.lineTo(x - 5, y + 1); cx.lineTo(x + 5, y + 1); cx.lineTo(x + 8, y + 8); cx.closePath(); fillOut('#ef3b4f', 1.6);
    cx.beginPath(); cx.moveTo(x - 5, y + 7); cx.lineTo(x - 5, y - 4); cx.quadraticCurveTo(x, y - 14, x + 5, y - 4); cx.lineTo(x + 5, y + 7); cx.closePath(); fillOut('#eef2f8', 1.8);
    cx.beginPath(); cx.arc(x, y - 1, 2.2, 0, Math.PI * 2); fillOut('#4cc5f0', 1.2);
  }
}

function drawEnemy(e) {
  if (e.k === 'slime') {
    const sq = Math.sin(e.t * 7) * 1.5, cxm = e.x + e.w / 2, bot = e.y + e.h;
    cx.beginPath();
    cx.moveTo(cxm - e.w / 2 - sq, bot);
    cx.quadraticCurveTo(cxm - e.w / 2 - sq, e.y + sq, cxm, e.y + sq);
    cx.quadraticCurveTo(cxm + e.w / 2 + sq, e.y + sq, cxm + e.w / 2 + sq, bot);
    cx.closePath(); fillOut('#69d147', 2);
    cx.fillStyle = '#b4f19a'; cx.beginPath(); cx.ellipse(cxm - 5, e.y + 5 + sq, 3, 1.6, -.4, 0, Math.PI * 2); cx.fill();
    const ex = cxm + (e.vx > 0 ? 3 : -3);
    for (const s of [-3.5, 3.5]) { cx.beginPath(); cx.arc(ex + s, e.y + 8 + sq, 2.6, 0, Math.PI * 2); fillOut('#fff', 1.2); cx.fillStyle = INK; cx.beginPath(); cx.arc(ex + s + (e.vx > 0 ? .8 : -.8), e.y + 8.4 + sq, 1.2, 0, Math.PI * 2); cx.fill(); }
  } else {
    const f = Math.sin(e.t * 18) * 6;
    for (const s of [-1, 1]) {
      cx.beginPath(); cx.moveTo(e.x + 10 + s * 5, e.y + 4); cx.lineTo(e.x + 10 + s * 18, e.y - 2 + f); cx.lineTo(e.x + 10 + s * 14, e.y + 6 + f * .5); cx.lineTo(e.x + 10 + s * 9, e.y + 10); cx.closePath();
      fillOut('#7b4fd6', 1.6);
    }
    cx.beginPath(); cx.arc(e.x + 10, e.y + 6, 7, 0, Math.PI * 2); fillOut('#a97bff', 2);
    for (const s of [-2.6, 2.6]) { cx.beginPath(); cx.arc(e.x + 10 + s, e.y + 5, 1.8, 0, Math.PI * 2); fillOut('#fff', 1); }
    cx.fillStyle = '#fff'; cx.beginPath(); cx.moveTo(e.x + 8, e.y + 9); cx.lineTo(e.x + 9, e.y + 11); cx.lineTo(e.x + 10, e.y + 9); cx.fill();
  }
}

// ---------- characters ----------
// A round, big-eyed blob drawn around its feet (0, 0): one rounded body, two
// big eyes that look where you're heading, rosy cheeks, little feet and an
// optional hat. Squash, stretch and lean come in through the transform.
function tint(hex, amt) {
  const n = parseInt(hex.slice(1), 16), to = amt < 0 ? 0 : 255, k = Math.abs(amt);
  const ch = v => Math.round(v + (to - v) * k);
  return `rgb(${ch(n >> 16)},${ch(n >> 8 & 255)},${ch(n & 255)})`;
}
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

const HATS = [
  { id: 'none',   name: 'No hat',     price: 0 },
  { id: 'party',  name: 'Party Hat',  price: 15 },
  { id: 'cap',    name: 'Cap',        price: 30 },
  { id: 'bow',    name: 'Bow',        price: 45 },
  { id: 'phones', name: 'Headphones', price: 70 },
  { id: 'tophat', name: 'Top Hat',    price: 100 },
  { id: 'crown',  name: 'Crown',      price: 150 },
  { id: 'halo',   name: 'Halo',       price: 250 },
];
const HAT_IDS = HATS.map(h => h.id);

function drawHat(g, id, top, face) {
  const P = Math.PI;
  if (id === 'party') {
    g.fillStyle = '#5b7cff'; g.beginPath(); g.moveTo(-7, top + 3); g.lineTo(7, top + 3); g.lineTo(face * 2, top - 14); g.closePath(); g.fill();
    g.save(); g.clip();
    g.fillStyle = '#ffd23b'; for (let i = 0; i < 3; i++) g.fillRect(-9, top - 1 - i * 5, 18, 2);
    g.restore();
    g.fillStyle = '#ff5d6c'; g.beginPath(); g.arc(face * 2, top - 14, 2.6, 0, P * 2); g.fill();
  } else if (id === 'cap') {
    g.fillStyle = '#e8475f'; g.beginPath(); g.ellipse(0, top + 4, 11, 7.5, 0, P, 0); g.fill();
    g.fillStyle = '#b8283e'; g.beginPath(); g.ellipse(face * 9, top + 4, 7.5, 2.2, 0, 0, P * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(0, top - 3, 1.6, 0, P * 2); g.fill();
  } else if (id === 'bow') {
    const bx = -face * 6, by = top + 1;
    g.fillStyle = '#ff73c6';
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx - 7, by - 5); g.lineTo(bx - 7, by + 5); g.fill();
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + 7, by - 5); g.lineTo(bx + 7, by + 5); g.fill();
    g.fillStyle = '#d94a9c'; g.beginPath(); g.arc(bx, by, 2.4, 0, P * 2); g.fill();
  } else if (id === 'phones') {
    g.strokeStyle = '#2b2b33'; g.lineWidth = 3; g.beginPath(); g.arc(0, top + 9, 13, P * 1.08, P * 1.92); g.stroke();
    g.fillStyle = '#2b2b33'; rrect(g, -15.5, top + 4, 6, 11, 3); g.fill(); rrect(g, 9.5, top + 4, 6, 11, 3); g.fill();
    g.fillStyle = '#2ec7e8'; rrect(g, -14.5, top + 6, 3, 7, 1.5); g.fill(); rrect(g, 11.5, top + 6, 3, 7, 1.5); g.fill();
  } else if (id === 'tophat') {
    g.fillStyle = '#16131f'; g.fillRect(-11, top, 22, 3); g.fillRect(-7.5, top - 13, 15, 14);
    g.fillStyle = '#e8475f'; g.fillRect(-7.5, top - 4, 15, 3);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(-5.5, top - 12, 2, 8);
  } else if (id === 'crown') {
    g.fillStyle = '#ffcc29';
    g.beginPath(); g.moveTo(-9, top + 2); g.lineTo(-9, top - 7); g.lineTo(-4.5, top - 2); g.lineTo(0, top - 10);
    g.lineTo(4.5, top - 2); g.lineTo(9, top - 7); g.lineTo(9, top + 2); g.closePath(); g.fill();
    g.fillStyle = '#c99400'; g.fillRect(-9, top, 18, 2);
    g.fillStyle = '#ff5d6c'; g.beginPath(); g.arc(0, top - 3, 1.8, 0, P * 2); g.fill();
    g.fillStyle = '#2ec7e8'; g.beginPath(); g.arc(-5.5, top - 1, 1.3, 0, P * 2); g.arc(5.5, top - 1, 1.3, 0, P * 2); g.fill();
  } else if (id === 'halo') {
    const b = Math.sin(C.t * 3) * 1.5;
    g.strokeStyle = 'rgba(255,220,90,.35)'; g.lineWidth = 5; g.beginPath(); g.ellipse(0, top - 7 + b, 9, 3, 0, 0, P * 2); g.stroke();
    g.strokeStyle = '#ffe066'; g.lineWidth = 2; g.beginPath(); g.ellipse(0, top - 7 + b, 9, 3, 0, 0, P * 2); g.stroke();
  }
}

// o: { walk, air, vy, look (-1..1 eye direction), blink, hat, seed }
function drawGimLocal(g, col, face, o = {}) {
  // a Gim-style gumdrop: rounded dome on top, flat soft bottom, big eyes, stubby limbs
  // walking is a bouncy little hop; standing still is a slow gentle bob
  const top = -31, hop = o.walk ? -Math.abs(Math.sin(o.walk * .9)) * 3.5 : 0;
  const bob = o.idle ? Math.sin(C.t * 2.6) * .8 : 0, look = o.look ?? face;
  const tuck = o.air ? -2 : 0;
  g.save(); g.translate(0, hop);
  const edge = tint(col, -.62);
  g.lineJoin = 'round'; g.lineCap = 'round';

  // feet
  g.lineWidth = 2; g.strokeStyle = edge; g.fillStyle = tint(col, -.22);
  for (const s of [-1, 1]) {
    g.beginPath(); g.ellipse(s * 6, -2.6 + tuck, 5, 3.4, 0, 0, Math.PI * 2);
    g.fill(); g.stroke();
  }
  g.save(); g.translate(0, bob + tuck * .5);
  // arms
  const armY = o.air ? top + 14 : top + 20, swing = o.walk ? Math.sin(o.walk * 1.8) * .35 : 0;
  g.fillStyle = col;
  g.beginPath(); g.ellipse(-14, armY, 3.4, 5, o.air ? -.8 : .35 + swing, 0, Math.PI * 2); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(14, armY, 3.4, 5, o.air ? .8 : -.35 + swing, 0, Math.PI * 2); g.fill(); g.stroke();
  // body
  const body = () => {
    g.beginPath();
    g.moveTo(-13.5, -9);
    g.bezierCurveTo(-14.5, top + 7, -9, top, 0, top);
    g.bezierCurveTo(9, top, 14.5, top + 7, 13.5, -9);
    g.quadraticCurveTo(13.5, -3, 7.5, -3);
    g.lineTo(-7.5, -3);
    g.quadraticCurveTo(-13.5, -3, -13.5, -9);
    g.closePath();
  };
  body(); g.fillStyle = col; g.fill();
  g.save(); body(); g.clip();
  g.fillStyle = tint(col, -.15); g.beginPath(); g.ellipse(5, -2, 20, 11, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = tint(col, .28); g.beginPath(); g.ellipse(-6, top + 4, 7, 4, -.4, 0, Math.PI * 2); g.fill();
  g.restore();
  body(); g.lineWidth = 2.6; g.strokeStyle = edge; g.stroke();

  // big eyes: dark ovals with a lighter inner ring and a shine
  const ex = look * 2.6, ey = top + 12 + (o.air ? (o.vy < 0 ? -1 : 1) : 0);
  const blink = o.blink !== false && (Math.floor((C.t + (o.seed || 0)) * 10) % 37 === 0);
  const happy = o.happy > 0;
  for (const s of [-1, 1]) {
    const cxe = ex + s * 5.4;
    if (blink || happy) {
      g.strokeStyle = '#141628'; g.lineWidth = 2;
      g.beginPath();
      if (happy) g.arc(cxe, ey + 1.5, 3, 1.15 * Math.PI, 1.85 * Math.PI); else { g.moveTo(cxe - 3.4, ey); g.lineTo(cxe + 3.4, ey); }
      g.stroke(); continue;
    }
    g.fillStyle = '#141628'; g.beginPath(); g.ellipse(cxe, ey, 4, 5.2, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = tint(col, .35); g.beginPath(); g.ellipse(cxe + look * .8, ey + .6, 2.3, 3, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#141628'; g.beginPath(); g.ellipse(cxe + look * 1, ey + .8, 1.3, 1.8, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cxe - 1.4, ey - 2.2, 1.2, 0, Math.PI * 2); g.fill();
  }
  if (o.hat && o.hat !== 'none') drawHat(g, o.hat, top + 2, face);
  g.restore();
  g.restore();
}

// draw at a hitbox position with squash (sx, sy) and lean around the feet
function drawGim(g, x, y, col, face, o = {}) {
  g.save();
  g.translate(x + 10, y + 26);
  if (o.lean) g.rotate(o.lean);
  g.scale(o.sx || 1, o.sy || 1);
  drawGimLocal(g, col, face, o);
  g.restore();
}

// springy squash & stretch, leaning and eye movement for your character
function kick(p, sx, sy) { p.sx = sx; p.sy = sy; p.svx = 0; p.svy = 0; }
function animate(p, dt) {
  for (const [s, v] of [['sx', 'svx'], ['sy', 'svy']]) {
    p[v] += ((1 - p[s]) * 320 - p[v] * 16) * dt;
    p[s] += p[v] * dt;
  }
  p.lean = 0;
  p.look += (p.face - p.look) * Math.min(1, dt * 12);
  if (p.happy > 0) p.happy -= dt;
  // little dust puffs while running
  if (p.onGround && Math.abs(p.vx) > 55 && (p.dustT -= dt) <= 0) {
    p.dustT = .16;
    C.parts.push({ x: p.x + p.w / 2 - p.face * 8, y: p.y + p.h - 2, vx: -p.face * 20, vy: -15, life: .35, col: 'rgba(220,210,240,.55)', size: 3, g: 0 });
  }
}
function landDust(p, power) {
  for (let i = 0; i < 4 + power * 6; i++) {
    const s = i % 2 ? 1 : -1;
    C.parts.push({ x: p.x + p.w / 2 + s * 6, y: p.y + p.h - 2, vx: s * (30 + Math.random() * 60 * power), vy: -10 - Math.random() * 25,
                   life: .3 + Math.random() * .2, col: 'rgba(220,210,240,.6)', size: 2 + Math.random() * 3, g: 0 });
  }
}

function drawPlayer(p) {
  if (p.inv > 0 && Math.floor(p.inv * 10) % 2) return;
  const x = Math.round(p.x), y = Math.round(p.y);
  if (p.shield) {
    cx.strokeStyle = `rgba(127,216,255,${.5 + Math.sin(C.t * 6) * .2})`; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(x + p.w / 2, y + p.h / 2, 21, 0, Math.PI * 2); cx.stroke();
  }
  if (p.feather > 0) {
    const f = Math.sin(C.t * 14) * .3;
    cx.fillStyle = '#e8fbff';
    cx.beginPath(); cx.ellipse(x - 5, y + 10, 4, 7, -.5 - f, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.ellipse(x + 25, y + 10, 4, 7, .5 + f, 0, Math.PI * 2); cx.fill();
  }
  if (p.onGround) { cx.fillStyle = 'rgba(0,0,0,.22)'; cx.beginPath(); cx.ellipse(x + 10, y + 26, 10, 2.5, 0, 0, Math.PI * 2); cx.fill(); }
  drawGim(cx, x, y, GIM_COLORS[ME.col], p.face, {
    walk: p.walk, idle: p.onGround && Math.abs(p.vx) < 5, air: !p.onGround, vy: p.vy, look: p.look, hat: ME.hat, happy: p.happy,
  });
}

// other players in a live game, smoothed between updates
function drawGhosts(dt) {
  if (!NET.r) return;
  for (const p of NET.list) {
    if (p.me || p.st !== 'play' || p.round !== NET.myRound) continue;
    const g = NET.ghosts.get(p.peer); if (!g) continue;
    const k = Math.min(1, dt * 12), mx = p.x - g.rx, my = p.y - g.ry;
    g.rx += mx * k; g.ry += my * k;
    const vy = dt > 0 ? my * k / dt : 0;
    g.walk = Math.abs(mx) > .5 && Math.abs(my) < 1 ? g.walk + dt * 10 : 0;
    g.look = (g.look ?? p.f) + (p.f - (g.look ?? p.f)) * Math.min(1, dt * 12);
    const air = Math.abs(my) > 1;
    cx.globalAlpha = .92;
    drawGim(cx, Math.round(g.rx), Math.round(g.ry), GIM_COLORS[p.col], p.f,
      { walk: g.walk, idle: !air && !g.walk, air, vy, look: g.look, hat: p.hat, seed: p.col * 1.7 });
    cx.globalAlpha = 1;
  }
}
function nameTag(text, x, y) {
  cx.font = "8px 'Lilita One', sans-serif"; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.lineJoin = 'round'; cx.lineWidth = 2.4; cx.strokeStyle = INK;
  cx.strokeText(text, x, y); cx.fillStyle = '#fff'; cx.fillText(text, x, y);
}
function drawNameTags() {
  for (const p of NET.list) {
    if (p.me || p.st !== 'play' || p.round !== NET.myRound) continue;
    const g = NET.ghosts.get(p.peer); if (g) nameTag(p.nm, g.rx + 10, g.ry + 34);
  }
  for (const p of C.players) nameTag(ME.name || 'You', p.x + 10, p.y + 33);
}

// floating "+1", "STOMP!" and friends
function popText(x, y, txt, col, big) { C.texts.push({ x, y, txt, col, life: 1, big: !!big }); }
function drawTexts() {
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const t of C.texts) {
    const age = 1 - t.life, pop = age < .12 ? .6 + age / .12 * .5 : 1.1 - Math.min(.1, (age - .12));
    cx.globalAlpha = Math.min(1, t.life * 2.2);
    cx.font = `${(t.big ? 11 : 8) * pop}px 'Lilita One', sans-serif`;
    cx.lineJoin = 'round'; cx.lineWidth = 2.6; cx.strokeStyle = INK;
    cx.strokeText(t.txt, t.x, t.y); cx.fillStyle = t.col; cx.fillText(t.txt, t.x, t.y);
  }
  cx.globalAlpha = 1;
}

// outlined cartoon text in screen space
function bigText(text, x, y, size, fill, align = 'center', skew = 0) {
  cx.save(); cx.translate(x, y); if (skew) cx.transform(1, 0, skew, 1, 0, 0);
  cx.font = `${size}px 'Lilita One', sans-serif`; cx.textAlign = align; cx.textBaseline = 'middle';
  cx.lineJoin = 'round'; cx.strokeStyle = INK; cx.lineWidth = Math.max(4, size * .2);
  cx.fillStyle = INK; cx.fillText(text, 0, size * .09);
  cx.strokeText(text, 0, 0); cx.fillStyle = fill; cx.fillText(text, 0, 0);
  cx.restore();
}

const MAIN = cx;

function draw() {
  const cam = C.cam, z = cam.z;
  if (!W.gen) { MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.fillStyle = '#5ccff3'; MAIN.fillRect(0, 0, cv.width, cv.height); return; }
  let camX = cam.x, camY = cam.y;
  if (C.shake > 0) { camX += (Math.random() - .5) * 5; camY += (Math.random() - .5) * 5; }
  const k = z * DPR;
  MAIN.setTransform(k, 0, 0, k, 0, 0);
  MAIN.imageSmoothingEnabled = true;
  drawSky(SW / z, SH / z);
  MAIN.setTransform(k, 0, 0, k, -camX * k, -camY * k);

  const ox = camX, oy = camY, vw = SW / z, vh = SH / z;
  const c0 = Math.max(0, Math.floor(ox / T)), c1 = Math.min(COLS - 1, Math.floor((ox + vw) / T));
  const r0 = Math.floor(oy / T) - 1, r1 = Math.floor((oy + vh) / T);
  const inView = (x, y, m = 40) => x > ox - m && x < ox + vw + m && y > oy - m && y < oy + vh + m;

  if (oy + vh > -200) { drawGroundDecor(); if (C.state !== 'title') drawTutorial(); }
  for (const d of W.decor) if (inView(WW / 2, d.r * T, Math.max(140, WW))) drawDecor(d);
  drawTiles(c0, c1, r0, r1);
  for (const m of W.movers) if (inView(m.x, m.y, 140)) drawMover(m);
  for (const co of W.coins) if (!co.got && inView(co.x, co.y)) drawCoin(co);
  for (const it of W.items) if (!it.got && inView(it.x, it.y)) drawItem(it);
  for (const e of W.ents) if (!e.dead && inView(e.x, e.y)) drawEnemy(e);
  drawGhosts(C.frameDt || 0);
  C.players.forEach(drawPlayer);
  for (const q of C.parts) { cx.globalAlpha = Math.min(1, q.life * 2); cx.fillStyle = q.col; cx.fillRect(q.x, q.y, q.size, q.size); }
  cx.globalAlpha = 1;
  drawNameTags();
  drawTexts();

  // screen-space effects
  MAIN.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (C.banner > 0 && C.state === 'play') {
    const age = C.bannerMax - C.banner, slide = Math.min(1, age / .3), out = Math.min(1, C.banner / .4);
    MAIN.globalAlpha = out;
    if (C.bannerZone) {
      const xx = -260 + 276 * (1 - Math.pow(1 - slide, 3)), size = Math.min(44, SW / 11);
      bigText('ZONE ' + (C.zone + 1), xx + 4, SH * .4 - size * .9, size * .55, '#ffffff', 'left', -.12);
      bigText(C.bannerText, xx, SH * .4, size, '#5fd93a', 'left', -.12);
    } else {
      const s = Math.min(1, age / .18) * (1 + Math.max(0, .18 - Math.abs(age - .18)) * 1.5);
      bigText(C.bannerText, SW / 2, SH * .3, Math.min(56, SW / 7) * s, '#ffd23b');
    }
    MAIN.globalAlpha = 1;
  }
}

// ---------- HUD ----------
const hudCache = {};
function setHud(id, text) { if (hudCache[id] !== text) { hudCache[id] = text; $(id).textContent = text; } }
function updateHud() {
  setHud('hHeight', 'Height: ' + C.height + 'm');
  setHud('hHearts', '♥'.repeat(Math.max(0, C.hearts)));
  setHud('hCoins', C.coins.toLocaleString());
  const fx = [];
  for (const p of C.players) {
    if (p.shield) fx.push('🛡️');
    if (p.feather > 0) fx.push('🪶' + Math.ceil(p.feather));
    if (p.magnet > 0) fx.push('🧲' + Math.ceil(p.magnet));
  }
  setHud('hFx', fx.join(' '));
}

// ---------- main loop ----------
// Physics run in fixed 1/120 s steps no matter the screen's refresh rate.
function loop() {
  const t = now(), fdt = Math.min(.1, (t - C.last) / 1000);
  C.last = t; C.frameDt = fdt;
  if (C.state === 'play') {
    C.acc += fdt;
    let n = 0;
    while (C.acc >= STEP && n < 15) { update(STEP); C.acc -= STEP; n++; if (C.state !== 'play') break; }
    if (n >= 15) C.acc = 0;
    updateCamera(fdt);
    updateHud();
    sendPresence();
    if ((C.boardT = (C.boardT || 0) - fdt) <= 0) { C.boardT = .3; renderBoard(); }
  } else {
    C.t += fdt;
    if (C.state === 'title' && W.gen) {
      C.cam.z = baseZoom();
      C.cam.x = Math.max(0, (WW - SW / C.cam.z) / 2);
      C.cam.y -= fdt * 22;
      genUpTo(Math.floor(C.cam.y / T) - 30);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

resize();
showAttract();
setState('title');
C.last = now();
requestAnimationFrame(loop);
</script>
